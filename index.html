/* 産地モード：蒸留所の一覧 ／ 味・香りモード：銘柄の一覧 */
function zkDistilleries(){
  const q = norm(zk.q);
  let ds = ZD.slice();
  if(q) ds = ds.filter(d=>norm([d.name,d.en,ZR[d.region]?.jp,...d.ex.flatMap(x=>[x.name,x.en,x.label,x.cask,...x.tags])].join(' ')).includes(q));
  if(!q){
    if(!zk.country) return [];
    if(zk.country==='scot'){ if(!zk.region) return []; ds = ds.filter(d=>d.region===zk.region); }
    else if(zk.region) ds = ds.filter(d=>d.region===zk.region);
    else ds = ds.filter(d=>ZK_COUNTRIES[zk.country].regions.includes(d.region));
  }
  return ds.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}
function zkFlavorResults(){
  const q = norm(zk.q);
  let items = [...ZE, ...communityItems()];
  if(q) items = items.filter(z=>norm([z.name,z.en,z.distillery,z.type,z.cask,ZR[z.region]?.jp,...z.tags].join(' ')).includes(q));
  if(zk.types.length) items = items.filter(z=>zk.types.includes(z.type));
  if(zk.prices.length) items = items.filter(z=>z.price && zk.prices.some(k=>{ const r=ZK_PRICES.find(x=>x[0]===k); return z.price>=r[2] && z.price<r[3]; }));
  const has = zk.axes.length || zk.tags.length;
  let rows = items.map(z=>{
    const ax = zk.axes.length ? zk.axes.reduce((s,k)=>s+z.p[AXES.findIndex(a=>a[0]===k)]/5,0)/zk.axes.length : 0;
    const tg = zk.tags.length ? zk.tags.filter(t=>z.tags.includes(t)).length/zk.tags.length : 0;
    const score = zk.axes.length && zk.tags.length ? ax*0.65+tg*0.35 : zk.axes.length ? ax : tg;
    return { z, score };
  });
  if(zk.tags.length) rows = rows.filter(r=>zk.tags.some(t=>r.z.tags.includes(t)));
  if(has) rows = rows.filter(r=>r.score>=0.45).sort((a,b)=>b.score-a.score || (a.z.price||0)-(b.z.price||0));
  else if(zk.prices.length) rows.sort((a,b)=>(a.z.price||0)-(b.z.price||0) || a.z.name.localeCompare(b.z.name,'ja'));
  else rows.sort((a,b)=>a.z.name.localeCompare(b.z.name,'ja'));
  return { items:rows, scored:has };
}
const priceRange = d => { const ps=d.ex.map(x=>x.price).filter(Boolean); if(!ps.length) return '';
  const lo=priceBand(Math.min(...ps)), hi=priceBand(Math.max(...ps)); return lo===hi ? lo : `${lo}〜${hi}`; };
function dCard(d){
  const tags=[...new Set(d.ex.flatMap(x=>x.tags))].slice(0,4);
  const recorded = d.ex.some(x=>{ const b=bottleForZ(x); return b && aggs.get(b.id)?.n; });
  return `<button class="zcard" data-d="${esc(d.id)}"><span class="gl" style="background:${glassColor(d.ex[0].color)}"></span>
    <span class="info"><h3>${esc(d.name)}</h3><div class="en">${esc(d.en)}</div>
      <div class="meta">${esc(ZR[d.region]?.jp||'')} · 約${esc(priceRange(d))}${recorded?'<span class="badge peat">みんなの記録あり</span>':''}</div>
      <div class="tagline">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></span>
    <span class="right"><b>${d.ex.length}</b><i>銘柄</i></span></button>`;
}
function zCard({z,score}, scored){
  const b = z.community ? bottles.find(x=>x.id===z.bottleId) : bottleForZ(z);
  const a = b ? aggs.get(b.id) : null;
  const meta=[z.community?z.distillery:'', ZR[z.region]?.jp, z.abv?z.abv+'%':'', z.price?'約'+priceBand(z.price):''].filter(Boolean).join(' · ');
  const right = scored ? `<b>${Math.round(score*100)}<small style="font-size:11px">%</small></b><i>一致</i>`
    : a?.n ? `<b>${a.n>1?fmt1(a.avg):a.avg}</b><i>みんな${a.people}人</i>` : '';
  return `<button class="zcard" data-z="${esc(z.id)}"><span class="gl" style="background:${glassColor(z.color)}"></span>
    <span class="info"><h3>${esc(z.name)}${z.community?'<span class="badge peat">みんなの記録</span>':''}</h3>${z.en?`<div class="en">${esc(z.en)}</div>`:''}
      <div class="meta">${esc(meta||z.type||'')}</div>
      ${z.tags.length?`<div class="tagline">${z.tags.slice(0,4).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
      ${scored?`<div class="matchbar"><i style="width:${Math.round(score*100)}%"></i></div>`:''}</span>
    <span class="right">${right}</span></button>`;
}

function drawZkResults(){
  if(K.isFood) return isCk() ? drawCocktailResults() : drawRecipeResults();
  const el=$('#zk-results'); if(!el) return;
  if(zk.mode==='grape'){ const g=$('#grape-list'); if(g) g.innerHTML=grapeCards(); el.innerHTML=''; return; }
  if(zk.mode==='glass'){ const g=$('#wg-list'); if(g) g.innerHTML=glassCards(); el.innerHTML=''; return; }
  if(zk.mode==='region'){
    const ds = zkDistilleries();
    if(!zk.q && (!zk.country || (zk.country==='scot' && !zk.region))){ el.innerHTML=''; return; }
    const title = zk.q ? `「${esc(zk.q)}」` : zk.country==='scot' ? esc(zk.region==='scotland'?'ブレンデッドスコッチ':ZR[zk.region]?.jp||'') : zk.region ? esc(ZR[zk.region]?.jp||'') : esc(ZK_COUNTRIES[zk.country].jp);
    const regs = zk.q ? [] : zk.region ? [zk.region] : ZK_COUNTRIES[zk.country].regions;
    const extra = communityItems().filter(c=>regs.includes(c.region));
    el.innerHTML = `<div class="zk-head"><b>${title}</b><span>${ds.length}${L.makerCount}・${ds.reduce((s,d)=>s+d.ex.length,0)}銘柄</span></div>
      <div class="list" style="padding-top:8px">${ds.length?ds.map(dCard).join(''):`<div class="empty" style="padding:24px 8px"><p>該当する${L.makerCount}がありません。</p></div>`}
      ${extra.length?`<div class="zk-head" style="margin-top:6px"><b style="font-size:14px">みんなが記録した銘柄</b><span>${extra.length}銘柄</span></div>${extra.map(z=>zCard({z},false)).join('')}`:''}</div>`;
    return;
  }
  const { items, scored } = zkFlavorResults();
  const title = zk.q ? `「${esc(zk.q)}」` : (scored || zk.prices.length || zk.types.length) ? '条件に合う銘柄' : 'すべての銘柄';
  el.innerHTML = `<div class="zk-head"><b>${title}</b><span>${items.length}銘柄</span></div>
    <div class="list" style="padding-top:8px">${items.length?items.map(it=>zCard(it,scored)).join(''):`<div class="empty" style="padding:24px 8px"><p>該当する銘柄がありません。条件を減らしてみてください。</p></div>`}</div>`;
}

  const w=t.closest('[data-world]'); if(w){ const k=w.dataset.world; zk.region = zk.region===k?null:k; renderZukan($('#list')); navCommit(); return; }

function roastBrewSection(z){
  const r=z.roast||[]; if(!r.length && !(z.brew||[]).length) return '';
  const idx=r.map(k=>ROAST_KEYS.indexOf(k)).filter(i=>i>=0); const mid=idx.length?idx[Math.floor((idx.length-1)/2)]:4;
  let txt = mid<=2 ? '浅煎りで、この豆ならではの華やかな香りと明るい酸を生かしたい。焼きすぎると個性が隠れてしまう。'
    : mid<=4 ? '中煎りから中深煎りで、酸と甘さ、苦みのバランスがとれる。まずはこのあたりから試したい。'
    : mid===5 ? '中深煎りから深煎りで、酸が穏やかになり、甘さとコクが引き出される。'
    : '深煎りで、苦みとコクをしっかり引き出したい。ミルクとの相性もよくなる。';
  if(/ナチュラル/.test(z.type) && !/パルプド/.test(z.type)) txt += '自家焙煎では、ナチュラルの豆は焼きむらが出やすいので、火力を少し控えてじっくり焼くとよい。';
  else if(/パルプド|ハニー/.test(z.type)) txt += '糖分が多く焦げやすいので、自家焙煎では後半の火力に注意したい。';
  else if(z.type==='スマトラ式') txt += 'スマトラ式の豆は水分が多めなので、自家焙煎では最初の水抜きをしっかり行うと、むらなく焼ける。';
  else if(/ピーベリー/.test(z.name)) txt += '丸いピーベリーは豆の中で転がりやすく、火が均一に入りやすい。';
  return `<section class="sec"><h3>おすすめの焙煎と淹れ方<small>ROAST &amp; BREW</small></h3>
    ${r.length?`<div class="roastbar">${KINDS.coffee.COLORS.map(c=>`<div class="rb${r.includes(c[0])?' on':''}"><i style="background:${c[2]}"></i><span>${c[1]}</span></div>`).join('')}</div>
    <div class="roastscale"><span>← 浅煎り</span><span>深煎り →</span></div>
    <p class="rtext"><b>おすすめの焙煎度：${esc(roastRange(z))}</b><br>${esc(txt)}</p>`:''}
    ${(z.brew||[]).length?`<div class="group-name" style="margin-top:12px">おすすめの淹れ方</div><div class="brews">${z.brew.map(b=>`<div class="brew"><b>${esc(b)}</b><span>${esc(BREW_NOTE[b]||'')}</span></div>`).join('')}</div>`:''}
  </section>`;
}

        : t==='hard'||t==='semihard' ? '薄く切るか手で割って、常温に少し戻すと香りが開く。'
        : 'そのまま気軽に。';
    } else serve = z.howto ? `${z.howto}。塩分が多いものは、少しずつ味わいたい。` : '';
    return `<div class="z-detail">${body.length?`<p>${esc(body.join(''))}</p>`:''}${serve?`<p><b>おすすめの食べ方</b>${esc(serve)}</p>`:''}</div>`;
  }
  if(price && price<=1500) body.push('手頃な価格で、日常の一本にしやすい。');
  else if(price>=30000) body.push('特別な日に開けたい一本。');
  if(!body.length && !serve) return '';
  return `<div class="z-detail">${body.length?`<p>${esc(body.join(''))}</p>`:''}${serve?`<p><b>おすすめの飲み方</b>${esc(serve)}</p>`:''}</div>`;
}

/* ---------- ワイングラス ---------- */
const WGL = () => (typeof WINE_GLASSES!=='undefined' ? WINE_GLASSES : []);
const wGlass = id => WGL().find(g=>g.id===id) || null;
const WG_TINT = { bordeaux:'#73202D', burgundy:'#9B2E35', universal:'#8A2A33', white:'#EEDC8E', montrachet:'#E4C463', flute:'#F1E3A0', tulip:'#EAD285', dessert:'#C98A2E', copita:'#E8D79A' };
let wgSeq=0;
function wineGlassSVG(g, color, w=52){
  const s=g.s, c=30, R=s.rw/2, M=s.mw/2, k=1.4, a=(s.ym-s.t)*.45, bb=(s.yb-s.ym)*.6;
  const bowl=`M${c-R},${s.t} C${c-R},${s.t+a} ${c-M},${s.ym-a} ${c-M},${s.ym} C${c-M},${s.ym+bb} ${c-k-4},${s.yb} ${c-k},${s.yb} L${c+k},${s.yb} C${c+k+4},${s.yb} ${c+M},${s.ym+bb} ${c+M},${s.ym} C${c+M},${s.ym-a} ${c+R},${s.t+a} ${c+R},${s.t} Z`;
  const id='wgc'+(++wgSeq), col=color||WG_TINT[g.id]||'#8A2A33';
  return `<svg class="wg-svg" viewBox="0 0 60 100" width="${w}" height="${Math.round(w*100/60)}" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${bowl}"/></clipPath></defs>
    <rect x="0" y="${s.lv}" width="60" height="${100-s.lv}" fill="${col}" opacity=".9" clip-path="url(#${id})"/>
    <path d="${bowl}" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M${c},${s.yb} L${c},${s.st}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="${c}" cy="${s.st+1.5}" rx="${s.fw/2}" ry="2.4" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-width="1.3"/></svg>`;
}
const RED_FULL=['cabernet','merlot','cabfranc','carmenere','malbec','tempranillo','touriga','syrah','montepulciano'];
const RED_FINE=['pinot','nebbiolo','gamay'];
const wgGrapeName = id => { const g=(typeof WINE_GRAPES!=='undefined'?WINE_GRAPES:[]).find(x=>x.id===id); return g ? g.name.replace(/（.*?）/,'') : ''; };
// w: { type, grapes[], p{fruit,acid,...}, region, name, cask }
function recommendGlass(w){
  const p=w.p||{}, g0=(w.grapes||[])[0], t=w.type||'', nm=(w.name||'')+' '+(w.cask||'');
  const body=p.body||0, tan=p.tannin||0, acid=p.acid||0, oak=p.oak||0, sweet=p.sweet||0, aged=p.earthy||0;
  const r=(id,alt,why)=>({id,alt,why});
  if(t==='酒精強化'){
    if(w.region==='jerez' || g0==='palomino' || /シェリー|フィノ|マンサニーリャ|アモンティリャード|オロロソ|ティオ・ペペ/.test(nm))
      return r('copita','white','辛口のシェリーは、細い飲み口に香りを集めるコピータで。ナッツや塩気のニュアンスがはっきり感じられる。');
    return r('dessert','universal','ポートのように甘く濃い酒精強化ワインは、小ぶりのグラスで少量ずつゆっくりと。ドライフルーツやチョコレートのような香りが集まる。');
  }
  if(t==='甘口・デザート' || (sweet>=4 && t!=='スパークリング'))
    return r('dessert','white','甘口ワインは小ぶりのグラスで。すぼまった飲み口が蜂蜜やドライフルーツの香りを集め、甘さの後ろの酸味を感じさせてくどさを抑える。');
  if(t==='スパークリング'){
    if(w.region==='champagne' || /シャンパーニュ|シャンパン|champagne/i.test(nm)){
      const rich = aged>=3 || body>=4;
      return r('tulip', rich?'white':'flute', rich ? '熟成による複雑な香りを持つシャンパーニュ。チューリップ型で泡と香りの両方を楽しめる。白ワイン用グラスで香りを広げて飲むのもおすすめ。' : 'シャンパーニュは、泡を保ちながらブリオッシュのような香りも開くチューリップ型で。');
    }
    return r('flute','tulip', sweet>=3 ? '甘く軽やかなスパークリングは、泡が長持ちするフルート型で。よく冷やしてフレッシュな香りを楽しむ。' : '軽やかなスパークリングは、泡が長持ちするフルート型で。よく冷やして爽快感を楽しむ。');
  }
  if(t==='ロゼ') return r('white','universal','辛口のロゼは小ぶりの白ワイン用グラスで、冷たさを保ちながら。果実味の豊かなものは万能型でも。');
  if(t==='白' || t==='オレンジ'){
    if(oak>=3 || (body>=4 && ['chardonnay','semillon'].includes(g0)))
      return r('montrachet','universal',`樽熟成によるコクのある${g0?wgGrapeName(g0)+'の':''}白。口の広い大ぶりのグラスで空気に触れさせると、バターやナッツのような香りがふくらむ。`);
    return r('white','universal', ['riesling','gewurz'].includes(g0) ? `華やかな香りの${wgGrapeName(g0)}。小ぶりのグラスで冷たさを保ちながら、すぼまった飲み口で果実や花の香りを集める。`
      : 'すっきりした白は小ぶりのグラスで。冷たさを保ち、爽やかな香りと酸味をいきいきと感じられる。');
  }
  // 赤（タイプ未記入も赤として扱う）
  if(RED_FINE.includes(g0)) return r('burgundy','universal',
    g0==='nebbiolo' ? '香り高く、酸味と渋みのあるネッビオーロ。大きなボウルのブルゴーニュ型で、バラやスミレ、熟成の香りを開かせて。'
    : g0==='gamay' ? '軽やかで果実味豊かなガメイ。丸いボウルのブルゴーニュ型で香りを広げて。万能型でも十分楽しめる。'
    : '繊細なピノ・ノワールは、香りを大きく広げて閉じ込めるブルゴーニュ型で。酸味がやわらかく、果実の甘さを感じやすくなる。');
  if(RED_FULL.includes(g0) || (body>=4 && tan>=3))
    return r('bordeaux','universal',`${g0?wgGrapeName(g0)+'主体の、':''}渋みと果実味がしっかりした赤。背の高いボルドー型で空気に触れさせると、渋みがまろやかになり香りが開く。`);
  if(!g0 && acid>=4 && tan<=2) return r('burgundy','universal','酸味が豊かで渋みの穏やかな赤。ブルゴーニュ型で香りを広げると、果実の甘さが感じやすくなる。');
  return r('universal', body>=3?'bordeaux':'burgundy', `${g0?wgGrapeName(g0)+'の、':''}ミディアムボディの赤。中ぶりの万能型グラスで、果実味と酸味のバランスよく楽しめる。`);
}
const wgCache=new Map();
function wineInfoZ(z){ return { type:z.type, grapes:z.grapes||[], p:arrProf(z.p||[]), region:z.region, name:z.name, cask:z.cask, color:z.color }; }
function glassFor(z){ if(!wgCache.has(z.id)) wgCache.set(z.id, recommendGlass(wineInfoZ(z))); return wgCache.get(z.id); }
function wineInfoBottle(b,a){
  const z=zukanFor(b);

    const i=Math.min(...names.map(n=>{ const j=txt.toLowerCase().indexOf(n.toLowerCase()); return j<0?1e9:j; })); return [g.id,i]; }).filter(x=>x[1]<1e9).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);
  const regionKey=Object.keys(ZR).find(k=>(ZR[k].picks||[ZR[k].pick]).filter(Boolean).includes(b.region)) || (/ヘレス|シェリー/.test(b.region||'')?'jerez':/シャンパーニュ/.test(b.region||'')?'champagne':null);
  const colorTop=(Object.entries(a?.colors||{}).sort((x,y)=>y[1]-x[1])[0]||[])[0]||'';
  return { type:b.type||'', grapes:hits, p:a?.avgProfile||{}, region:regionKey, name:b.name, cask:b.cask, color:colorTop };
}
function wineGlassSection(w){

function glassCards(){

      <span class="info"><h3>${esc(g.name)}</h3><div class="en">${esc(g.en)}</div><div class="meta">${esc(g.shape)}</div></span>

const FSEASON = () => (typeof FOOD_SEASON!=='undefined' ? FOOD_SEASON : {});

const monthsText = ms => { if(!ms?.length) return ''; const a=[...ms]; return a.length>2 ? `${a[0]}〜${a[a.length-1]}月` : a.map(m=>m+'月').join('・'); };

/* お酒の味わい → 料理と合わせるときのタイプ（重み 0〜1） */
function drinkWeights(kind, p, type){
  const v = k => Math.max(0, Math.min(5, +(p?.[k]||0)))/5; const w={}; const t=String(type||'');
  if(kind==='whisky'){
    w.w_smoky=v('smoky'); w.w_sherry=v('winey');
    w.w_light=((v('fruity')+v('floral'))/2)*(1-v('smoky')*.6);
    w.w_rich=(v('sweet')+v('woody')+v('spicy'))/3;
    if(/バーボン|テネシー|ライ/.test(t)) w.w_rich=Math.max(w.w_rich,.8);
  } else if(kind==='wine'){
    if(/スパークリング/.test(t)){ w.spark=1; w.wh_crisp=.5; }
    else if(/ロゼ/.test(t)){ w.rose=1; w.r_light=.5; w.wh_crisp=.4; }
    else if(/甘口|酒精/.test(t)){ w.dessert=1; if(/酒精/.test(t)) w.w_sherry=.5; }
    else if(/白|オレンジ/.test(t)){ w.wh_crisp=(v('acid')+v('mineral'))/2*(1-v('oak')*.5); w.wh_rich=(v('body')+v('oak'))/2; }
    else { const b=(v('body')+v('tannin'))/2; w.r_full=b; w.r_light=Math.max(.15,1-b)*(.6+v('fruit')*.4); }
  } else if(kind==='brandy'){
    w.w_sherry=(v('dried')+v('nutty'))/2; w.w_rich=(v('sweet')+v('woody'))/2; w.w_light=((v('fruity')+v('floral'))/2)*(1-v('woody')*.6);
    if(v('sweet')>=.8 || /ヘレス/.test(t)) w.dessert=v('sweet');
  } else if(kind==='rum'){
    w.w_rich=(v('vanilla')+v('sweet')+v('woody'))/3; w.w_light=((v('grassy')+v('fruity'))/2)*(1-v('woody')*.6);
    if(v('sweet')>=.8) w.dessert=v('sweet')*.9;
    if(v('funky')>=.8) w.w_sherry=v('funky')*.5;
  } else if(kind==='tequila'){
    w.w_light=(v('citrus')+v('herbal'))/2; w.w_smoky=v('smoky'); w.w_rich=(v('sweet')+v('woody'))/2;
  } else if(kind==='sake'){
    if(/スパークリング/.test(t)){ w.spark=1; w.s_aroma=.4; }
    else { w.s_dry=v('dry'); w.s_rich=(v('umami')+v('body'))/2; w.s_aroma=(v('aroma')*2+v('fresh'))/3; w.s_aged=v('aged'); }
  }
  const mx=Math.max(0,...Object.values(w)); if(!mx) return null;
  Object.keys(w).forEach(k=>{ w[k]=(w[k]/mx)**2; if(w[k]<.08) delete w[k]; });
  return w;
}
function pairScore(w, pairs){
  let s=0, W=0, best=null, bv=0;
  for(const k in w){ const x=w[k]*(pairs?.[k]||0); s+=x; W+=w[k]*3; if(x>bv){ bv=x; best=k; } }
  return { score: W ? s/W : 0, best };
}
// 相性の良い料理（同じ調理法ばかりにならないように）
function pairRecipes(w, n=5){
  const m=nowMonth();
  const all=FR().map(r=>{ const ps=pairScore(w,r.pairs); return { r, best:ps.best, score: ps.score + (inSeason(r,[m])?.03:0) }; })
    .filter(x=>x.best && x.score>.15).sort((a,b)=>b.score-a.score);
  const out=[], cnt={};
  for(const x of all){ if((cnt[x.r.cook]||0)>=2) continue; cnt[x.r.cook]=(cnt[x.r.cook]||0)+1; out.push(x); if(out.length>=n) break; }
  return out;
}
const pct = x => Math.max(1, Math.min(98, Math.round(x*100)));
function rCard(r, o={}){
  const shun = inSeason(r,[nowMonth()]);
  const meta=[r.cook, r.genre, r.time?`約${r.time}分`:''].filter(Boolean).join(' · ');

  return `<button class="zcard rcard" data-recipe="${esc(r.id)}"><span class="gl" style="background:${recipeColor(r)}">${esc(r.main.slice(0,1))}</span>
    <span class="info"><h3>${esc(r.name)}${shun?'<span class="badge shun">旬</span>':''}</h3><div class="meta">${esc(meta)}</div>
      ${o.why?`<div class="tagline"><span>${esc(o.why)}</span></div>`:`<div class="tagline">${(r.tags||[]).slice(0,3).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`}</span>

function pairSection(w, o={}){

// 料理に合う図鑑のお酒
function drinkPicks(kind, r, n=2){
  const Kk=KINDS[kind]; let E=[]; try{ E=Kk.Z().E||[]; }catch(e){ return []; }
  const scored=E.map(z=>{ const w=drinkWeights(kind, Object.fromEntries(Kk.AXES.map((a,i)=>[a[0], z.p?.[i]||0])), z.type); if(!w) return null;
      const ps=pairScore(w, r.pairs); const pr=z.price||0;
      return { z, best:ps.best, score: ps.score*(pr>20000?.85:1)*(pr && pr<=5000?1.04:1) }; })
    .filter(x=>x && x.best && x.score>.2).sort((a,b)=>b.score-a.score || (a.z.price||0)-(b.z.price||0));
  // 造り手もタイプ（合わせ方）も違うものを選ぶ
  const out=[], seen=new Set(), cats=new Set();
  for(const x of scored){ const d=x.z.distilleryId||x.z.id; if(seen.has(d) || cats.has(x.best)) continue; seen.add(d); cats.add(x.best); out.push(x); if(out.length>=n) break; }
  if(out.length<n) for(const x of scored){ if(out.includes(x) || out.some(o=>(o.z.distilleryId||o.z.id)===(x.z.distilleryId||x.z.id))) continue; out.push(x); if(out.length>=n) break; }
  return out;
}

const drinkFit = (r, d) => Math.max(...DRINK_FILTERS.find(x=>x[0]===d)[2].map(c=>r.pairs?.[c]||0));
function recipeResults(){
  const q=norm(zk.q), m=nowMonth();
  let rs=FR().filter(r=>{
    if(q && !norm([r.name,r.cook,r.main,r.genre,r.desc,...(r.tags||[]),...(r.seasonal||[]),...r.ings.map(i=>i[0]),
      ...Object.keys(r.pairs||{}).filter(k=>r.pairs[k]>=2).map(k=>PAIR_CATS[k]?.jp||'')].join(' ')).includes(q)) return false;
    if(fz.mains.length && !fz.mains.includes(r.main)) return false;
    if(fz.cooks.length && !fz.cooks.includes(r.cook)) return false;
    if(fz.genres.length && !fz.genres.includes(r.genre)) return false;
    if(fz.seasons.length){ const ms=fz.seasons.flatMap(s=>s==='now'?[m]:(SEASONS.find(x=>x[0]===s)?.[2]||[])); if(!inSeason(r,ms)) return false; }
    if(fz.ing && !((r.seasonal||[]).includes(fz.ing) || r.ings.some(i=>norm(i[0]).includes(norm(fz.ing))))) return false;
    if(fz.drinks.length && !fz.drinks.some(d=>drinkFit(r,d)>=2)) return false;
    return true;
  });
  if(fz.drinks.length) rs=rs.slice().sort((a,b)=>Math.max(...fz.drinks.map(d=>drinkFit(b,d)))-Math.max(...fz.drinks.map(d=>drinkFit(a,d))));
  else rs=rs.slice().sort((a,b)=>inSeason(b,[m])-inSeason(a,[m]));
  return rs;
}

  }
  if(!rows.length){ list.innerHTML=`<div class="empty"><h2>該当する記録がありません</h2><p>検索語や表示の切り替えを変えてみてください。</p></div>`; return; }

function foodMine(){

  const sc=mine.map(t=>t.score).filter(x=>typeof x==='number'); const avg=sc.reduce((a,b)=>a+b,0)/Math.max(1,sc.length);

      const t=rowToTasting(res.data);

/* ---------- カクテル ---------- */
const CL = () => (typeof COCKTAILS!=='undefined' ? COCKTAILS : []);
const cocktailById = id => CL().find(c=>c.id===id) || null;
const CTOOLS = () => (typeof COCKTAIL_TOOLS!=='undefined' ? COCKTAIL_TOOLS : []);
const CGLASS = () => (typeof COCKTAIL_GLASSES!=='undefined' ? COCKTAIL_GLASSES : []);
const CLINKS = () => (typeof COCKTAIL_LINKS!=='undefined' ? COCKTAIL_LINKS : {});
const glassName = id => CGLASS().find(g=>g.id===id)?.name || '';
const isCk = () => K.book==='cocktail';
const bkList = () => isCk() ? CL() : FR();
const bkById = id => isCk() ? cocktailById(id) : recipeById(id);
const bkColor = r => isCk() ? (r?.color||'var(--amber)') : recipeColor(r);
const bkCard = (r,o) => isCk() ? cCard(r,o) : rCard(r,o);
const CK_BASES = ['ジン','ウォッカ','ラム','テキーラ','ウイスキー','ブランデー','ワイン・シャンパン','日本酒・焼酎','リキュール','ノンアルコール'];
const CK_METHODS = ['シェイク','ステア','ビルド','ブレンド'];
const CK_STRENGTH = ['ノンアルコール','弱め','中くらい','強め'];
const CK_TIME = ['食前','食後','いつでも'];
const CK_TASTE = ['爽快','甘い','甘酸っぱい','ほろ苦い','ドライ','フルーティ','柑橘','ハーブ','ミント','クリーミー','スパイシー','コーヒー','スモーキー','泡'];
function cCard(c, o={}){
  const meta=[c.base, c.method, glassName(c.glass)].filter(Boolean).join(' · ');
  return `<button class="zcard rcard" data-cocktail="${esc(c.id)}"><span class="gl" style="background:${c.color}"></span>
    <span class="info"><h3>${esc(c.name)}</h3><div class="en">${esc(c.en)}</div><div class="meta">${esc(meta)}</div>
      <div class="tagline">${(o.why?[o.why]:c.taste.slice(0,3)).map(t=>`<span>${esc(t)}</span>`).join('')}</div></span>
    <span class="right">${o.right ?? `<b style="font-size:13px">${esc(c.strength)}</b><i>${c.abv?`約${c.abv}%`:'0%'}</i>`}</span></button>`;
}
// 材料のお酒 → 図鑑のおすすめ銘柄
function linkPicks(key, n=3){
  const l=CLINKS()[key]; if(!l || !KINDS[l.k]) return [];
  const E=kEntries(l.k); const out=[];
  (l.ids||[]).forEach(id=>{ const z=E.find(x=>x.id===id); if(z && out.length<n) out.push(z); });
  if(out.length<n) E.filter(z=>!out.includes(z) && (!l.t || l.t.includes(z.type)) && (!l.r || l.r.includes(z.region)) && z.price)
    .sort((a,b)=>a.price-b.price).slice(0,n-out.length).forEach(z=>out.push(z));
  return out;
}
const linkMatches = (l, kind, z) => l.k===kind && ((l.ids||[]).includes(z.id) || ((l.t||l.r) && (!l.t || l.t.includes(z.type)) && (!l.r || l.r.includes(z.region))));
// お酒の銘柄 → 作れるカクテル
function cocktailsFor(kind, z){
  const keys=Object.entries(CLINKS()).filter(([,l])=>linkMatches(l,kind,z)).map(([k])=>k);
  if(!keys.length) return [];
  return CL().filter(c=>c.ings.some(i=>keys.includes(i[2])));
}
function cocktailSection(kind, z){
  const cs=cocktailsFor(kind, z); if(!cs.length) return '';
  return `<section class="sec"><h3>この${esc(KINDS[kind].jp)}で作れるカクテル<small>COCKTAILS</small></h3>
    <p class="small" style="margin:0 0 8px">カクテル図鑑のレシピで、材料のおすすめ銘柄に入っているものや、同じタイプのお酒を使うカクテルです。</p>
    <div class="pchips">${cs.slice(0,10).map(c=>`<button class="chip" data-cocktail="${esc(c.id)}"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}</div></section>`;
}

/* カクテル図鑑 */
const cz = { mode:'list', bases:[], methods:[], strength:[], time:[], taste:[] };
const czCount = () => cz.bases.length+cz.methods.length+cz.strength.length+cz.time.length+cz.taste.length;
function renderCocktails(list){
  const chips=(arr,key,items)=>`<div class="chips">${items.map(v=>`<button class="chip" data-cf="${key}" data-v="${esc(v)}" aria-pressed="${arr.includes(v)}">${esc(v)}</button>`).join('')}</div>`;
  const used=new Set(CL().map(c=>c.base));
  list.innerHTML = `<div class="zk">
    <input class="search" id="zk-q" type="search" placeholder="${L.zkSearch}" aria-label="カクテルを検索" value="${esc(zk.q)}">
    <div class="zk-mode" role="group" aria-label="表示" style="grid-template-columns:1fr 1fr"><button data-cmode="list" aria-pressed="${cz.mode==='list'}">カクテル</button><button data-cmode="tools" aria-pressed="${cz.mode==='tools'}">器具とグラス</button></div>
    ${cz.mode==='list'?`<div class="zk-filter">
      <div class="group-name">ベースのお酒</div>${chips(cz.bases,'bases',CK_BASES.filter(b=>used.has(b)))}
      <div class="group-name">作り方</div>${chips(cz.methods,'methods',CK_METHODS)}
      <div class="group-name">味わい</div>${chips(cz.taste,'taste',CK_TASTE)}
      <div class="group-name">強さ</div>${chips(cz.strength,'strength',CK_STRENGTH)}
      <div class="group-name">飲むタイミング</div>${chips(cz.time,'time',CK_TIME)}
      ${czCount()?`<div><button class="btn small ghost" data-act="cz-clear">条件をクリア</button></div>`:''}
    </div>`:''}
    <div id="zk-results"></div>
    <p class="note-small">${L.zkNote}</p>
  </div>`;
  drawCocktailResults();
}
function drawCocktailResults(){
  const el=$('#zk-results'); if(!el) return;
  const q=norm(zk.q);
  if(cz.mode==='tools'){
    const tl=CTOOLS().filter(t=>!q || norm(t.name+t.desc).includes(q)), gl=CGLASS().filter(g=>!q || norm(g.name+g.desc).includes(q));
    const n = (id, f) => CL().filter(f).length;
    el.innerHTML = `<div class="zk-head"><b>器具</b><span>${tl.length}種類</span></div>
      <div class="ckt-tools">${tl.map(t=>`<div class="ckt-tool"><b>${esc(t.name)}<small>${esc(t.en)}</small></b><p>${esc(t.desc)}</p><span class="small">使うカクテル ${n(t.id,c=>c.tools.includes(t.id))}品</span></div>`).join('')}</div>
      <div class="zk-head" style="margin-top:14px"><b>グラス</b><span>${gl.length}種類</span></div>
      <div class="ckt-tools">${gl.map(g=>`<div class="ckt-tool"><b>${esc(g.name)}<small>${esc(g.en)}</small></b><p>${esc(g.desc)}</p><span class="small">使うカクテル ${n(g.id,c=>c.glass===g.id)}品</span></div>`).join('')}</div>
      <div class="zk-head" style="margin-top:14px"><b>4つの作り方</b></div>
      <div class="ckt-tools">${[['シェイク','シェーカーで材料と氷を激しく振る。一気に冷えて、空気を含んだまろやかな口当たりになる。果汁や卵、クリームなど混ざりにくい材料に向く。'],
        ['ステア','ミキシンググラスで氷と材料を静かに混ぜる。お酒どうしを合わせる、透明感のあるカクテルに。'],
        ['ビルド','グラスに直接材料を注いで作る。ハイボールやジントニックなど、炭酸で割るカクテルの基本。'],
        ['ブレンド','ブレンダーで氷ごと混ぜ、シャーベット状にする。フローズン・カクテルに。']].map(([m,d])=>`<div class="ckt-tool"><b>${m}</b><p>${d}</p><span class="small">${CL().filter(c=>c.method===m).length}品</span></div>`).join('')}</div>`;
    return;
  }
  let rs=CL().filter(c=>{
    if(q && !norm([c.name,c.en,c.base,c.method,glassName(c.glass),c.desc,...c.taste,...c.ings.map(i=>i[0])].join(' ')).includes(q)) return false;
    if(cz.bases.length && !cz.bases.includes(c.base)) return false;
    if(cz.methods.length && !cz.methods.includes(c.method)) return false;
    if(cz.strength.length && !cz.strength.includes(c.strength)) return false;
    if(cz.time.length && !cz.time.includes(c.time)) return false;
    if(cz.taste.length && !cz.taste.some(t=>c.taste.includes(t))) return false;
    return true;
  });
  const title = zk.q ? `「${esc(zk.q)}」` : czCount() ? '条件に合うカクテル' : 'すべてのカクテル';
  el.innerHTML = `<div class="zk-head"><b>${title}</b><span>${rs.length}品</span></div>
    <div class="list" style="padding-top:8px">${rs.length?rs.map(c=>cCard(c)).join(''):`<div class="empty" style="padding:24px 8px"><p>該当するカクテルがありません。条件を減らしてみてください。</p></div>`}</div>`;
}

/* ---------- 2銘柄の比較 ---------- */
function butterfly(A,B){
  return `<div class="bfly">${AXES.map(([k,jp],i)=>{ const a=A.p[i], b=B.p[i];
    return `<div class="bf-row"><em class="bf-n">${a}</em><div class="bf-l"><i style="width:${a*20}%"></i></div><span class="bf-k${a!==b?' diff':''}">${jp}</span><div class="bf-r"><i style="width:${b*20}%"></i></div><em class="bf-n">${b}</em></div>`; }).join('')}</div>`;
}
function openCompare(){
  curSheet={t:'cmp'};
  const A = compare.a ? zEntry(compare.a) : null, B = compare.b ? zEntry(compare.b) : null;
  const slot = (z, key) => z
    ? `<div class="cmp-slot"><span class="gl" style="background:${glassColor(z.color)}"></span><strong>${esc(z.name)}</strong><span class="small">${esc(ZR[z.region]?.jp||'')}</span>
        <div class="cmp-act"><button class="btn small ghost" data-pick="${key}">変更</button><button class="btn small ghost" data-open="${esc(z.id)}">詳細</button></div></div>`
    : `<button class="cmp-slot empty" data-pick="${key}"><span class="plus">＋</span><span>銘柄を選ぶ</span></button>`;
  let body = '';
  if(A && B){
    const sim = similarity(A,B);
    const onlyA = A.tags.filter(t=>!B.tags.includes(t)), onlyB = B.tags.filter(t=>!A.tags.includes(t));
    const rows = [['参考価格',A.price?priceBand(A.price):'—',B.price?priceBand(B.price):'—'], ...K.cmpRows(A,B)];
    const ba=bottleForZ(A), bb=bottleForZ(B); const aa=ba?aggs.get(ba.id):null, ab=bb?aggs.get(bb.id):null;
    body = `
      <section class="sec"><h3>似ている度合い<small>SIMILARITY</small></h3>
        <div class="cmp-sim"><b>${Math.round(sim.score*100)}<small>%</small></b><span>${sim.score>=0.75?'かなり近いタイプ':sim.score>=0.6?'共通点が多い':sim.score>=0.45?'ところどころ似ている':'まったく違うタイプ'}</span></div></section>
      <section class="sec"><h3>基本情報<small>SPEC</small></h3>
        <div class="cmp-table">${rows.map(([k,a,b])=>`<div class="cmp-k">${k}</div><div class="cmp-a${a!==b?' diff':''}">${esc(a||'—')}</div><div class="cmp-b${a!==b?' diff':''}">${esc(b||'—')}</div>`).join('')}</div></section>
      <section class="sec"><h3>味わいの傾向<small>PROFILE</small></h3>
        <div class="radar-wrap">${radarSVG({ single:arrProf(A.p), mine:arrProf(B.p) })}
          <div class="legend"><span><i style="border-color:var(--amber)"></i>${esc(A.name)}</span><span><i style="border-color:var(--peat);border-top-style:dashed"></i>${esc(B.name)}</span></div></div>
        ${butterfly(A,B)}
      </section>
      <section class="sec"><h3>香りと味<small>NOTES</small></h3>
        ${sim.shared.length?`<div class="group-name">共通</div><div class="chips">${sim.shared.map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div>`:''}
        <div class="cmp-tags"><div><div class="group-name" style="color:var(--amber)">${esc(A.label||A.name)}だけ</div><div class="chips">${onlyA.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="small">—</span>'}</div></div>
          <div><div class="group-name">${esc(B.label||B.name)}だけ</div><div class="chips">${onlyB.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="small">—</span>'}</div></div></div>
      </section>
      ${aa?.n||ab?.n?`<section class="sec"><h3>みんなの評価<small>TASTINGS</small></h3>
        <div class="cmp-table"><div class="cmp-k">平均点</div><div class="cmp-a">${aa?.n?(aa.n>1?fmt1(aa.avg):aa.avg)+'点':'記録なし'}</div><div class="cmp-b">${ab?.n?(ab.n>1?fmt1(ab.avg):ab.avg)+'点':'記録なし'}</div>
        <div class="cmp-k">記録した人</div><div class="cmp-a">${aa?.people||0}人</div><div class="cmp-b">${ab?.people||0}人</div></div></section>`:''}
      <section class="sec"><h3>ひとことで<small>SUMMARY</small></h3><p class="small" style="margin:0 0 6px">${esc(A.name)}</p><p style="margin:0 0 12px">${esc(A.desc)}</p><p class="small" style="margin:0 0 6px">${esc(B.name)}</p><p style="margin:0">${esc(B.desc)}</p></section>`;
  } else {
    body = `<p class="hint">2つの銘柄を選ぶと、基本情報・味わいの傾向・香りの違いを並べて比べられます。図鑑の銘柄ページの「比較」ボタンからも追加できます。</p>`;
  }
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄を比較">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 閉じる</button><h2>2つの銘柄を比較</h2>${A||B?`<button class="btn ghost" data-act="cmp-reset">クリア</button>`:'<span style="width:60px"></span>'}</div>
    <div class="sheet-body">
      <div class="cmp-head">${slot(A,'a')}<span class="vs">VS</span>${slot(B,'b')}</div>
      ${A&&B?`<div style="text-align:center"><button class="btn small ghost" data-act="swap">左右を入れ替え</button></div>`:''}
      ${body}
    </div></div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-pick],[data-open]'); if(!el) return;
    if(el.dataset.pick) return openComparePicker(el.dataset.pick);
    if(el.dataset.open) return openZukan(el.dataset.open);
    const act=el.dataset.act;
    if(act==='close') goBack();
    if(act==='cmp-reset'){ compare.a=null; compare.b=null; openCompare(); }
    if(act==='swap'){ [compare.a,compare.b]=[compare.b,compare.a]; openCompare(); }
  };
}
function openComparePicker(slot){
  curSheet={t:'cpick',slot};
  const other = slot==='a' ? compare.b : compare.a;
  const od = other ? zEntry(other)?.distilleryId : null;
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="比較する銘柄を選ぶ">
    <div class="sheet-bar"><button class="btn ghost" data-act="back">‹ 比較</button><h2>銘柄を選ぶ</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <input class="search" id="cp-q" type="search" placeholder="${L.cpPh}" autocomplete="off">
      <div id="cp-list" class="list" style="padding-top:0"></div>
    </div></div>`);
  const draw=()=>{
    const q=norm($('#cp-q').value);
    let ds=ZD;
    if(q) ds=ds.filter(d=>norm([d.name,d.en,...d.ex.flatMap(x=>[x.name,x.en,x.label])].join(' ')).includes(q));
    // 比較相手と同じ蒸留所を先頭に
    if(od && !q) ds=[...ds].sort((a,b)=>(b.id===od)-(a.id===od));
    $('#cp-list').innerHTML = ds.slice(0,40).map(d=>`<div class="cp-group"><div class="group-name">${esc(d.name)} <span class="small">${esc(ZR[d.region]?.jp||'')}</span></div>
      <div class="chips">${d.ex.map(x=>`<button class="chip" data-cp="${esc(x.id)}" ${x.id===other?'disabled':''}>${esc(x.label)}</button>`).join('')}</div></div>`).join('')
      || '<p class="small">該当する銘柄がありません。</p>';
  };
  draw();
  const root=$('#sheet-root');
  root.oninput=e=>{ if(e.target.id==='cp-q') draw(); };
  root.onclick=e=>{
    const el=e.target.closest('[data-act],[data-cp]'); if(!el) return;
    if(el.dataset.cp){ compare[slot]=el.dataset.cp; goBack(); return; }
    if(el.dataset.act==='back') goBack();
  };
}

/* 写真を長辺1600pxのJPEGに縮小 */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,1600/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(),'image/jpeg',.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt=e; });

/* ---------- 戻るボタン（画面の履歴） ----------
   アプリ内の画面遷移を独自の履歴として積み、ブラウザ履歴には「ガード」を1つだけ置く。
   端末の戻るボタン → popstate → 1つ前の画面を復元。最初の画面なら終了の確認を出す。 */
let curSheet = null;
const nav = { stack:[], restoring:false, replaceNext:false, guarded:false, exitOpen:false };
const FORM_SHEETS = ['picker','bform','taste','cpick','daypick','dform'];
const snapKey = s => JSON.stringify({ k:s.kind, v:s.view, z:s.zk, s:s.sheet });
function snap(){ return { kind: kindOpen() ? null : KIND, view, zk:{ mode:zk.mode, country:zk.country, region:zk.region }, sheet: curSheet ? { ...curSheet } : null }; }
function ensureGuard(){ if(!nav.guarded){ try{ history.pushState({ hc:'guard' }, ''); nav.guarded=true; }catch(e){} } }
function navCommit(){
  if(nav.restoring) return;
  const s = snap(), st = nav.stack, top = st[st.length-1];
  if(nav.replaceNext){
    nav.replaceNext=false;
    if(st.length) st.pop();
    // 保存などで画面が切り替わったときは、下に残った入力画面も取り除く
    while(st.length>1 && st[st.length-1].sheet && FORM_SHEETS.includes(st[st.length-1].sheet.t)) st.pop();
    if(st.length && snapKey(st[st.length-1])===snapKey(s)) return;
    st.push(s);
  } else {
    if(top && snapKey(top)===snapKey(s)) return;
    st.push(s);
  }
  if(st.length>1) ensureGuard();
}
function goBack(){ if(nav.stack.length>1) history.back(); }
function restore(s){
  nav.restoring=true; nav.ignoreScrollUntil=performance.now()+400;
  const y=s.y, sy=s.sy;
  try{
    if(s.kind==null){ currentBottle=null; unmount(); setKindsVisible(true); return; }
    if(s.kind!==KIND){ applyKind(s.kind); refilter(); }
    setKindsVisible(false);
    view=s.view; zk.mode=s.zk.mode; zk.country=s.zk.country; zk.region=s.zk.region;
    ['bottles','feed','zukan','mine'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',view===k));
    renderList();
    const sh=s.sheet; let ok=true;
    if(!sh){ currentBottle=null; unmount(); }
    else if(sh.t==='bottle'){ if(bottles.find(x=>x.id===sh.id)) openBottle(sh.id); else ok=false; }
    else if(sh.t==='zukan') openZukan(sh.id);
    else if(sh.t==='dist') openDistillery(sh.id);
    else if(sh.t==='grape') openGrape(sh.id);
    else if(sh.t==='wglass') openWineGlass(sh.id);
    else if(sh.t==='cmp') openCompare();
    else if(sh.t==='cpick') openComparePicker(sh.slot);
    else if(sh.t==='picker') openPicker();
    else if(sh.t==='menu') openMenu();
    else if(sh.t==='recipe'){ if(recipeById(sh.id)) openRecipe(sh.id); else ok=false; }
    else if(sh.t==='cocktail'){ if(cocktailById(sh.id)) openCocktail(sh.id); else ok=false; }
    else if(sh.t==='dform'){ const b=sh.b?bottles.find(x=>x.id===sh.b):null; const t=sh.tid?tastings.find(x=>x.id===sh.tid):null;
      if((sh.b && !b) || (sh.tid && !t)) ok=false; else openDishForm(b, t, sh.rid); }
    else if(sh.t==='taste'){ const b=bottles.find(x=>x.id===sh.b); const t=sh.tid?tastings.find(x=>x.id===sh.tid):null;
      if(b && (!sh.tid || t)) openTastingForm(b,t,sh.fp,sh.day); else ok=false; }
    else if(sh.t==='daypick'){ const b=bottles.find(x=>x.id===sh.b); if(b && myTastingsOf(b.id).length) openDayPick(b,sh.fp); else ok=false; }
    else if(sh.t==='bform'){ const b=sh.id?bottles.find(x=>x.id===sh.id):null;
      if(sh.id && !b) ok=false;
      else openBottleForm(b, sh.prefill, b ? ()=>{ nav.replaceNext=true; openBottle(b.id); } : nb=>{ nav.replaceNext=true; openTastingForm(nb,null,true); }); }
    if(!ok){ curSheet=null; unmount(); }
    curSheet = ok ? s.sheet : null;
    requestAnimationFrame(()=>{ if(s.sheet){ const el=$('#sheet-root .sheet'); if(el && sy) el.scrollTop=sy; } else window.scrollTo(0,y||0); s.y=y; s.sy=sy; });
  } finally { nav.restoring=false; }
}
function showExitConfirm(){
  nav.exitOpen=true;
  $('#exit-dlg').hidden=false;
  $('#exit-no').focus({ preventScroll:true });
}
function hideExitConfirm(){ nav.exitOpen=false; $('#exit-dlg').hidden=true; }
window.addEventListener('popstate',()=>{
  nav.guarded=false;
  if(nav.exitOpen){ hideExitConfirm(); return; }
  if(nav.stack.length>1){ nav.stack.pop(); restore(nav.stack[nav.stack.length-1]); ensureGuard(); }
  else showExitConfirm();
});
// 各画面のスクロール位置を覚えておき、戻ったときに復元する
window.addEventListener('scroll',()=>{ if(performance.now()<(nav.ignoreScrollUntil||0)) return; const t=nav.stack[nav.stack.length-1]; if(t && !t.sheet) t.y=window.scrollY; },{passive:true});
document.addEventListener('scroll',e=>{ if(performance.now()<(nav.ignoreScrollUntil||0)) return; if(e.target.classList && e.target.classList.contains('sheet')){ const t=nav.stack[nav.stack.length-1]; if(t && t.sheet) t.sy=e.target.scrollTop; } },{capture:true,passive:true});
function initNav(){
  if(nav.inited) return; nav.inited=true;
  try{ history.replaceState({ hc:'base' }, ''); }catch(e){}
  nav.stack=[snap()];
  ensureGuard();
  $('#exit-no').onclick=()=>{ hideExitConfirm(); ensureGuard(); };
  $('#exit-yes').onclick=()=>{
    hideExitConfirm();
    try{ window.close(); }catch(e){}
    // 端末によってはアプリ側から閉じられないため、もう一度の戻るで終了できる状態にして案内する
    setTimeout(()=>toast('もう一度戻るボタンを押すと終了します'),250);
  };
}

function mount(html){ const r=$('#sheet-root'); r.onclick=r.oninput=r.onchange=r.onkeydown=null; r.innerHTML=html; document.body.style.overflow='hidden'; const s=$('#sheet-root .sheet'); if(s) s.scrollTop=0; navCommit(); }
function unmount(){ curSheet=null; const r=$('#sheet-root'); r.innerHTML=''; r.onclick=r.oninput=r.onchange=r.onkeydown=null; document.body.style.overflow=''; }

const tab=v=>{ if(view===v) return; view=v; ['bottles','feed','zukan','mine'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',v===k)); renderList(); navCommit(); window.scrollTo(0,0); };

$('#gate-google').onclick = ()=>googleLogin();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
boot();
