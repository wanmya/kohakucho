/* ---------- 2銘柄の比較 ---------- */
function butterfly(A,B){
  return `<div class="bfly">${AXES.map(([k,jp],i)=>{ const a=A.p[i], b=B.p[i];
    return `<div class="bf-row"><em class="bf-n">${a}</em><div class="bf-l"><i style="width:${a*20}%"></i></div><span class="bf-k${a!==b?' diff':''}">${jp}</span><div class="bf-r"><i style="width:${b*20}%"></i></div><em class="bf-n">${b}</em></div>`; }).join('')}</div>`;
}
function openCompare(){
  const A = compare.a ? zEntry(compare.a) : null, B = compare.b ? zEntry(compare.b) : null;
  const slot = (z, key) => z
    ? `<div class="cmp-slot"><span class="gl" style="background:${glassColor(z.color)}"></span><strong>${esc(z.name)}</strong><span class="small">${esc(ZUKAN_REGIONS[z.region]?.jp||'')}</span>
        <div class="cmp-act"><button class="btn small ghost" data-pick="${key}">変更</button><button class="btn small ghost" data-open="${esc(z.id)}">詳細</button></div></div>`
    : `<button class="cmp-slot empty" data-pick="${key}"><span class="plus">＋</span><span>銘柄を選ぶ</span></button>`;
  let body = '';
  if(A && B){
    const sim = similarity(A,B);
    const onlyA = A.tags.filter(t=>!B.tags.includes(t)), onlyB = B.tags.filter(t=>!A.tags.includes(t));
    const rows = [['参考価格',A.price?priceBand(A.price):'—',B.price?priceBand(B.price):'—'],['蒸留所',A.distillery,B.distillery],['産地',ZUKAN_REGIONS[A.region]?.jp,ZUKAN_REGIONS[B.region]?.jp],
      ['種類',A.type,B.type],['熟成',A.age?A.age+'年':'表記なし',B.age?B.age+'年':'表記なし'],['度数',A.abv?A.abv+'%':'—',B.abv?B.abv+'%':'—'],['樽',A.cask||'—',B.cask||'—']];
    const ba=bottleForZ(A), bb=bottleForZ(B); const aa=ba?aggs.get(ba.id):null, ab=bb?aggs.get(bb.id):null;
    body = `
      <section class="sec"><h3>似ている度合い<small>SIMILARITY</small></h3>
        <div class="cmp-sim"><b>${Math.round(sim.score*100)}<small>%</small></b><span>${sim.score>=0.75?'かなり近いタイプ':sim.score>=0.6?'共通点が多い':sim.score>=0.45?'ところどころ似ている':'まったく違うタイプ'}</span></div></section>
      <section class="sec"><h3>基本情報<small>SPEC</small></h3>
        <div class="cmp-table">${rows.map(([k,a,b])=>`<div class="cmp-k">${k}</div><div class="cmp-a${a!==b?' diff':''}">${esc(a||'—')}</div><div class="cmp-b${a!==b?' diff':''}">${esc(b||'—')}</div>`).join('')}</div></section>
      <section class="sec"><h3>味わいの傾向<small>PROFILE</small></h3>
        <div class="radar-wrap">${radarSVG({ single:arrProf(A.p), mine:arrProf(B.p) })}
          <div class="legend"><span><i style="border-color:var(--amber)"></i>${esc(A.name)}</span><span><i style="border-color:var(--peat);border-top-style:dashed"></i>${esc(B.name)}</span></div></div>
        ${butterfly(A,B)}
      </section>
      <section class="sec"><h3>香りと味<small>NOTES</small></h3>
        ${sim.shared.length?`<div class="group-name">共通</div><div class="chips">${sim.shared.map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div>`:''}
        <div class="cmp-tags"><div><div class="group-name" style="color:var(--amber)">${esc(A.label||A.name)}だけ</div><div class="chips">${onlyA.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="small">—</span>'}</div></div>
          <div><div class="group-name">${esc(B.label||B.name)}だけ</div><div class="chips">${onlyB.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="small">—</span>'}</div></div></div>
      </section>
      ${aa?.n||ab?.n?`<section class="sec"><h3>みんなの評価<small>TASTINGS</small></h3>
        <div class="cmp-table"><div class="cmp-k">平均点</div><div class="cmp-a">${aa?.n?(aa.n>1?fmt1(aa.avg):aa.avg)+'点':'記録なし'}</div><div class="cmp-b">${ab?.n?(ab.n>1?fmt1(ab.avg):ab.avg)+'点':'記録なし'}</div>
        <div class="cmp-k">記録した人</div><div class="cmp-a">${aa?.people||0}人</div><div class="cmp-b">${ab?.people||0}人</div></div></section>`:''}
      <section class="sec"><h3>ひとことで<small>SUMMARY</small></h3><p class="small" style="margin:0 0 6px">${esc(A.name)}</p><p style="margin:0 0 12px">${esc(A.desc)}</p><p class="small" style="margin:0 0 6px">${esc(B.name)}</p><p style="margin:0">${esc(B.desc)}</p></section>`;
  } else {
    body = `<p class="hint">2つの銘柄を選ぶと、基本情報・味わいの傾向・香りの違いを並べて比べられます。図鑑の銘柄ページの「比較」ボタンからも追加できます。</p>`;
  }
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄を比較">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 閉じる</button><h2>2つの銘柄を比較</h2>${A||B?`<button class="btn ghost" data-act="cmp-reset">クリア</button>`:'<span style="width:60px"></span>'}</div>
    <div class="sheet-body">
      <div class="cmp-head">${slot(A,'a')}<span class="vs">VS</span>${slot(B,'b')}</div>
      ${A&&B?`<div style="text-align:center"><button class="btn small ghost" data-act="swap">左右を入れ替え</button></div>`:''}
      ${body}
    </div></div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-pick],[data-open]'); if(!el) return;
    if(el.dataset.pick) return openComparePicker(el.dataset.pick);
    if(el.dataset.open) return openZukan(el.dataset.open);
    const act=el.dataset.act;
    if(act==='close'){ unmount(); if(view==='zukan') renderZukan($('#list')); }
    if(act==='cmp-reset'){ compare.a=null; compare.b=null; openCompare(); }
    if(act==='swap'){ [compare.a,compare.b]=[compare.b,compare.a]; openCompare(); }
  };
}
function openComparePicker(slot){
  const other = slot==='a' ? compare.b : compare.a;
  const od = other ? zEntry(other)?.distilleryId : null;
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="比較する銘柄を選ぶ">
    <div class="sheet-bar"><button class="btn ghost" data-act="back">‹ 比較</button><h2>銘柄を選ぶ</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <input class="search" id="cp-q" type="search" placeholder="蒸留所・銘柄名で探す" autocomplete="off">
      <div id="cp-list" class="list" style="padding-top:0"></div>
    </div></div>`);
  const draw=()=>{
    const q=norm($('#cp-q').value);
    let ds=ZUKAN_DISTILLERIES;
    if(q) ds=ds.filter(d=>norm([d.name,d.en,...d.ex.flatMap(x=>[x.name,x.en,x.label])].join(' ')).includes(q));
    // 比較相手と同じ蒸留所を先頭に
    if(od && !q) ds=[...ds].sort((a,b)=>(b.id===od)-(a.id===od));
    $('#cp-list').innerHTML = ds.slice(0,40).map(d=>`<div class="cp-group"><div class="group-name">${esc(d.name)} <span class="small">${esc(ZUKAN_REGIONS[d.region]?.jp||'')}</span></div>
      <div class="chips">${d.ex.map(x=>`<button class="chip" data-cp="${esc(x.id)}" ${x.id===other?'disabled':''}>${esc(x.label)}</button>`).join('')}</div></div>`).join('')
      || '<p class="small">該当する銘柄がありません。</p>';
  };
  draw();
  const root=$('#sheet-root');
  root.oninput=e=>{ if(e.target.id==='cp-q') draw(); };
  root.onclick=e=>{
    const el=e.target.closest('[data-act],[data-cp]'); if(!el) return;
    if(el.dataset.cp){ compare[slot]=el.dataset.cp; openCompare(); return; }
    if(el.dataset.act==='back') openCompare();
  };
}

/* 写真を長辺1600pxのJPEGに縮小 */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,1600/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(),'image/jpeg',.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

const seg=(a,b,set)=>{ $(a).onclick=()=>{set(0);$(a).setAttribute('aria-pressed','true');$(b).setAttribute('aria-pressed','false');renderList();};
  $(b).onclick=()=>{set(1);$(b).setAttribute('aria-pressed','true');$(a).setAttribute('aria-pressed','false');renderList();}; };
seg('#f-all','#f-mine',v=>filter=v?'mine':'all');
$('#sortbar').addEventListener('click',e=>{ const b=e.target.closest('[data-sort]'); if(!b) return; sort=b.dataset.sort;
  $('#sortbar').querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderList(); });
const tab=v=>{ view=v; ['bottles','feed','zukan'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',v===k)); renderList(); window.scrollTo(0,0); };
$('#t-bottles').onclick=()=>tab('bottles'); $('#t-feed').onclick=()=>tab('feed'); $('#t-zukan').onclick=()=>tab('zukan');
$('#add').onclick=openPicker;
$('#menu').onclick=openMenu;

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
boot();
})();
</script>
</body>
