window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt=e; });

/* ---------- 戻るボタン（画面の履歴） ----------
   アプリ内の画面遷移を独自の履歴として積み、ブラウザ履歴には「ガード」を1つだけ置く。
   端末の戻るボタン → popstate → 1つ前の画面を復元。最初の画面なら終了の確認を出す。 */
let curSheet = null;
const nav = { stack:[], restoring:false, replaceNext:false, guarded:false, exitOpen:false };
const FORM_SHEETS = ['picker','bform','taste','cpick','daypick'];
const snapKey = s => JSON.stringify({ k:s.kind, v:s.view, z:s.zk, s:s.sheet });
function snap(){ return { kind: kindOpen() ? null : KIND, view, zk:{ mode:zk.mode, country:zk.country, region:zk.region }, sheet: curSheet ? { ...curSheet } : null }; }
function ensureGuard(){ if(!nav.guarded){ try{ history.pushState({ hc:'guard' }, ''); nav.guarded=true; }catch(e){} } }
function navCommit(){
  if(nav.restoring) return;
  const s = snap(), st = nav.stack, top = st[st.length-1];
  if(nav.replaceNext){
    nav.replaceNext=false;
    if(st.length) st.pop();
    // 保存などで画面が切り替わったときは、下に残った入力画面も取り除く
    while(st.length>1 && st[st.length-1].sheet && FORM_SHEETS.includes(st[st.length-1].sheet.t)) st.pop();
    if(st.length && snapKey(st[st.length-1])===snapKey(s)) return;
    st.push(s);
  } else {
    if(top && snapKey(top)===snapKey(s)) return;
    st.push(s);
  }
  if(st.length>1) ensureGuard();
}
function goBack(){ if(nav.stack.length>1) history.back(); }
function restore(s){
  nav.restoring=true; nav.ignoreScrollUntil=performance.now()+400;
  const y=s.y, sy=s.sy;
  try{
    if(s.kind==null){ currentBottle=null; unmount(); setKindsVisible(true); return; }
    if(s.kind!==KIND){ applyKind(s.kind); refilter(); }
    setKindsVisible(false);
    view=s.view; zk.mode=s.zk.mode; zk.country=s.zk.country; zk.region=s.zk.region;
    ['bottles','feed','zukan','mine'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',view===k));
    renderList();
    const sh=s.sheet; let ok=true;
    if(!sh){ currentBottle=null; unmount(); }
    else if(sh.t==='bottle'){ if(bottles.find(x=>x.id===sh.id)) openBottle(sh.id); else ok=false; }
    else if(sh.t==='zukan') openZukan(sh.id);
    else if(sh.t==='dist') openDistillery(sh.id);
    else if(sh.t==='grape') openGrape(sh.id);
    else if(sh.t==='cmp') openCompare();
    else if(sh.t==='cpick') openComparePicker(sh.slot);
    else if(sh.t==='picker') openPicker();
    else if(sh.t==='menu') openMenu();
    else if(sh.t==='taste'){ const b=bottles.find(x=>x.id===sh.b); const t=sh.tid?tastings.find(x=>x.id===sh.tid):null;
      if(b && (!sh.tid || t)) openTastingForm(b,t,sh.fp,sh.day); else ok=false; }
    else if(sh.t==='daypick'){ const b=bottles.find(x=>x.id===sh.b); if(b && myTastingsOf(b.id).length) openDayPick(b,sh.fp); else ok=false; }
    else if(sh.t==='bform'){ const b=sh.id?bottles.find(x=>x.id===sh.id):null;
      if(sh.id && !b) ok=false;
      else openBottleForm(b, sh.prefill, b ? ()=>{ nav.replaceNext=true; openBottle(b.id); } : nb=>{ nav.replaceNext=true; openTastingForm(nb,null,true); }); }
    if(!ok){ curSheet=null; unmount(); }
    curSheet = ok ? s.sheet : null;
    requestAnimationFrame(()=>{ if(s.sheet){ const el=$('#sheet-root .sheet'); if(el && sy) el.scrollTop=sy; } else window.scrollTo(0,y||0); s.y=y; s.sy=sy; });
  } finally { nav.restoring=false; }
}
function showExitConfirm(){
  nav.exitOpen=true;
  $('#exit-dlg').hidden=false;
  $('#exit-no').focus({ preventScroll:true });
}
function hideExitConfirm(){ nav.exitOpen=false; $('#exit-dlg').hidden=true; }
window.addEventListener('popstate',()=>{
  nav.guarded=false;
  if(nav.exitOpen){ hideExitConfirm(); return; }
  if(nav.stack.length>1){ nav.stack.pop(); restore(nav.stack[nav.stack.length-1]); ensureGuard(); }
  else showExitConfirm();
});
// 各画面のスクロール位置を覚えておき、戻ったときに復元する
window.addEventListener('scroll',()=>{ if(performance.now()<(nav.ignoreScrollUntil||0)) return; const t=nav.stack[nav.stack.length-1]; if(t && !t.sheet) t.y=window.scrollY; },{passive:true});
document.addEventListener('scroll',e=>{ if(performance.now()<(nav.ignoreScrollUntil||0)) return; if(e.target.classList && e.target.classList.contains('sheet')){ const t=nav.stack[nav.stack.length-1]; if(t && t.sheet) t.sy=e.target.scrollTop; } },{capture:true,passive:true});
function initNav(){
  if(nav.inited) return; nav.inited=true;
  try{ history.replaceState({ hc:'base' }, ''); }catch(e){}
  nav.stack=[snap()];
  ensureGuard();
  $('#exit-no').onclick=()=>{ hideExitConfirm(); ensureGuard(); };
  $('#exit-yes').onclick=()=>{
    hideExitConfirm();
    try{ window.close(); }catch(e){}
    // 端末によってはアプリ側から閉じられないため、もう一度の戻るで終了できる状態にして案内する
    setTimeout(()=>toast('もう一度戻るボタンを押すと終了します'),250);
  };
}

function mount(html){ const r=$('#sheet-root'); r.onclick=r.oninput=r.onchange=r.onkeydown=null; r.innerHTML=html; document.body.style.overflow='hidden'; const s=$('#sheet-root .sheet'); if(s) s.scrollTop=0; navCommit(); }
function unmount(){ curSheet=null; const r=$('#sheet-root'); r.innerHTML=''; r.onclick=r.oninput=r.onchange=r.onkeydown=null; document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#sheet-root').children.length) goBack(); });

$('#list').addEventListener('click',e=>{ const c=e.target.closest('[data-bottle]'); if(c) openBottle(c.dataset.bottle); });
$('#q').addEventListener('input',e=>{ query=e.target.value.trim(); renderList(); });
const seg=(a,b,set)=>{ $(a).onclick=()=>{set(0);$(a).setAttribute('aria-pressed','true');$(b).setAttribute('aria-pressed','false');renderList();};
  $(b).onclick=()=>{set(1);$(b).setAttribute('aria-pressed','true');$(a).setAttribute('aria-pressed','false');renderList();}; };
seg('#f-all','#f-mine',v=>filter=v?'mine':'all');
$('#sortbar').addEventListener('click',e=>{ const b=e.target.closest('[data-sort]'); if(!b) return; sort=b.dataset.sort;
  $('#sortbar').querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderList(); });
const tab=v=>{ if(view===v) return; view=v; ['bottles','feed','zukan','mine'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',v===k)); renderList(); navCommit(); window.scrollTo(0,0); };
$('#t-bottles').onclick=()=>tab('bottles'); $('#t-feed').onclick=()=>tab('feed'); $('#t-zukan').onclick=()=>tab('zukan'); $('#t-mine').onclick=()=>tab('mine');
$('#add').onclick=openPicker;
$('#menu').onclick=openMenu;

$('#sheet-root').addEventListener('click', async e=>{
  const w=e.target.closest('[data-wish]'); if(w){ const k=w.dataset.wish; if(await toggleWish(k)) w.outerHTML=wishBtn(k); return; }
  const s=e.target.closest('[data-rid] [data-act]'); if(s) handleSocialClick(s);
});
$('#gate-form').addEventListener('submit',e=>{ e.preventDefault(); submitGate(); });
$('#gate-google').innerHTML = GOOGLE_G + '<span>Googleでログイン</span>';
$('#gate-google').onclick = ()=>googleLogin();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
boot();
})();
