<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIDEOUT CARTER</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ウイスキーやワイン、日本酒のテイスティングを持ち寄り、銘柄ごとにみんなの感じ方を集めるノート">
<meta name="theme-color" content="#F1EEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HIDEOUT CARTER">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="config.js"></script>
<script src="zukan-data.js"></script>
<script src="wine-data.js"></script>
<script src="sake-data.js"></script>
<script src="spirits-data.js"></script>
<script src="coffee-data.js"></script>
<script src="cheese-data.js"></script>
<script src="chinmi-data.js"></script>
<script src="cocktail-data.js"></script>
<script src="wineglass-data.js"></script>
<script src="food-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1/dist/umd/supabase.js"></script>
<style>
/* Layout: phone-first single column; sticky header, bottle list, full-screen sheets; amber = everyone's consensus, peat = "you" */
:root{
  --bg:#F1EEE9; --surface:#FFFFFF; --ink:#1F1A15; --muted:#6D645A; --line:#DCD4C9;
  --amber:#A9581A; --amber-ink:#FFFFFF; --amber-soft:#F2E2CD; --peat:#2F6B52; --peat-soft:#DCEBE2; --danger:#B33A2B; --land:#DDD3C5; --near:#E9E3DA;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15110D; --surface:#201A14; --ink:#EFE6DA; --muted:#A79A8B; --line:#3A3027;
  --amber:#E39A4E; --amber-ink:#1A120A; --amber-soft:#3A2817; --peat:#7FC4A2; --peat-soft:#1E3329; --danger:#E5735F; --land:#2E261F; --near:#1D1813; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(17px,5.2vw,24px);line-height:1.2;margin:0;letter-spacing:.06em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:32px;cursor:pointer;font-size:16px;line-height:1;flex-shrink:0}
.tabs{display:grid;grid-template-columns:1fr 1.45fr 1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:-11px}
.tabs button{border:0;background:none;padding:8px 0 9px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--amber)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--amber-soft);color:var(--ink);font-weight:700}

.list{display:grid;gap:12px;padding-top:14px}
.card{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%;cursor:pointer}
.thumb{width:76px;height:96px;border-radius:9px;object-fit:cover;background:var(--amber-soft);display:grid;place-items:center;overflow:hidden}
.thumb .glass{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.info{min-width:0}
.card h3{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.3;margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagline span{font-size:11.5px;background:var(--bg);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tagline span b{font-family:var(--mono);font-weight:500;color:var(--amber);margin-left:3px}
.score{text-align:center;padding-right:4px;min-width:3.4em}
.score b{display:block;font-family:var(--mono);font-size:26px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.score i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.04em;display:block;margin-top:3px}
.by{font-size:11.5px;color:var(--muted);margin-top:4px}
.people{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:4px}
.mine-dot{display:inline-block;font-size:10.5px;color:var(--peat);background:var(--peat-soft);border-radius:999px;padding:0 7px;margin-left:6px}
.feed-card{grid-template-columns:1fr auto}

.empty{padding:48px 8px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--ink);font-size:20px;margin:0 0 6px}
.notice{padding:12px 14px;border-radius:10px;background:var(--amber-soft);font-size:13.5px}
.notice code{font-family:var(--mono);font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--amber);color:var(--amber-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(80,40,10,.28);cursor:pointer}

.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.sheet-bar h2{font-size:15px;margin:0;flex:1;text-align:center;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.sheet-body{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cta .btn{width:100%;max-width:608px;display:block;margin:0 auto;padding:13px;font-size:15px;border-radius:12px}

fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--display);font-weight:800;font-size:18px;padding:0;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.group-name{font-size:11.5px;color:var(--peat);font-weight:700;letter-spacing:.08em;margin:6px 0 4px}
.photo-drop{display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);min-height:150px;cursor:pointer;overflow:hidden;position:relative}
.photo-drop img{width:100%;max-height:320px;object-fit:cover}
.photo-drop span{color:var(--muted);font-size:14px;padding:20px;text-align:center}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:11px;display:grid;justify-items:center;gap:4px;cursor:pointer;color:var(--muted)}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--amber);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--amber)}
.sw b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--amber)}
.sw.vote{cursor:default}
.sw.vote.zero{opacity:.35}
.phase{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.phase button{border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px}
.phase button[aria-pressed="true"]{background:var(--amber-soft);color:var(--ink);font-weight:700}
.phase em{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--amber)}
.addtag{display:flex;gap:6px}
.addtag input{flex:1;min-width:0}
.sliders{display:grid;gap:8px}
.sl{display:grid;grid-template-columns:5.5em 1fr 1.5em;gap:10px;align-items:center;font-size:13.5px}
.sl output{font-family:var(--mono);text-align:right;color:var(--amber);font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--amber);width:100%}
.radar-wrap{display:grid;place-items:center;gap:6px}
.radar{width:100%;max-width:300px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.scorebox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.scorebox output{font-family:var(--mono);font-size:40px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.scorebox .word{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px}
.hint{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.hero{border-radius:14px;overflow:hidden;background:var(--amber-soft)}
.hero img{width:100%;max-height:380px;object-fit:cover;display:block}
.d-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.d-head h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.d-score{text-align:right}
.d-score b{font-family:var(--mono);font-size:44px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.d-score div{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.facts div{background:var(--surface);padding:9px 10px;min-width:0}
.facts dt{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.facts dd{margin:0;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.facts div:last-child:nth-child(odd){grid-column:span 2}
.sec h3{font-family:var(--display);font-size:17px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h3 small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.14em;font-weight:500}
.sec p{margin:6px 0 0}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat dt{font-size:11px;color:var(--muted)}
.stat dd{margin:2px 0 0;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat dd small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}
.agree{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--amber-soft)}
.strip{width:100%;height:auto;display:block}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3.4em;gap:8px;align-items:center;font-size:13.5px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--amber);border-radius:999px}
.bar .fill.mine{background:var(--peat)}
.bar em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tasting{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.tasting.me{border-color:var(--peat)}
.t-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.t-head strong{font-size:14px}
.t-head .s{margin-left:auto;font-family:var(--mono);font-size:20px;color:var(--amber)}
.t-phase{font-size:13.5px}
.t-phase b{font-size:11.5px;color:var(--muted);font-weight:500;margin-right:6px;letter-spacing:.06em}
.t-note{white-space:pre-wrap;font-size:14px}
.t-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;font-size:13px}
.pick{display:grid;gap:8px}
.pick button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.pick button.new{border-style:dashed;color:var(--amber);font-weight:700}
.pick small{color:var(--muted);font-size:12px}
.menu-list{display:grid;gap:12px}
.menu-list h3{font-family:var(--display);font-size:17px;margin:0 0 4px}
.menu-list p{margin:0;font-size:14px}
.steps{margin:6px 0 0;padding-left:1.3em;font-size:14px}
.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;max-width:calc(100% - 32px)}
/* 図鑑 */
.zk{display:grid;gap:14px;padding-top:14px}
.zk-mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.zk-mode button{border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px}
.zk-mode button[aria-pressed="true"]{background:var(--amber-soft);color:var(--ink);font-weight:700}
.mapcard{background:var(--near);border:1px solid var(--line);border-radius:16px;padding:10px 6px 6px;position:relative;overflow:hidden}
.mapcard .compass{position:absolute;right:14px;top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.mapcard .caption{position:absolute;left:14px;top:10px;font-family:var(--display);font-size:13px;letter-spacing:.12em;color:var(--muted)}
.zmap{width:100%;height:auto;display:block;max-height:62vh}
.zmap .near{fill:var(--land);opacity:.45}
.zmap .land{fill:var(--land)}
.zmap .other{fill:var(--land)}
.zmap .rg{cursor:pointer}
.zmap .rg path{fill:var(--amber);stroke:var(--near);stroke-width:.7;transition:fill-opacity .2s}
.zmap .rg[data-region="highland"] path{fill-opacity:.16}
.zmap .rg[data-region="speyside"] path{fill-opacity:.42}
.zmap .rg[data-region="lowland"] path{fill-opacity:.28}
.zmap .rg[data-region="campbeltown"] path{fill-opacity:.5}
.zmap .rg[data-region="islay"] path{fill-opacity:.55}
.zmap .rg[data-region="islands"] path{fill-opacity:.32}
.zmap .rg.sel path{fill-opacity:.95}
.zmap.has-sel .rg:not(.sel) path{fill-opacity:.1}
.zmap .lbl{font-family:var(--body);font-size:10.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--near);stroke-width:3px;stroke-linejoin:round;pointer-events:none;letter-spacing:.04em}
.zmap .lbl.sel{fill:var(--amber-ink);stroke:var(--amber)}
.zmap .dot{fill:var(--ink);fill-opacity:.55;pointer-events:none}
.zmap .dot.on{fill:var(--bg);fill-opacity:1;stroke:var(--ink);stroke-width:.8}
.zmap .dot.focus{fill:var(--amber-ink);stroke:var(--amber);stroke-width:2.5}
.zmap .rg:focus-visible path{stroke:var(--ink);stroke-width:1.5}
.world{display:flex;flex-wrap:wrap;gap:6px}
.world .lbl{width:100%;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.rinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.rinfo h3{margin:0;font-family:var(--display);font-size:20px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rinfo h3 small{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted);font-weight:500}
.rinfo p{margin:0;font-size:14px}
.zk-filter{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.zk-filter .group-name{margin:0}
.zk-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.zk-head b{font-family:var(--display);font-size:16px;color:var(--ink)}
.zcard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.zcard .gl{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.zcard h3{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.zcard .en{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.zcard .right{text-align:right;min-width:3.4em}
.zcard .right b{display:block;font-family:var(--mono);font-size:20px;line-height:1.1;color:var(--amber);font-variant-numeric:tabular-nums}
.zcard .right i{font-style:normal;font-size:10.5px;color:var(--muted);display:block}
.badge{display:inline-block;font-size:10.5px;border-radius:999px;padding:0 7px;background:var(--amber-soft);color:var(--ink);margin-left:6px;vertical-align:2px}
.badge.peat{background:var(--peat-soft);color:var(--peat)}
.matchbar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px;max-width:160px}
.matchbar i{display:block;height:100%;background:var(--amber)}
.z-hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.z-hero .gl{width:64px;height:64px;border-radius:50%;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -10px 0 rgba(0,0,0,.14)}
.z-hero h1{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.25;margin:0;overflow-wrap:anywhere}
.z-hero .en{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.z-desc{font-size:15px;line-height:1.8;margin:0}
.z-detail{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:-6px}
.z-detail p{margin:0;font-size:14px;line-height:1.8}
.z-detail b{display:block;font-size:11.5px;color:var(--amber);letter-spacing:.08em}
.minimap{max-width:220px;margin:0 auto}
.note-small{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.story{display:grid;gap:14px;border-left:2px solid var(--amber-soft);padding-left:14px}
.story .st h3{font-size:15.5px;margin:0 0 4px}
.story .st p{margin:0;font-size:14.5px;line-height:1.85}
.story-facts{margin-top:-6px}
.zk-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.cmp-open{display:flex;align-items:center;gap:6px;border-radius:10px}
.cmp-open em{font-style:normal;font-family:var(--mono);font-size:11px;background:var(--amber);color:var(--amber-ink);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center}
.excard{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.excard .gl{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.excard .info{display:grid;gap:2px;min-width:0}
.ex-label{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.3}
.excard .right{text-align:right}
.excard .price{display:block;font-family:var(--mono);font-size:14px;color:var(--amber);font-weight:500;white-space:nowrap}
.excard .right i{font-style:normal;font-size:10.5px;color:var(--muted)}
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.cmp-head .vs{align-self:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--muted);letter-spacing:.1em}
.cmp-slot{display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;min-width:0}
.cmp-slot .gl{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -7px 0 rgba(0,0,0,.12)}
.cmp-slot strong{font-family:var(--display);font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.cmp-slot:first-child{border-top:3px solid var(--amber)}
.cmp-slot:last-child{border-top:3px solid var(--peat)}
.cmp-slot.empty{border-style:dashed;cursor:pointer;color:var(--muted);align-content:center;min-height:130px}
.cmp-slot .plus{font-size:24px;color:var(--amber)}
.cmp-act{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cmp-table{display:grid;grid-template-columns:4.5em 1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cmp-table>div{background:var(--surface);padding:8px 10px;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.cmp-k{font-size:11.5px!important;color:var(--muted)}
.cmp-a.diff{color:var(--amber);font-weight:700}
.cmp-b.diff{color:var(--peat);font-weight:700}
.cmp-sim{display:flex;align-items:baseline;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cmp-sim b{font-family:var(--mono);font-size:34px;color:var(--ink);font-weight:500}
.cmp-sim b small{font-size:14px}
.cmp-sim span{color:var(--muted);font-size:14px}
.bfly{display:grid;gap:6px;margin-top:12px}
.bf-row{display:grid;grid-template-columns:1.2em 1fr 5.6em 1fr 1.2em;gap:6px;align-items:center}
.bf-n{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.bf-l,.bf-r{height:10px;background:var(--line);border-radius:999px;overflow:hidden;display:flex}
.bf-l{justify-content:flex-end}
.bf-l i{background:var(--amber);border-radius:999px}
.bf-r i{background:var(--peat);border-radius:999px}
.bf-k{font-size:12px;text-align:center;color:var(--muted)}
.bf-k.diff{color:var(--ink);font-weight:700}
.cmp-tags{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.cp-group{display:grid;gap:4px}
.chip:disabled{opacity:.35}
.world-card{padding:26px 4px 6px}
.wmap{width:100%;height:auto;display:block}
.wmap .wbase{fill:var(--land);opacity:.75;pointer-events:none}
.wmap .wpin .whit{fill:transparent}
.wmap .wc{fill:var(--amber);fill-opacity:.55;cursor:pointer}
.wmap .wpin{cursor:pointer}
.wmap .wpin line{stroke:var(--ink);stroke-width:.35;opacity:.6}
.wmap .wpin .ring{fill:var(--amber);fill-opacity:.25;stroke:var(--amber);stroke-width:.5}
.wmap .wpin .core{fill:var(--amber)}
.wmap .wpin rect{fill:var(--surface);stroke:var(--amber);stroke-width:.45}
.wmap .wpin text{font-family:var(--body);font-size:4.2px;font-weight:700;fill:var(--ink)}
.wmap .wpin:focus-visible rect{stroke-width:1}
@media (prefers-reduced-motion:no-preference){.wmap .wpin .ring{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{fill-opacity:.05;stroke-opacity:.3}}}
.ccards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccard{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ccard .en{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--amber)}
.ccard b{font-family:var(--display);font-size:17px}
.ccard:last-child:nth-child(odd){grid-column:span 2}
.cbar{display:flex;align-items:center;gap:10px}
.cbar span{display:flex;align-items:baseline;gap:8px}
.cbar b{font-family:var(--display);font-size:20px}
.cbar small{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.cmap{width:100%;height:auto;display:block;max-height:64vh}
.cmap .near{fill:var(--land);opacity:.45;stroke:var(--near);stroke-width:.6}
.cmap .land{fill:var(--land);stroke:var(--near);stroke-width:.6}
.cmap .land2{fill:var(--land);stroke:var(--near);stroke-width:.6;opacity:.85}
.cmap .hi{fill:var(--amber);fill-opacity:.22;stroke:var(--near);stroke-width:.8}
.cmap .state{font-family:var(--mono);fill:var(--muted);letter-spacing:.12em;pointer-events:none}
.cmap .lead{stroke:var(--muted);opacity:.7}
.cmap .mdot{fill:var(--ink);fill-opacity:.45}
.cmap .mdot.focus{fill:var(--amber);fill-opacity:1;stroke:var(--near)}
.cmap .dpin{cursor:pointer}
.cmap .dpin .hit{fill:transparent}
.cmap .dpin .dot2{fill:var(--amber);stroke:var(--near)}
.cmap .dpin text{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--near);stroke-linejoin:round}
.cmap .dpin:focus-visible .dot2{stroke:var(--ink)}
.exit-dlg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.exit-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px 16px;width:100%;max-width:320px;display:grid;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.exit-box p{margin:0;font-family:var(--display);font-weight:800;font-size:18px;text-align:center}
.exit-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exit-btns .btn{padding:11px;font-size:15px}
.tabs button{white-space:nowrap}
.mine{display:grid;gap:14px;padding-top:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.mcard h3{font-family:var(--display);font-size:18px;margin:0;display:flex;align-items:baseline;gap:8px}
.mcard h3 small{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);font-weight:500}
.mcard p{margin:0;font-size:14px}
.mcard .stat{background:var(--bg)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;font-weight:700;font-size:15px;background:var(--surface);border-color:var(--ink)}
.acct{display:flex;align-items:center;gap:12px;min-width:0}
.acct img,.acct .ava{width:44px;height:44px;border-radius:50%;flex-shrink:0;object-fit:cover}
.acct .ava{display:grid;place-items:center;background:var(--amber-soft);font-weight:700}
.acct strong{display:block;overflow-wrap:anywhere}
.bias{font-size:14px}
.bias b{font-family:var(--mono);color:var(--amber)}
.wrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.wish{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-size:13.5px}
.wish.on{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.wish svg{color:var(--amber)}
.t-social{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.soc{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--mono)}
.soc.on{color:var(--danger)}
.soc:hover{background:var(--bg)}
.cmts{display:grid;gap:8px;background:var(--bg);border-radius:10px;padding:10px}
.cmt-h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cmt-h .btn{margin-left:auto;padding:2px 6px}
.cmt p{margin:2px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt-new{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.cmt-new textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:vertical;min-height:44px}
.feed-soc{display:flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.feed-soc span{margin-right:8px}
.pk-h{margin-top:8px}
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-box{width:100%;max-width:380px;display:grid;gap:14px;text-align:center;justify-items:center}
.gate-box img{border-radius:18px}
.gate-box h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.08em;margin:0}
.gate-box p{margin:0;font-size:14.5px}
.gate-form{display:grid;gap:10px;width:100%}
.gate-form input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.12em;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.gate-form .btn{padding:12px;font-size:16px;border-radius:12px}
.gate-or{display:flex;align-items:center;gap:10px;width:100%;color:var(--muted);font-size:12px;margin-top:6px}
.gate-or::before,.gate-or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gate .gbtn{width:100%}
.code-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code-box code{font-family:var(--mono);font-size:22px;letter-spacing:.12em;background:var(--bg);border-radius:8px;padding:4px 12px}
.invite{white-space:pre-wrap;font-family:var(--body);font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;margin:0;user-select:all}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
@media (max-width:380px){.row3{grid-template-columns:1fr 1fr}.bar{grid-template-columns:6em 1fr 3.2em}}

/* お酒の種類：ワインのときはアクセントをボルドー色に */
:root[data-kind="wine"]{--amber:#8E2C3E;--amber-soft:#F1DDE1}
@media (prefers-color-scheme: dark){:root[data-kind="wine"]{--amber:#E28394;--amber-soft:#3B1C23}}
:root[data-kind="wine"] .swatches{grid-template-columns:repeat(5,1fr)}
.brand-btn{border:0;background:none;padding:0;margin:0;text-align:left;display:grid;cursor:pointer;min-width:0;color:inherit}
.kind-label{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--amber);display:inline-flex;align-items:center;gap:5px;margin-top:1px}
.kinds{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;display:grid;place-items:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
body.kinds-on{overflow:hidden}
.kinds-in{width:100%;max-width:440px;display:grid;gap:22px}
.kinds-head{text-align:center;display:grid;gap:8px}
.kinds-head .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--muted)}
.kinds-head h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,8.4vw,36px);letter-spacing:.08em;margin:0;line-height:1.1}
.kinds-head p{margin:0;color:var(--muted);font-size:14.5px}
.kind-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kcard{--c:#A9581A;position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px 14px 14px;border-radius:18px;
  border:1px solid var(--line);background:var(--surface);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 15%,var(--surface)) 0%,var(--surface) 64%);
  cursor:pointer;min-height:178px;color:var(--ink);transition:transform .12s ease}
.kcard.k-wine{--c:#8E2C3E}
@media (prefers-color-scheme: dark){.kcard{--c:#E39A4E}.kcard.k-wine{--c:#E28394}}
.kcard:active{transform:scale(.98)}
.kcard::after{content:"→";position:absolute;right:15px;top:14px;font-family:var(--mono);font-size:14px;color:var(--c)}
.kcard .kglass{width:62px;height:62px;color:var(--c);margin-bottom:auto}
.kcard .en{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--c);margin-top:20px}
.kcard b{font-family:var(--display);font-size:clamp(20px,6vw,25px);font-weight:800;line-height:1.25}
.kcard .kc{font-size:12px;color:var(--muted);min-height:1.6em;margin-top:2px}
.kind-soon{display:grid;gap:8px;justify-items:center}
.kind-soon .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted)}
.soon-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.soon-row span{border:1px dashed var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted)}
.cmap .rpin .dot2{fill:var(--surface);stroke:var(--amber)}
.cmap .rpin.sel .dot2{fill:var(--amber)}
.cmap .rpin.dim{opacity:.45}

.daily-btn{display:grid;gap:2px;text-align:left;width:100%;background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.daily-btn .en{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber)}
.daily-btn b{font-family:var(--display);font-size:17px}
.dp-title{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.daypick{display:grid;gap:10px}
.dp{display:grid;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.dp b{font-size:16px}
.dp span{font-size:13px;color:var(--muted)}
.dp.main{border-color:var(--amber);background:var(--amber-soft)}
.daystep{display:flex;align-items:center;gap:14px}
.daystep button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer;color:var(--ink)}
.daystep output{font-size:15px;min-width:7.5em;text-align:center}
.daystep output b{font-family:var(--mono);font-size:24px;color:var(--amber);margin:0 2px}
.dbadge{display:inline-block;font-size:11px;font-weight:500;background:var(--amber-soft);color:var(--ink);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.dayb .bar{grid-template-columns:6.4em 1fr 6.6em}
.bar em small.up{color:var(--peat)} .bar em small.down{color:var(--danger)}

:root[data-kind="coffee"]{--amber:#6A4127;--amber-soft:#EADFD3}

@media (prefers-color-scheme: dark){.kcard.k-coffee{--c:#D2A27A}}
.kcard.k-food:last-child{grid-column:span 2;min-height:150px}
:root[data-kind="cheese"]{--amber:#9A7310;--amber-soft:#F3E8C6}
@media (prefers-color-scheme: dark){:root[data-kind="cheese"]{--amber:#E6C35C;--amber-soft:#353015}}

.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.cings{display:grid;border-top:1px solid var(--line)}
.cing{padding:9px 2px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.cing-h{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.cing-h em{font-style:normal;color:var(--muted);white-space:nowrap}
.cing .pchips{margin:0}
.wg-svg{display:block;color:var(--ink)}
.wg-rec{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit}
.wg-rec b{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.3}
.wg-rec em{display:block;font-style:normal;font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.wg-rec i{display:block;font-style:normal;font-size:12px;color:var(--amber);margin-top:4px}
.wg-alt{border:0;background:none;padding:0;color:var(--amber);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.zcard.wg-card{grid-template-columns:52px 1fr auto}
.wg-hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.wg-hero h1{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.25;margin:0}
.wg-hero .en{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.ckt-tools{display:grid;gap:8px}
.ckt-tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.ckt-tool b{font-size:15px;display:flex;gap:8px;align-items:baseline}
.ckt-tool b small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.ckt-tool p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
@media (prefers-color-scheme: dark){.kcard.k-brandy{--c:#E3A07A}.kcard.k-rum{--c:#74C9B6}.kcard.k-tequila{--c:#8DC0DA}}
.pchips .chip{display:inline-flex;align-items:center;gap:6px}
.pchips .chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.1)}
.roastbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.roastbar .rb{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);opacity:.55}
.roastbar .rb i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.roastbar .rb span{font-size:11.5px;white-space:nowrap}
.roastbar .rb.on{opacity:1;border-color:var(--amber);background:var(--amber-soft);font-weight:700}
.roastscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:4px 2px 0}
.brews{display:grid;gap:8px}
.brew{display:grid;gap:2px;border-left:3px solid var(--amber);padding:2px 0 2px 10px}
.brew b{font-size:15px}
.brew span{font-size:13.5px;color:var(--muted);line-height:1.6}
.rtext{margin:10px 0 0;font-size:14px;line-height:1.8}

/* 料理・酒の肴 */
:root[data-kind="food"]{--amber:#6B7A1F;--amber-soft:#E9EDCF}
@media (prefers-color-scheme: dark){:root[data-kind="food"]{--amber:#B9C66A;--amber-soft:#2A2F14}}
:root[data-kind="food"] .tabs,:root[data-kind="cocktail"] .tabs{grid-template-columns:1.3fr 1.2fr 1fr}
.kcard.k-food{--c:#6B7A1F}
@media (prefers-color-scheme: dark){.kcard.k-food{--c:#B9C66A}}
.badge.shun{background:#E3EAC2;color:#4F5B12}
@media (prefers-color-scheme: dark){.badge.shun{background:#2F3616;color:#C7D47A}}
.shun-card{display:grid;gap:8px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:14px;padding:12px 14px}
.shun-card .en{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber)}
.shun-card b{font-family:var(--display);font-size:17px}
.shun-card .chips{margin:0}
.ings{display:grid;margin:0;border-top:1px solid var(--line)}
.ings div{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.ings dt{margin:0}.ings dd{margin:0;color:var(--muted);text-align:right;white-space:nowrap}
.rsteps{margin:0;padding-left:1.5em;display:grid;gap:10px;font-size:15px;line-height:1.75}
.rsteps li::marker{color:var(--amber);font-family:var(--mono);font-weight:700}
.rtip{margin:14px 0 0;background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.rtip b{display:block;font-size:11.5px;color:var(--amber);letter-spacing:.1em}
.pcat{border-left:3px solid var(--amber);padding:2px 0 2px 10px;margin:0 0 12px}
.pcat b{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.pcat b small{font-size:11px;color:var(--amber);font-weight:500}
.pcat p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.pair-why{margin:0 0 10px;font-size:13.5px;line-height:1.65;border-left:3px solid var(--amber);padding-left:10px}
.pthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pthumbs img,.pthumbs span{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.linked{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--amber-soft);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
.linked b{flex:1}
.d-name{font-family:var(--display);font-size:20px;font-weight:800}
.dsug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.dcard img,.dcard .dph{width:100%;aspect-ratio:1/1;object-fit:cover;display:grid;place-items:center;font-family:var(--display);font-size:34px;color:#fff;font-weight:800}
.dinfo{display:grid;gap:2px;padding:8px 10px 10px;min-width:0}
.dinfo b{font-family:var(--display);font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ddrink{font-size:12px;color:var(--amber);overflow-wrap:anywhere}
.dscore{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-family:var(--mono);font-size:13px;border-radius:999px;padding:2px 9px;display:flex;gap:6px;align-items:center}
.dscore i{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.dpost .hero{margin:-2px -2px 8px}
.rcard .gl{display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:18px}
</style>
</head>

<script>
(() => {
const APP_VERSION = '2026.10.15c';

/* ---------- お酒の種類ごとの設定（ウイスキー／ワイン。日本酒・ビール・カクテルは今後ここに足す） ---------- */
const STORY_HEADS = [['はじまり','HISTORY'],['造りのこだわり','CRAFT'],['ウイスキー界での存在感','STANDING']];
const BLEND_HEADS = [['はじまり','HISTORY'],['ブレンドの特徴','BLEND'],['ウイスキー界での存在感','STANDING']];
const WINE_HEADS  = [['はじまり','HISTORY'],['造りのこだわり','CRAFT'],['ワイン界での存在感','STANDING']];
const ageText = v => K && K.ageFmt ? K.ageFmt(v) : !v ? '' : /^\d+$/.test(String(v).trim()) ? `${v}年` : String(v);
const SAKE_HEADS  = [['はじまり','HISTORY'],['造りのこだわり','CRAFT'],['日本酒界での存在感','STANDING']];

/* チーズ・珍味：色と模様（写真の代わりに断面のイラストで見せる） */
function lookCSS(key){
  const C=(cx,cy,r,f)=>`<circle cx='${cx}' cy='${cy}' r='${r}' fill='${f}'/>`;

function refilter(){
  bottles = allBottles.filter(b=>b.kind===KIND);
  const ids = new Set(bottles.map(b=>b.id));
  tastings = allTastings.filter(t=>ids.has(t.bottleId));
  buildAggs();
}
const kindCount = k => { const bs=allBottles.filter(b=>b.kind===k); const ids=new Set(bs.map(b=>b.id)); return { b:bs.length, t:allTastings.filter(t=>ids.has(t.bottleId)).length }; };
function buildAggs(){
  aggs = new Map();
  bottles.forEach(b => aggs.set(b.id, aggregate(b.id)));
}
function aggregate(bid){
  const list = tastings.filter(t=>t.bottleId===bid).sort((a,b)=>b.createdAt-a.createdAt);
  const people = new Set(list.map(t=>t.author));
  const scores = list.map(t=>t.score).filter(s=>typeof s==='number');
  const avg = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null;
  const sd = scores.length>1 ? Math.sqrt(scores.reduce((a,s)=>a+(s-avg)**2,0)/scores.length) : 0;
  const profs = list.map(t=>t.profile).filter(p=>p && AXES.some(a=>p[a[0]]>0));
  const avgProfile = profs.length ? Object.fromEntries(AXES.map(a=>[a[0], profs.reduce((s,p)=>s+(+p[a[0]]||0),0)/profs.length])) : null;
  const profSd = profs.length>1 ? AXES.reduce((acc,a)=>{ const m=avgProfile[a[0]]; return acc+Math.sqrt(profs.reduce((s,p)=>s+((+p[a[0]]||0)-m)**2,0)/profs.length); },0)/AXES.length : null;
  // タグ：何人がそう感じたか（同じ人の複数回は1人として数える）
  const tagPeople = {}; PHASES.forEach(([k])=>tagPeople[k]=new Map());
  list.forEach(t=>PHASES.forEach(([k])=>(t[k]?.tags||[]).forEach(tag=>{ const m=tagPeople[k]; if(!m.has(tag)) m.set(tag,new Set()); m.get(tag).add(t.author); })));
  const allTags = new Map();
  PHASES.forEach(([k])=>tagPeople[k].forEach((set,tag)=>{ if(!allTags.has(tag)) allTags.set(tag,new Set()); set.forEach(a=>allTags.get(tag).add(a)); }));
  const vote = key => { const m={}; list.forEach(t=>{ if(t[key]) m[t[key]]=(m[t[key]]||0)+1; }); return m; };
  return { list, n:list.length, people:people.size, avg, sd, min:scores.length?Math.min(...scores):null, max:scores.length?Math.max(...scores):null,
    avgProfile, profs, profSd, tagPeople, allTags, colors:vote('color'), finLen:vote('finishLength'), serves:vote('serve'),
    lastAt: list[0]?.createdAt || 0, mine: list.filter(t=>t.author===myId) };
}

async function boot(){
  const cfg = window.KOHAKU_CONFIG || {};
  if(!window.supabase || !cfg.SUPABASE_URL || /xxxx/.test(cfg.SUPABASE_URL) || !cfg.SUPABASE_ANON_KEY || /ここに/.test(cfg.SUPABASE_ANON_KEY)){
    setupError='config'; loaded=true; renderList(); initNav(); return;
  }
  const authErr = readAuthError();
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  let loginMode = ''; try{ loginMode = sessionStorage.getItem('hc.loginMode')||''; sessionStorage.removeItem('hc.loginMode'); }catch(e){}
  try{
    if(authErr){
      // このGoogleアカウントがすでに別の記録（別の端末）とひも付いている場合は、そのアカウントでログインし直す
      if(loginMode==='link' && /already|exists|linked/i.test(authErr.code+' '+authErr.desc)){
        toast('このGoogleアカウントは登録済みです。ログインし直します');
        try{ sessionStorage.setItem('hc.loginMode','signin'); }catch(e){}
        await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin+location.pathname } });
        return;
      }
      toast('ログインできませんでした：'+(authErr.desc||authErr.code));
    }
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){ const r = await sb.auth.signInAnonymously(); if(r.error) throw r.error; session = r.data.session; }
    setMe(session?.user);
  }catch(e){ console.warn(e); toast('ログインできませんでした。閲覧のみで開いています。'); }
  let after=''; try{ after=sessionStorage.getItem('hc.afterLogin')||''; sessionStorage.removeItem('hc.afterLogin'); }catch(e){}
  if(myId && !(await checkMember())){ showGate(); initNav(); return; }
  await startApp(after);
}

async function checkMember(){

async function bottleFromZukan(z){
  const ex = bottleForZ(z); if(ex) return ex;
  const r = ZR[z.region];
  const row = { name:z.name, distillery:z.distillery, type:TYPES.includes(z.type)?z.type:'その他', region:(K.pickRegion?r?.pick:z.pref||r?.pick)||'', age:z.age||'', abv:z.abv||'', cask:z.cask||'', zukan_id:z.id, kind:KIND };
  let res = await insertBottle(row);
  if(res.error && /zukan_id/.test(res.error.message)){ delete row.zukan_id; res = await insertBottle(row); }
  if(res.error){
    if(res.error.code==='23505'){ await loadAll(); const again = bottleForZ(z) || bottles.find(b=>norm(b.name)===norm(z.name)); if(again) return again; }
    throw new Error(res.error.message);
  }
  const nb=rowToBottle(res.data); allBottles=[nb,...allBottles]; refilter(); renderList(); return nb;
}

/* ---------- マイページ ---------- */
function myAnalysis(){
  const mine = tastings.filter(t=>t.author===myId);
  if(!mine.length) return null;
  const scores = mine.map(t=>t.score).filter(s=>typeof s==='number');
  const avg = scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length);
  // 点数のつけ方：同じ銘柄を記録したほかの人の平均と比べる
  const diffs = []; mine.forEach(t=>{ const others = tastings.filter(o=>o.bottleId===t.bottleId && o.author!==myId && typeof o.score==='number'); if(others.length && typeof t.score==='number') diffs.push(t.score - others.reduce((s,o)=>s+o.score,0)/others.length); });
  const bias = diffs.length ? diffs.reduce((a,b)=>a+b,0)/diffs.length : null;
  // 好きな味わい：自分の平均点以上の記録を、点数で重みづけ
  const liked = mine.filter(t=>t.profile && AXES.some(a=>t.profile[a[0]]>0) && (t.score??0) >= avg);
  const base = liked.length ? liked : mine.filter(t=>t.profile && AXES.some(a=>t.profile[a[0]]>0));
  let pref = null;
  if(base.length){ const w = base.map(t=>Math.max(1,(t.score??avg)-avg+5)); const W=w.reduce((a,b)=>a+b,0);
    pref = Object.fromEntries(AXES.map(([k])=>[k, base.reduce((s,t,i)=>s+(+t.profile[k]||0)*w[i],0)/W])); }
  const tagCount = new Map(); (liked.length?liked:mine).forEach(t=>PHASES.forEach(([k])=>(t[k]?.tags||[]).forEach(tag=>tagCount.set(tag,(tagCount.get(tag)||0)+1))));
  const tags = [...tagCount.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  const regionOf = t => { const b=bottles.find(x=>x.id===t.bottleId); const z=b&&zukanFor(b); return z ? (ZR[z.region]?.jp||'') : (b?.region||''); };
  const typeOf = t => { const b=bottles.find(x=>x.id===t.bottleId); return b?.type||''; };
  const group = f => { const m=new Map(); mine.forEach(t=>{ const k=f(t); if(!k||typeof t.score!=='number') return; const g=m.get(k)||{n:0,s:0}; g.n++; g.s+=t.score; m.set(k,g); });
    return [...m.entries()].map(([k,g])=>({k,n:g.n,avg:g.s/g.n})).sort((a,b)=>b.avg-a.avg || b.n-a.n); };
  // おすすめ：まだ記録していない図鑑の銘柄から、好みに近いもの
  const tasted = new Set(mine.map(t=>{ const b=bottles.find(x=>x.id===t.bottleId); return b && zukanFor(b)?.id; }).filter(Boolean));
  const recs = pref ? ZE.filter(z=>!tasted.has(z.id)).map(z=>({ z, ...similarity({p:profArr(pref), tags:tags.map(x=>x[0])}, z) }))
      .sort((a,b)=>b.score-a.score).slice(0,6) : [];
  return { n:mine.length, bottles:new Set(mine.map(t=>t.bottleId)).size, avg, bias, biasN:diffs.length, pref, tags, regions:group(regionOf).slice(0,4), types:group(typeOf).slice(0,3), recs };
}

        <p>いまはゲストとして使っています。Googleアカウントでログインすると、機種変更やアプリの入れ直しのあとも、自分の記録を編集・削除できます。</p>

/* ---------- 図 ---------- */
function radarSVG({ avg=null, others=[], mine=null, single=null }, size=280){
  const c=size/2, R=size/2-56, n=AXES.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [c+Math.cos(a)*R*v/5, c+Math.sin(a)*R*v/5]; };
  const poly = p => AXES.map((a,i)=>pt(i,+(p?.[a[0]]||0)).join(',')).join(' ');
  let g='';
  for(let r=1;r<=5;r++) g+=`<polygon points="${AXES.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${r===5?1.2:.8}"/>`;
  AXES.forEach((a,i)=>{ const [x,y]=pt(i,5); g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".8"/>`;
    const [lx,ly]=pt(i,6.3); g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="var(--muted)" font-family="var(--body)">${a[1]}</text>`; });
  others.forEach(p=>{ g+=`<polygon points="${poly(p)}" fill="none" stroke="var(--muted)" stroke-opacity=".45" stroke-width="1"/>`; });
  const main = avg || single;
  if(main){ g+=`<polygon points="${poly(main)}" fill="var(--amber)" fill-opacity=".26" stroke="var(--amber)" stroke-width="2.2" stroke-linejoin="round"/>`;
    AXES.forEach((a,i)=>{ const v=+(main[a[0]]||0); if(v>0){ const [x,y]=pt(i,v); g+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--amber)"/>`; }}); }
  if(mine) g+=`<polygon points="${poly(mine)}" fill="none" stroke="var(--peat)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>`;
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="フレーバープロファイル">${g}</svg>`;
}
function scoreStrip(a){
  const W=320,H=58,L=14,Rt=W-14, x=s=>L+(Math.max(50,Math.min(100,s))-50)/50*(Rt-L);
  let g=`<line x1="${L}" y1="26" x2="${Rt}" y2="26" stroke="var(--line)" stroke-width="2"/>`;
  [50,60,70,80,90,100].forEach(v=>{ g+=`<line x1="${x(v)}" y1="21" x2="${x(v)}" y2="31" stroke="var(--line)"/><text x="${x(v)}" y="50" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">${v}</text>`; });
  if(a.min!=null && a.max>a.min) g+=`<rect x="${x(a.min)}" y="22" width="${x(a.max)-x(a.min)}" height="8" rx="4" fill="var(--amber)" fill-opacity=".18"/>`;
  const seen={};
  a.list.forEach(t=>{ if(typeof t.score!=='number') return; const k=t.score; seen[k]=(seen[k]||0)+1; const dy=(seen[k]-1)*-7;
    g+=`<circle cx="${x(t.score)}" cy="${26+dy}" r="5" fill="${t.author===myId?'var(--peat)':'var(--surface)'}" stroke="${t.author===myId?'var(--peat)':'var(--amber)'}" stroke-width="2"/>`; });
  if(a.avg!=null) g+=`<line x1="${x(a.avg)}" y1="8" x2="${x(a.avg)}" y2="36" stroke="var(--amber)" stroke-width="2"/><text x="${x(a.avg)}" y="6" text-anchor="middle" font-size="10" fill="var(--amber)" font-family="var(--mono)" dominant-baseline="hanging" dy="-6">avg</text>`;
  return `<svg class="strip" viewBox="0 -4 ${W} ${H+4}" role="img" aria-label="各記録の点数の分布">${g}</svg>`;
}
const agreementLabel = a => {
  if(a.people<2 || a.profSd==null) return '';
  return a.profSd<0.8 ? '感じ方がよく一致' : a.profSd<1.4 ? '感じ方はおおむね一致' : '感じ方が分かれている';
};

function bottleMatches(b, a, q){
  if(!q) return true;
  const hay = norm([b.name,b.distillery,b.region,b.type,b.cask,...a.allTags.keys(),...a.list.map(t=>t.authorName)].join(' '));
  return hay.includes(norm(q));
}

function renderFeed(list){

        <dl class="stat-row">
          <div class="stat"><dt>記録</dt><dd>${a.people}<small>人</small> ${a.n>a.people?`<small>(${a.n}件)</small>`:''}</dd></div>

      </section>`:''}

      ${a.avgProfile?`<section class="sec"><h3>フレーバープロファイル<small>PROFILE</small></h3><div class="radar-wrap">${radarSVG({avg:a.avgProfile, others, mine:myProfile})}
        <div class="legend"><span><i style="border-color:var(--amber)"></i>${a.profs.length>1?'みんなの平均':'記録'}</span>${others.length?`<span><i style="border-color:var(--muted)"></i>一人ひとり</span>`:''}${myProfile?`<span><i style="border-color:var(--peat);border-top-style:dashed"></i>あなた</span>`:''}</div></div></section>`:''}

      ${colorVotes}
      ${pairSection(pairW, { lead:pairLead })}

      ${a.n?`<section class="sec"><h3>一人ひとりの記録<small>TASTINGS</small></h3><div style="display:grid;gap:10px">${tastingCards}</div></section>`:''}
      ${zukanFor(b)?`<section class="sec"><h3>図鑑<small>GUIDE</small></h3><p class="small" style="margin:0 0 8px">この銘柄の一般的な情報と、似ている銘柄を見られます。</p><button class="btn" data-act="zukan">図鑑で見る</button></section>`:''}
      ${canDeleteBottle?`<div class="t-actions" id="delbottle"><button class="btn small danger" data-act="askdel-b">この銘柄を削除</button></div>`:''}
    </div>
    ${myId?`<div class="cta"><button class="btn primary" data-act="taste">${a.mine.length?(K.eat?'もう一度記録する':'もう一度テイスティングを記録'):(K.eat?`この${K.jp}を記録する`:'この銘柄をテイスティング')}</button></div>`:''}
  </div>`);

    const wgl=e.target.closest('[data-wglass]'); if(wgl) return openWineGlass(wgl.dataset.wglass);
    const dz=e.target.closest('[data-dz]'); if(dz) return openDrink(dz.dataset.dk, dz.dataset.dz);
    const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act;
    const tid=el.closest('[data-tid]')?.dataset.tid;
    if(act==='close') goBack();
    if(act==='taste') startTasting(b, false);
    if(act==='zukan'){ const z=zukanFor(b); if(z) openZukan(z.id); }
    if(act==='edit-b') openBottleForm(b, null, ()=>{ nav.replaceNext=true; openBottle(b.id); });
    if(act==='edit-t'){ const t=tastings.find(x=>x.id===tid); if(t) openTastingForm(b,t); }
    if(act==='askdel-t'){ el.parentElement.innerHTML=`<span>この記録を削除しますか？</span><button class="btn small" data-act="nodel-t">やめる</button><button class="btn small danger" data-act="del-t">削除する</button>`; }
    if(act==='nodel-t'){ el.parentElement.innerHTML=`<button class="btn small" data-act="edit-t">編集</button><button class="btn small danger" data-act="askdel-t">削除</button>`; }
    if(act==='del-t'){
      const { error } = await sb.from('reviews').delete().eq('id',tid);
      if(error){ toast('削除できませんでした：'+error.message); return; }
      allTastings=allTastings.filter(t=>t.id!==tid); refilter(); renderList(); openBottle(b.id,true); toast('記録を削除しました');
    }
    if(act==='askdel-b'){ $('#delbottle').innerHTML=`<span>銘柄を削除しますか？</span><button class="btn small" data-act="nodel-b">やめる</button><button class="btn small danger" data-act="del-b">削除する</button>`; }
    if(act==='nodel-b'){ $('#delbottle').innerHTML=`<button class="btn small danger" data-act="askdel-b">この銘柄を削除</button>`; }
    if(act==='del-b'){
      const { error } = await sb.from('bottles').delete().eq('id',b.id);
      if(error){ toast('削除できませんでした：'+error.message); return; }
      if(b.photo) sb.storage.from('photos').remove([b.photo]).catch(()=>{});
      allBottles=allBottles.filter(x=>x.id!==b.id); refilter(); currentBottle=null; renderList(); goBack(); toast('銘柄を削除しました');
    }
  };
}

/* ワイン：開栓後の変化（日ごとの点数・味わい・香りの違い） */
function afterOpening(a){
  if(!K.days || !a.list.some(t=>(t.day||1)>1)) return '';
  const g=new Map(); a.list.forEach(t=>{ const d=t.day||1; if(!g.has(d)) g.set(d,[]); g.get(d).push(t); });
  const days=[...g.keys()].sort((x,y)=>x-y), first=days[0], lastD=days[days.length-1];
  const avgOf=l=>{ const sc=l.map(t=>t.score).filter(x=>typeof x==='number'); return sc.length?sc.reduce((p,c)=>p+c,0)/sc.length:null; };
  const profOf=l=>{ const ps=l.map(t=>t.profile).filter(p=>p&&AXES.some(x=>p[x[0]]>0)); return ps.length?Object.fromEntries(AXES.map(([k])=>[k,ps.reduce((s,p)=>s+(+p[k]||0),0)/ps.length])):null; };
  const tagsOf=l=>new Set(l.flatMap(t=>PHASES.flatMap(([k])=>t[k]?.tags||[])));
  const base=avgOf(g.get(first));
  const rows=days.map(d=>{ const l=g.get(d), av=avgOf(l), diff=(d!==first&&av!=null&&base!=null)?av-base:null;
    return `<div class="bar"><span>開栓${d}日目</span><div class="track"><div class="fill${d===first?'':' mine'}" style="width:${av!=null?Math.max(4,(av-50)*2):0}%"></div></div><em>${av!=null?fmt1(av):'–'}${diff!=null?`<small class="${diff>=0?'up':'down'}"> ${diff>=0?'+':''}${fmt1(diff)}</small>`:''}</em></div>`; }).join('');
  const p1=profOf(g.get(first)), pN=profOf(g.get(lastD));
  const t1=tagsOf(g.get(first)), tN=tagsOf(g.get(lastD));
  const added=[...tN].filter(t=>!t1.has(t)), gone=[...t1].filter(t=>!tN.has(t));
  // あなたの直近のボトル（最後に1日目をつけたところから）
  const mine=a.list.filter(t=>t.author===myId).sort((x,y)=>x.createdAt-y.createdAt);
  let start=0; mine.forEach((t,i)=>{ if((t.day||1)===1) start=i; });
  const sess=mine.slice(start);
  const mySess = sess.length>1 ? `<p class="small" style="margin:10px 0 0">あなたの記録：${sess.map(t=>`${t.day||1}日目 <b style="font-family:var(--mono);color:var(--amber)">${t.score??'–'}</b>点`).join(' → ')}</p>` : '';
  return `<section class="sec"><h3>開栓後の変化<small>AFTER OPENING</small></h3>
    <p class="small" style="margin:0 0 8px">開けた日からの日数ごとの、みんなの平均点（${a.list.length}件）</p>
    <div class="bars dayb">${rows}</div>${mySess}
    ${p1&&pN?`<div class="radar-wrap" style="margin-top:10px">${radarSVG({ avg:p1, mine:pN })}
      <div class="legend"><span><i style="border-color:var(--amber)"></i>開栓${first}日目</span><span><i style="border-color:var(--peat);border-top-style:dashed"></i>開栓${lastD}日目</span></div></div>`:''}
    ${added.length?`<div class="group-name">開栓${lastD}日目に感じられた香り</div><div class="chips">${added.slice(0,8).map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div>`:''}
    ${gone.length?`<div class="group-name">開栓${first}日目だけの香り</div><div class="chips">${gone.slice(0,8).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
  </section>`;
}

/* ---------- 投稿の流れ：銘柄を選ぶ → （新しければ登録）→ テイスティング ---------- */
function openPicker(){
  curSheet={t:'picker'};
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄を選ぶ">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">キャンセル</button><h2>どの銘柄を飲みましたか？</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <div class="field"><label class="lbl" for="pk-q">${L.pickLbl}</label><input id="pk-q" placeholder="${L.pickPh}" autocomplete="off"></div>
      <p class="small" style="margin:-10px 0 0">図鑑の銘柄から選ぶと、同じ銘柄の記録がひとつにまとまります。</p>
      <div class="pick" id="pk-list"></div>
    </div></div>`);
  const draw=()=>{
    const q=$('#pk-q').value.trim(), nq=norm(q);
    let rows=bottles.map(b=>({b,a:aggs.get(b.id)}));
    if(nq) rows=rows.filter(({b})=>norm(b.name+b.distillery).includes(nq));
    rows.sort((x,y)=>(y.a.lastAt||y.b.createdAt)-(x.a.lastAt||x.b.createdAt));
    const exact = nq && (bottles.some(b=>norm(b.name)===nq) || ZE.some(z=>norm(z.name)===nq));
    const zs = nq ? ZE.filter(z=>!bottleForZ(z) && norm([z.name,z.en,z.distillery,z.label].join(' ')).includes(nq)).slice(0,30) : [];
    const head = t => `<div class="group-name pk-h">${t}</div>`;
    $('#pk-list').innerHTML =
      (rows.length ? head(q?'記録のある銘柄':'最近記録された銘柄') : '')
      + rows.slice(0, q?20:15).map(({b,a})=>`<button data-pick="${esc(b.id)}"><span><strong>${esc(b.name)}</strong><br><small>${esc([b.distillery,ageText(b.age)].filter(Boolean).join(' · ')||'—')}</small></span><small>${a.people}人${a.mine.length?'・記録済み':''}</small></button>`).join('')
      + (zs.length ? head('図鑑から選ぶ') + zs.map(z=>`<button data-pickz="${esc(z.id)}"><span><strong>${esc(z.name)}</strong><br><small>${esc([z.distillery, ZR[z.region]?.jp].filter(Boolean).join(' · '))}</small></span><small>図鑑</small></button>`).join('') : '')
      + (!q ? `<p class="small">名前を入力すると、図鑑の${ZE.length}銘柄からも探せます。</p>` : '')
      + (q && !exact ? `${head('見つからないとき')}<button class="new" data-act="new">＋「${esc(q)}」を新しい銘柄として登録</button>` : '');
  };
  draw();
  const root=$('#sheet-root');
  root.oninput=e=>{ if(e.target.id==='pk-q') draw(); };
  root.onclick=e=>{
    const el=e.target.closest('button'); if(!el) return;
    if(el.dataset.act==='close') goBack();
    if(el.dataset.pick){ const b=bottles.find(x=>x.id===el.dataset.pick); if(b) startTasting(b,true); }
    if(el.dataset.pickz){ const z=ZE.find(x=>x.id===el.dataset.pickz); if(z){ el.disabled=true; tasteZukan(z); } }
    if(el.dataset.act==='new') openBottleForm(null, $('#pk-q').value.trim(), b=>{ nav.replaceNext=true; openTastingForm(b,null,true); });
  };
  setTimeout(()=>$('#pk-q')?.focus(),50);
}

function openBottleForm(existing, prefill, onDone, onCancel){
  curSheet={t:'bform', id:existing?.id||null, prefill: prefill && typeof prefill==='object' ? prefill : (prefill||'')};
  const base = {name:'',distillery:'',type:K.defType,region:'',age:'',abv:'',cask:'',photo:''};
  const f = existing ? {...existing} : typeof prefill==='object' && prefill ? {...base, ...prefill} : {...base, name:prefill||''};
  let newPhoto=null, previewUrl=f.photo?photoUrl(f.photo):'', saving=false; const oldPhoto=f.photo||'';
  const opt=(list,v)=>`<option value="">—</option>`+list.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄の情報">
    <div class="sheet-bar"><button class="btn ghost" data-act="cancel">${existing?'キャンセル':'‹ 戻る'}</button><h2>${existing?'銘柄の情報を編集':'新しい銘柄を登録'}</h2><button class="btn primary" data-act="save" id="savebtn">${existing?'保存':'次へ'}</button></div>
    <form class="sheet-body" novalidate>
      ${existing?`<p class="hint">${K.unit||'ボトル'}の情報はみんなで共有しています。${K.noAbv?'':'度数や'}${L.cask}の間違いに気づいたら、誰でも直せます。</p>`:''}
      <fieldset><legend>${K.unit||'ボトル'}</legend>
        <div class="field"><label class="lbl" for="b-name">銘柄名（必須）</label><input id="b-name" value="${esc(f.name)}" placeholder="${L.namePh}" autocomplete="off"></div>
        <div class="field"><label class="lbl" for="b-dist">${L.makerForm}</label><input id="b-dist" value="${esc(f.distillery)}" placeholder="${L.makerPh}" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label class="lbl" for="b-type">${L.typeLbl}</label><select id="b-type">${opt(TYPES,f.type)}</select></div>
          <div class="field"><label class="lbl" for="b-region">産地</label><select id="b-region">${opt(REGIONS,f.region)}</select></div>
        </div>
        <div class="row3">
          <div class="field"${K.noAge?' hidden':''}><label class="lbl" for="b-age">${L.ageForm}</label><input id="b-age" inputmode="numeric" value="${esc(f.age)}" placeholder="${L.agePh}"></div>
          <div class="field"${K.noAbv?' hidden':''}><label class="lbl" for="b-abv">度数 %</label><input id="b-abv" inputmode="decimal" value="${esc(f.abv)}" placeholder="${L.abvPh}"></div>
          <div class="field"><label class="lbl" for="b-cask">${L.cask}</label><input id="b-cask" value="${esc(f.cask)}" placeholder="${L.caskPh}"></div>
        </div>
        <div class="field"><label class="lbl" for="b-price">価格（円）</label><input id="b-price" inputmode="numeric" value="${f.price?esc(f.price):''}" placeholder="例：1980" autocomplete="off">
          <p class="small" style="margin:4px 0 0">買ったときのおおよその値段。図鑑の価格帯での絞り込みや比較に使われます。</p></div>
      </fieldset>
      <fieldset><legend>${K.unit||'ボトル'}の写真</legend>
        <label class="photo-drop" id="pdrop">${previewUrl?`<img src="${esc(previewUrl)}" alt="">`:`<span>タップして${K.unit||'ボトル'}を撮影<br>またはライブラリから選択</span>`}
          <input type="file" id="b-photo" accept="image/*" aria-label="写真を選ぶ"></label>
      </fieldset>
      <div class="err" id="err" hidden></div>
    </form></div>`);
  const root=$('#sheet-root');
  root.onchange=async e=>{
    if(e.target.id!=='b-photo') return; const file=e.target.files?.[0]; if(!file) return;
    try{ newPhoto=await shrink(file); previewUrl=URL.createObjectURL(newPhoto); $('#pdrop').querySelector('img,span').outerHTML=`<img src="${esc(previewUrl)}" alt="">`; }
    catch(err){ toast('この画像は読み込めませんでした'); }
  };
  root.onclick=async e=>{
    const el=e.target.closest('button'); if(!el) return;
    if(el.dataset.use){ const b=bottles.find(x=>x.id===el.dataset.use); if(b){ nav.replaceNext=true; openTastingForm(b,null,true); } return; }
    if(el.dataset.act==='cancel') return goBack();
    if(el.dataset.act!=='save' || saving) return;
    const err=$('#err');
    const data={ name:$('#b-name').value.trim(), distillery:$('#b-dist').value.trim(), type:$('#b-type').value, region:$('#b-region').value,
      age:$('#b-age').value.trim(), abv:$('#b-abv').value.trim(), cask:$('#b-cask').value.trim() };
    const pr=$('#b-price').value.normalize('NFKC').replace(/[^\d]/g,''); data.price = pr ? Math.min(99999999,+pr) : null;
    if(!data.name){ err.textContent='銘柄名を入力してください。'; err.hidden=false; $('#b-name').focus(); return; }
    const dup = bottles.find(b=>norm(b.name)===norm(data.name) && b.id!==existing?.id);
    if(dup){ err.innerHTML=`「${esc(dup.name)}」はすでに登録されています。<button type="button" class="btn small" data-use="${esc(dup.id)}">その銘柄で記録する</button>`; err.hidden=false; return; }
    saving=true; el.disabled=true; el.textContent='保存中…'; err.hidden=true;

      if(newPhoto){

      if(newPhoto && oldPhoto) sb.storage.from('photos').remove([oldPhoto]).catch(()=>{});
      const nb=rowToBottle(res.data);
      allBottles=[nb,...allBottles.filter(b=>b.id!==nb.id)]; refilter(); renderList();

  };
}

function blankTasting(){ return {serve:K.defServe,color:'',nose:{tags:[],note:''},palate:{tags:[],note:''},finish:{tags:[],note:''},finishLength:'',
  profile:Object.fromEntries(AXES.map(a=>[a[0],0])),score:85,comment:''}; }

/* ワイン：開栓後の日数 */
const dayDiff = (a,b) => { const d=x=>{ const t=new Date(x); return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); }; return Math.round((d(b)-d(a))/864e5); };
const myTastingsOf = bid => tastings.filter(t=>t.bottleId===bid && t.author===myId).sort((x,y)=>y.createdAt-x.createdAt);
function startTasting(b, fromPicker){
  if(!K.days || !myId || !myTastingsOf(b.id).length) return openTastingForm(b, null, fromPicker, 1);
  openDayPick(b, fromPicker);
}
function openDayPick(b, fromPicker){
  curSheet={t:'daypick', b:b.id, fp:!!fromPicker};
  const last=myTastingsOf(b.id)[0]; const lastDay=last.day||1;
  const gap=dayDiff(last.createdAt, Date.now()); const next=lastDay+Math.max(1,gap);
  const nextBtn=`<button class="dp${gap>0?' main':''}" data-day="${next}"><b>開栓${next}日目として記録する</b><span>${gap>0?`前回の記録から${gap}日後です。`:'同じボトルの続きとして記録します。'}開けてからの味の変化を残せます。</span></button>`;
  const editBtn=`<button class="dp${gap>0?'':' main'}" data-edit="${esc(last.id)}"><b>開栓${lastDay}日目の記録を編集する</b><span>追記や書き間違いの修正はこちら。</span></button>`;
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="どの記録をつけますか">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">${fromPicker?'‹ 戻る':'キャンセル'}</button><h2>${esc(b.name)}</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <div><h1 class="dp-title">開栓何日目の記録ですか？</h1>
        <p class="small" style="margin:6px 0 0">あなたの前回の記録：${fmtDate(last.createdAt)}・開栓${lastDay}日目・${last.score??'–'}点</p></div>
      <div class="daypick">${gap>0?nextBtn+editBtn:editBtn+nextBtn}

      <p class="note-small">${esc(K.jp)}は開けたあと、空気に触れて香りや味わいが変わっていきます。日ごとに記録すると、銘柄のページで「開栓後の変化」として比べられます。</p>
    </div></div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-day],[data-edit]'); if(!el) return;

    if(el.dataset.edit){ const t=tastings.find(x=>x.id===el.dataset.edit); if(t) openTastingForm(b, t, true); }
  };
}

      const row={ data, score:f.score, author_name:nickname||myName()||null, bottle_id:bottle.id };
      const res = existing
        ? await sb.from('reviews').update({...row, updated_at:new Date().toISOString()}).eq('id',existing.id).select().single()
        : await sb.from('reviews').insert(row).select().single();
      if(res.error) throw new Error(res.error.message);
      const t=rowToTasting(res.data);
      allTastings=[t,...allTastings.filter(x=>x.id!==t.id)]; refilter(); renderList();

  }
}

/* ---------- 図鑑 ---------- */
const zk = { mode:'region', country:null, region:null, axes:[], types:[], tags:[], prices:[], q:'' };
const priceBand = v => !v ? '' : v>=10000 ? `${Math.floor(v/10000)}万円台` : v<1000 ? `${Math.round(v/100)*100}円` : `${Math.floor(v/1000).toLocaleString('ja-JP')},000円台`;
const keyNorm = s => norm(s).replace(/^(ザ|the)/,'').replace(/(年|years?old|years?|yo)$/,'');
const profArr = obj => AXES.map(a=>+(obj?.[a[0]]||0));
const arrProf = arr => Object.fromEntries(AXES.map((a,i)=>[a[0],arr[i]]));
const glassColor = k => (colorOf(k)||COLORS[3])[2];
const zEntry = id => ZE.find(x=>x.id===id);
const zDist = id => ZD.find(x=>x.id===id);
const compare = { a:null, b:null };

function zukanFor(b){
  if(b.zukanId){ const z=ZE.find(x=>x.id===b.zukanId); if(z) return z; }
  const k = keyNorm(b.name);
  return ZE.find(z => keyNorm(z.name)===k || keyNorm(z.en)===k) || null;
}
function bottleForZ(z){
  const linked = bottles.find(b=>b.zukanId===z.id); if(linked) return linked;
  const a=keyNorm(z.name), e=keyNorm(z.en);
  return bottles.find(b=>{ const k=keyNorm(b.name); return k===a || k===e; }) || null;
}
// みんなの記録だけにある銘柄（図鑑にないもの）も、似ている銘柄・検索の対象にする
function communityItems(){
  return bottles.filter(b=>!zukanFor(b)).map(b=>{ const a=aggs.get(b.id); if(!a?.avgProfile && !b.price) return null;
    const regionKey = Object.keys(ZR).find(k=>(ZR[k].picks||[ZR[k].pick]).filter(Boolean).includes(b.region)) || null;
    return { id:'b:'+b.id, bottleId:b.id, name:b.name, en:'', distillery:b.distillery, region:regionKey, type:b.type, age:b.age, abv:b.abv, price:b.price||0, cask:b.cask,
      color:(Object.entries(a.colors).sort((x,y)=>y[1]-x[1])[0]||[])[0]||'', p:profArr(a?.avgProfile), tags:topTags(a,6).map(t=>t[0]), community:true, people:a.people };
  }).filter(Boolean);
}
function similarity(x,y){
  const d=Math.sqrt(x.p.reduce((s,v,i)=>s+(v-y.p[i])**2,0));
  const prof=Math.max(0,1-d/9);
  const A=new Set(x.tags), B=new Set(y.tags); const inter=[...A].filter(t=>B.has(t));
  const jac = (A.size||B.size) ? inter.length/new Set([...A,...B]).size : 0;
  return { score: prof*0.8 + jac*0.2, shared: inter };
}
// 同じ蒸留所の銘柄は「似ている銘柄」から外し、別の蒸留所の候補を見せる
function similarTo(item, n=5){
  const pool=[...ZE, ...communityItems()].filter(o=>o.id!==item.id && o.p.some(v=>v>0) && (!item.distilleryId || o.distilleryId!==item.distilleryId));
  return pool.map(o=>({o, ...similarity(item,o)})).sort((a,b)=>b.score-a.score).slice(0,n);
}
function projXY(lon,lat){ const P=ZUKAN_MAP.proj; return [ (lon-P.lon0)*P.c*P.k, (P.lat1-lat)*P.k ]; }

function mapSVG({ sel=null, focus=null, interactive=true, cls='zmap' }={}){
  const M=ZUKAN_MAP;
  const clips = Object.entries(M.clips).map(([k,v])=>`<clipPath id="zc-${k}"><polygon points="${v}"/></clipPath>`).join('')
    + `<mask id="zm-high" maskUnits="userSpaceOnUse" x="0" y="0" width="${M.w}" height="${M.h}"><rect width="${M.w}" height="${M.h}" fill="#fff"/>${Object.values(M.clips).map(v=>`<polygon points="${v}" fill="#000"/>`).join('')}</mask>`;
  const rg = (key, d, clip, mask) => `<g class="rg${sel===key?' sel':''}" data-region="${key}"${interactive?` role="button" tabindex="0" aria-label="${ZUKAN_REGIONS[key].jp}"`:''}${clip?` clip-path="url(#zc-${clip})"`:''}${mask?` mask="url(#${mask})"`:''}><path d="${d}"/></g>`;
  const dots = ZUKAN_DISTILLERIES.filter(d=>d.lat!=null).map(d=>{ const [x,y]=projXY(d.lon,d.lat);
    const c = focus ? (d.id===focus?'dot focus':'dot') : (sel && d.region===sel ? 'dot on' : 'dot');
    return `<circle class="${c}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d.id===focus?4.5:2.3}"/>`; }).join('');
  const labels = interactive ? Object.entries(ZUKAN_REGIONS).filter(([,r])=>r.scot).map(([k,r])=>{ const [x,y]=projXY(r.label[0],r.label[1]);
    return `<text class="lbl${sel===k?' sel':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${r.jp}</text>`; }).join('') : '';
  return `<svg class="${cls}${sel?' has-sel':''}" viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="スコットランドのウイスキー産地の地図">
    <defs>${clips}</defs>
    <path class="near" d="${M.near}"/>
    <path class="land" d="${M.mainland}"/><path class="land" d="${M.islay}${M.islands}"/><path class="other" d="${M.other}"/>
    ${rg('highland',M.mainland,null,'zm-high')}${rg('lowland',M.mainland,'lowland')}${rg('speyside',M.mainland,'speyside')}${rg('campbeltown',M.mainland,'campbeltown')}
    ${rg('islay',M.islay)}${rg('islands',M.islands)}
    ${dots}${labels}</svg>`;
}

/* ---------- 世界地図 → 国別地図 ---------- */
const SHORT_NAME = { chichibu:'秩父', fujigotemba:'富士御殿場', marsshinshu:'マルス信州' };
const shortName = d => SHORT_NAME[d.id] || d.name.replace(/^(サントリー|ニッカ|キリン)\s*/,'').replace(/蒸溜所|蒸留所/,'').replace(/（.*?）/,'').trim();
const countDist = key => ZD.filter(d=>ZK_COUNTRIES[key].regions.includes(d.region)).length;
const countEx = key => ZE.filter(z=>ZK_COUNTRIES[key].regions.includes(z.region)).length;

function worldSVG(){
  const M=ZW.world, P=M.proj, xy=(lon,lat)=>[(lon-P.lon0)*P.c*P.k,(P.lat1-lat)*P.k];
  const hi = BIG5.map(k=>`<path class="wc" data-country="${k}" d="${M.hi[k]}"/>`).join('');
  const pins = BIG5.map(k=>{ const c=ZK_COUNTRIES[k]; const [x,y]=xy(...c.mark); const [lx,ly,anc]=WORLD_LABEL[k];
    const tw=c.style.length*4.2+4; const bx = anc==='start'?lx-2:anc==='end'?lx-tw+2:lx-tw/2;
    return `<g class="wpin" data-country="${k}" role="button" tabindex="0" aria-label="${c.style}">
      <line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${lx}" y2="${ly-1.5}"/>
      <circle class="whit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>
      <circle class="ring" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/><circle class="core" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.2"/>
      <rect x="${bx.toFixed(1)}" y="${(ly-5).toFixed(1)}" width="${tw.toFixed(1)}" height="6.6" rx="3.3"/>
      <text x="${lx}" y="${ly}" text-anchor="${anc}">${c.style}</text></g>`; }).join('');
  return `<svg class="wmap" viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="${L.worldAria}"><path class="wbase" d="${M.base}"/>${hi}${pins}</svg>`;
}

// 国別地図：蒸留所の点と名前（重ならないように配置）
function countryMapSVG(key, { focus=null, mini=false, sel=null }={}){
  const C=ZK_COUNTRIES[key], M=ZW[C.map], P=M.proj;
  const xy=(lon,lat)=>[(lon-P.lon0)*P.c*P.k,(P.lat1-lat)*P.k];
  const s=M.w/340, fs=10*s, r=3.6*s;
  const byRegion = !mini && C.regions.length>1 && C.regions.every(k=>ZR[k]?.label);
  const ds=ZD.filter(d=>C.regions.includes(d.region) && d.lat!=null);
  const pts = byRegion
    ? C.regions.map(k=>{ const [x,y]=xy(...ZR[k].label); return {d:{id:k, name:ZR[k].jp}, region:k, x, y, t:ZR[k].short||ZR[k].jp.replace(/（.*?）/,'')}; })
    : ds.map(d=>{ const [x,y]=xy(d.lon,d.lat); return {d,x,y,t:shortName(d)}; });
  const boxes=pts.map(p=>({x0:p.x-r,y0:p.y-r,x1:p.x+r,y1:p.y+r}));
  const hit=(b)=>boxes.some(o=>!(b.x1<o.x0||b.x0>o.x1||b.y1<o.y0||b.y0>o.y1)) || b.x0<0 || b.y0<0 || b.x1>M.w || b.y1>M.h;
  let labels;
  if(C.callout && !mini){
    // 密集した地域は、左右の列に名前を並べて線で結ぶ
    const midX = M.w/2, gap=fs*1.5, padY=fs*1.6;
    const place = (arr, side) => { arr.sort((a,b)=>a.y-b.y); let last=-1e9;
      return arr.map(p=>{ let ly=Math.max(p.y, last+gap, padY); ly=Math.min(ly, M.h-fs*0.6); last=ly;
        const lx = side==='l' ? 6*s : M.w-6*s; return {p, pick:[lx, ly+fs*0.35, side==='l'?'start':'end'], lead:[side==='l'?lx+p.t.length*fs*0.98+3*s:lx-p.t.length*fs*0.98-3*s, ly]}; }); };
    const L=pts.filter(p=>p.x<midX), R=pts.filter(p=>p.x>=midX);
    labels=[...place(L,'l'), ...place(R,'r')];
  } else labels=pts.map(p=>{
    if(mini) return {p, pick:null};
    const w=p.t.length*fs*0.98, g=r+2*s;
    const cands=[[p.x+g,p.y+fs*0.35,'start'],[p.x-g,p.y+fs*0.35,'end'],[p.x,p.y-g-fs*0.2,'middle'],[p.x,p.y+g+fs*0.85,'middle'],
      [p.x+g*0.8,p.y-g*0.8,'start'],[p.x+g*0.8,p.y+g*0.8+fs*0.7,'start'],[p.x-g*0.8,p.y-g*0.8,'end'],[p.x-g*0.8,p.y+g*0.8+fs*0.7,'end']];
    const box=([tx,ty,a])=>{ const x0=a==='start'?tx:a==='end'?tx-w:tx-w/2; return {x0,y0:ty-fs*0.85,x1:x0+w,y1:ty+fs*0.15}; };
    let pick=cands.find(c=>!hit(box(c))) || cands[0];
    boxes.push(box(pick)); return {p,pick};
  });
  const sub = (M.hi?Object.values(M.hi).map(d=>`<path class="hi" d="${d}"/>`).join(''):'')
    + (M.labels?M.labels.map(([t,x,y])=>`<text class="state" x="${x}" y="${y}" text-anchor="middle" style="font-size:${(8*s).toFixed(1)}px">${t}</text>`).join(''):'');
  const dots = labels.map(({p,pick,lead})=> mini
    ? `<circle class="mdot${p.d.id===focus?' focus':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(p.d.id===focus?r*2:r).toFixed(1)}" style="stroke-width:${(1.6*s).toFixed(2)}"/>`
    : `<g class="dpin${p.region?' rpin'+(sel===p.region?' sel':sel?' dim':''):''}" ${p.region?`data-world="${esc(p.region)}" aria-pressed="${sel===p.region}"`:`data-d="${esc(p.d.id)}"`} role="button" tabindex="0" aria-label="${esc(p.d.name)}">
      ${lead?`<line class="lead" x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${lead[0].toFixed(1)}" y2="${lead[1].toFixed(1)}" style="stroke-width:${(0.8*s).toFixed(2)}"/>`:''}
      <circle class="hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r*3).toFixed(1)}"/>
      <circle class="dot2" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" style="stroke-width:${(1.4*s).toFixed(2)}"/>
      <text x="${pick[0].toFixed(1)}" y="${pick[1].toFixed(1)}" text-anchor="${pick[2]}" style="font-size:${fs.toFixed(1)}px;stroke-width:${(3*s).toFixed(1)}px">${esc(p.t)}</text></g>`).join('');
  return `<svg class="cmap${mini?' mini':''}" viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="${C.jp}の${byRegion?'産地':L.maker}の地図">

}
