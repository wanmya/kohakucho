<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>琥珀帳</title>
<meta name="description" content="ウイスキーのテイスティングを記録して仲間と共有するノート">
<meta name="theme-color" content="#F1EEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="琥珀帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1/dist/umd/supabase.js"></script>
<style>
/* Layout: phone-first single column; sticky header, card list, full-screen sheets for detail and form; amber is the one bold note */
:root{
  --bg:#F1EEE9; --surface:#FFFFFF; --ink:#1F1A15; --muted:#6D645A; --line:#DCD4C9;
  --amber:#A9581A; --amber-ink:#FFFFFF; --amber-soft:#F2E2CD; --peat:#3D5A4A; --danger:#B33A2B;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15110D; --surface:#201A14; --ink:#EFE6DA; --muted:#A79A8B; --line:#3A3027;
  --amber:#E39A4E; --amber-ink:#1A120A; --amber-soft:#3A2817; --peat:#8EB19C; --danger:#E5735F; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* iOSのズーム防止 */
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:.04em}
.brand small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:32px;cursor:pointer;font-size:16px;line-height:1;align-self:center}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--amber-soft);color:var(--ink);font-weight:700}

.list{display:grid;gap:12px;padding-top:14px}
.card{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%;cursor:pointer}
.thumb{width:76px;height:96px;border-radius:9px;object-fit:cover;background:var(--amber-soft);display:grid;place-items:center;overflow:hidden}
.thumb .glass{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.card .info{min-width:0}
.card h3{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.3;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagline span{font-size:11.5px;background:var(--bg);border-radius:999px;padding:1px 8px;color:var(--muted)}
.score{text-align:center;padding-right:4px}
.score b{display:block;font-family:var(--mono);font-size:26px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.score i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.by{font-size:11.5px;color:var(--muted);margin-top:4px}

.empty{padding:48px 8px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--ink);font-size:20px;margin:0 0 6px}
.notice{padding:12px 14px;border-radius:10px;background:var(--amber-soft);font-size:13.5px}
.notice code{font-family:var(--mono);font-size:12px}

.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--amber);color:var(--amber-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(80,40,10,.28);cursor:pointer}

.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.sheet-bar h2{font-size:15px;margin:0;flex:1;text-align:center;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn:disabled{opacity:.5}
.sheet-body{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(60px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}

fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--display);font-weight:800;font-size:18px;padding:0;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.group-name{font-size:11.5px;color:var(--peat);font-weight:700;letter-spacing:.08em;margin:6px 0 4px}
.photo-drop{display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);min-height:150px;cursor:pointer;overflow:hidden;position:relative}
.photo-drop img{width:100%;max-height:320px;object-fit:cover}
.photo-drop span{color:var(--muted);font-size:14px;padding:20px;text-align:center}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:11px;display:grid;justify-items:center;gap:4px;cursor:pointer;color:var(--muted)}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--amber);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--amber)}
.phase{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.phase button{border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px}
.phase button[aria-pressed="true"]{background:var(--amber-soft);color:var(--ink);font-weight:700}
.phase em{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--amber)}
.addtag{display:flex;gap:6px}
.addtag input{flex:1;min-width:0}
.sliders{display:grid;gap:8px}
.sl{display:grid;grid-template-columns:5.5em 1fr 1.5em;gap:10px;align-items:center;font-size:13.5px}
.sl output{font-family:var(--mono);text-align:right;color:var(--amber);font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--amber);width:100%}
.radar-wrap{display:grid;place-items:center}
.radar{width:100%;max-width:300px;height:auto}
.scorebox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.scorebox output{font-family:var(--mono);font-size:40px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.scorebox .word{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px}

.hero{border-radius:14px;overflow:hidden;background:var(--amber-soft)}
.hero img{width:100%;max-height:420px;object-fit:cover;display:block}
.d-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.d-head h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.d-score{text-align:right}
.d-score b{font-family:var(--mono);font-size:44px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.d-score div{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.facts div{background:var(--surface);padding:9px 10px;min-width:0}
.facts dt{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.facts dd{margin:0;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.colorline{display:flex;align-items:center;gap:10px;font-size:14px}
.colorline i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.note h3{font-family:var(--display);font-size:17px;margin:0 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.note h3 small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.14em;font-weight:500}
.note p{margin:6px 0 0;white-space:pre-wrap}
.d-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menu-list{display:grid;gap:12px}
.menu-list h3{font-family:var(--display);font-size:17px;margin:0 0 4px}
.menu-list p{margin:0;font-size:14px}
.steps{margin:6px 0 0;padding-left:1.3em;font-size:14px}
.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
@media (max-width:380px){.row3{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>琥珀帳</h1><small>Whisky Notes</small><span class="count" id="count"></span>
      <button class="menu-btn" id="menu" aria-label="メニュー">⋯</button></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="銘柄・蒸留所・香りで検索" aria-label="検索">
      <div class="seg" role="group" aria-label="表示">
        <button id="f-all" aria-pressed="true">みんな</button>
        <button id="f-mine" aria-pressed="false">自分</button>
      </div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="並び順">
        <button id="s-new" aria-pressed="true">新しい順</button>
        <button id="s-score" aria-pressed="false">評価順</button>
      </div>
    </div>
  </header>
  <main id="list" class="list" aria-live="polite">
    <div class="empty"><h2>読み込み中…</h2></div>
  </main>
</div>
<button class="fab" id="add" hidden>＋ テイスティングを記録</button>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const APP_VERSION = '2026.10.11';

const COLORS = [
  ['white','ホワイトワイン','#F6F0D6'],['straw','ペールストロー','#F1E2A0'],['gold','ゴールド','#E7C25A'],['oldgold','オールドゴールド','#D9A63A'],
  ['amber','アンバー','#C9852B'],['copper','カッパー','#AE6420'],['mahogany','マホガニー','#7C3B16'],['treacle','トリークル','#43200D']
];
const AXES = [['smoky','スモーキー'],['fruity','フルーティ'],['floral','フローラル'],['sweet','スウィート'],['spicy','スパイシー'],['woody','ウッディ'],['malty','モルティ'],['winey','ワイニー']];
const TAGS = [
  ['フルーティ',['青りんご','洋梨','柑橘','レモンピール','オレンジ','桃','バナナ','ベリー','トロピカル','レーズン','ドライフルーツ','プラム']],
  ['フローラル・草',['花','ヘザー','蜂蜜','刈った草','干し草','ハーブ','ミント']],
  ['スウィート',['バニラ','キャラメル','トフィー','ファッジ','チョコレート','メープル','ブラウンシュガー']],
  ['穀物',['モルト','ビスケット','パン','シリアル','オートミール']],
  ['ウッディ',['オーク','シダー','新樽','ナッツ','アーモンド','ココナッツ','白檀']],
  ['スパイシー',['シナモン','クローブ','黒胡椒','ジンジャー','ナツメグ','アニス']],
  ['ピート・スモーク',['ピート','スモーク','焚き火','ヨード','正露丸','潮','海藻','タール','ベーコン']],
  ['ワイン系',['シェリー','赤ワイン','ポート','ラムレーズン']],
  ['その他',['革','タバコ','土','ミネラル','硫黄','アルコール感','オイリー']]
];
const PHASES = [['nose','ノーズ','NOSE'],['palate','パレート','PALATE'],['finish','フィニッシュ','FINISH']];
const TYPES = ['シングルモルト','ブレンデッド','ブレンデッドモルト','シングルグレーン','バーボン','ライ','その他'];
const REGIONS = ['スペイサイド','ハイランド','アイラ','ローランド','キャンベルタウン','アイランズ','日本','アイルランド','アメリカ','カナダ','台湾','インド','その他'];
const SERVES = ['ストレート','少量加水','ロック','ハイボール','トワイスアップ'];
const FINLEN = ['ショート','ミディアム','ロング'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scoreWord = n => n>=95?'傑出':n>=90?'秀逸':n>=85?'とても良い':n>=80?'良い':n>=75?'ふつう':'いまいち';
const colorOf = k => COLORS.find(c => c[0]===k);
const fmtDate = t => { const d=new Date(t); return isNaN(d)?'':`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

let sb=null, myId=null, reviews=[], loaded=false, setupError='';
let filter='all', sort='new', query='';
let installEvt=null;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
const photoUrl = path => (!path||!sb) ? '' : sb.storage.from('photos').getPublicUrl(path).data.publicUrl;

/* ---------- データ層（Supabase） ---------- */
const rowToReview = r => ({ ...(r.data||{}), id:r.id, author:r.user_id, authorName:r.author_name||'', score:r.score ?? r.data?.score,
  createdAt:Date.parse(r.created_at), updatedAt:Date.parse(r.updated_at) });

async function loadReviews(){
  const { data, error } = await sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(1000);
  if(error){ setupError = error.message; loaded=true; renderList(); return; }
  reviews = data.map(rowToReview); loaded=true; setupError=''; renderList();
}
let reloadTimer=null;
const scheduleReload = () => { clearTimeout(reloadTimer); reloadTimer=setTimeout(loadReviews,300); };

async function boot(){
  const cfg = window.KOHAKU_CONFIG || {};
  if(!window.supabase || !cfg.SUPABASE_URL || /xxxx/.test(cfg.SUPABASE_URL) || !cfg.SUPABASE_ANON_KEY || /ここに/.test(cfg.SUPABASE_ANON_KEY)){
    setupError = 'config'; loaded=true; renderList(); return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  try{
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){ const r = await sb.auth.signInAnonymously(); if(r.error) throw r.error; session = r.data.session; }
    myId = session?.user?.id || null;
  }catch(e){ console.warn(e); toast('ログインできませんでした。閲覧のみで開いています。'); }
  $('#add').hidden = !myId;
  await loadReviews();
  sb.channel('reviews-live').on('postgres_changes',{event:'*',schema:'public',table:'reviews'},scheduleReload).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') scheduleReload(); });
}

/* ---------- レーダー ---------- */
function radarSVG(p, size=280){
  const c=size/2, R=size/2-46, n=AXES.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [c+Math.cos(a)*R*v/5, c+Math.sin(a)*R*v/5]; };
  let g='';
  for(let r=1;r<=5;r++){ g+=`<polygon points="${AXES.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${r===5?1.2:.8}"/>`; }
  AXES.forEach((a,i)=>{ const [x,y]=pt(i,5); g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".8"/>`;
    const [lx,ly]=pt(i,6.4); g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="var(--muted)" font-family="var(--body)">${a[1]}</text>`; });
  const vals=AXES.map(a=>+(p?.[a[0]]||0));
  g+=`<polygon points="${vals.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="var(--amber)" fill-opacity=".28" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{ if(v>0){ const [x,y]=pt(i,v); g+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--amber)"/>`; }});
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="フレーバープロファイル">${g}</svg>`;
}

/* ---------- 一覧 ---------- */
function visible(){
  let r = reviews.slice();
  if(filter==='mine') r = r.filter(x=>x.author && x.author===myId);
  if(query){ const q=query.toLowerCase();
    r = r.filter(x=>[x.name,x.distillery,x.region,x.type,x.cask,x.comment,x.authorName,...['nose','palate','finish'].flatMap(k=>x[k]?.tags||[])].join(' ').toLowerCase().includes(q)); }
  r.sort(sort==='score' ? (a,b)=>(b.score||0)-(a.score||0) : (a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return r;
}
const nameOf = x => x.author && x.author===myId ? 'あなた' : (x.authorName || 'メンバー');

function renderList(){
  const list=$('#list');
  $('#count').textContent = loaded && !setupError ? `${reviews.length} 本` : '';
  if(setupError==='config'){
    list.innerHTML = `<div class="empty"><h2>初期設定が必要です</h2></div><div class="notice"><code>config.js</code> に Supabase の URL と anon キーを書き込んで、GitHub にアップロードしてください。手順は同梱の <code>README.md</code> にあります。</div>`;
    return;
  }
  if(setupError){
    list.innerHTML = `<div class="empty"><h2>記録を読み込めませんでした</h2><p>通信状態を確認して開き直してください。</p></div><div class="notice">詳細：${esc(setupError)}<br>はじめて使う場合は、<code>supabase-setup.sql</code> を Supabase で実行したか確認してください。</div>`;
    return;
  }
  if(!loaded) return;
  const r=visible();
  if(!reviews.length){
    list.innerHTML = `<div class="empty"><h2>まだ一本もありません</h2><p>右下の「テイスティングを記録」から、最初のボトルを登録しましょう。<br>銘柄・写真・色・香りと味・評価を残せます。</p></div>`;
    return;
  }
  if(!r.length){ list.innerHTML = `<div class="empty"><h2>該当する記録がありません</h2><p>検索語や表示の切り替えを変えてみてください。</p></div>`; return; }
  list.innerHTML = r.map(x=>{
    const col=colorOf(x.color);
    const thumb = x.photo ? `<img class="thumb" src="${esc(photoUrl(x.photo))}" alt="" loading="lazy">`
      : `<div class="thumb"><div class="glass" style="background:${col?col[2]:'var(--line)'}"></div></div>`;
    const tags=[...(x.nose?.tags||[]),...(x.palate?.tags||[])].filter((t,i,a)=>a.indexOf(t)===i).slice(0,4);
    const meta=[x.distillery,x.age?x.age+'年':'',x.abv?x.abv+'%':''].filter(Boolean).join(' · ');
    return `<button class="card" data-id="${esc(x.id)}">
      ${thumb}
      <div class="info"><h3>${esc(x.name)}</h3><div class="meta">${esc(meta||x.type||'')}</div>
        ${tags.length?`<div class="tagline">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
        <div class="by">${esc(nameOf(x))}・${fmtDate(x.createdAt)}</div></div>
      <div class="score"><b>${x.score??'–'}</b><i>${x.score?esc(scoreWord(x.score)):''}</i></div>
    </button>`;
  }).join('');
}

/* ---------- 詳細 ---------- */
function openDetail(id){
  const x=reviews.find(r=>r.id===id); if(!x) return;
  const col=colorOf(x.color);
  const mine = x.author && x.author===myId;
  const facts=[['種類',x.type],['産地',x.region],['熟成',x.age?x.age+'年':''],['度数',x.abv?x.abv+'%':''],['樽',x.cask],['飲み方',x.serve]].filter(f=>f[1]);
  const hasProfile = AXES.some(a=>x.profile?.[a[0]]>0);
  const phase = k => { const p=x[k]||{}; const P=PHASES.find(q=>q[0]===k);
    if(!(p.tags?.length||p.note||(k==='finish'&&x.finishLength))) return '';
    return `<section class="note"><h3>${P[1]}<small>${P[2]}</small>${k==='finish'&&x.finishLength?`<small>余韻 ${esc(x.finishLength)}</small>`:''}</h3>
      ${p.tags?.length?`<div class="chips">${p.tags.map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div>`:''}
      ${p.note?`<p>${esc(p.note)}</p>`:''}</section>`; };
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(x.name)}">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 一覧</button><h2></h2>${mine?`<button class="btn" data-act="edit">編集</button>`:'<span style="width:60px"></span>'}</div>
    <div class="sheet-body">
      ${x.photo?`<div class="hero"><img src="${esc(photoUrl(x.photo))}" alt="${esc(x.name)}のボトル写真"></div>`:''}
      <div class="d-head"><div><h1>${esc(x.name)}</h1><div class="meta">${esc(x.distillery||'')}</div></div>
        <div class="d-score"><b>${x.score??'–'}</b><div>${x.score?esc(scoreWord(x.score))+' / 100':''}</div></div></div>
      ${facts.length?`<dl class="facts">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>`:''}
      ${col?`<div class="colorline"><i style="background:${col[2]}"></i>色：${col[1]}</div>`:''}
      ${hasProfile?`<div class="radar-wrap">${radarSVG(x.profile)}</div>`:''}
      ${PHASES.map(p=>phase(p[0])).join('')}
      ${x.comment?`<section class="note"><h3>ひとこと<small>VERDICT</small></h3><p>${esc(x.comment)}</p></section>`:''}
      <div class="d-foot"><span>${esc(nameOf(x))}・${fmtDate(x.createdAt)}${x.updatedAt-x.createdAt>60000?'（編集済み）':''}</span>
        ${mine?`<span class="confirm" id="delbox"><button class="btn danger" data-act="askdel">削除</button></span>`:''}</div>
    </div></div>`);
  $('#sheet-root').onclick=async e=>{
    const a=e.target.closest('[data-act]')?.dataset.act; if(!a) return;
    if(a==='close') unmount();
    if(a==='edit') openForm(x);
    if(a==='askdel') $('#delbox').innerHTML=`<span>本当に削除しますか？</span><button class="btn" data-act="nodel">やめる</button><button class="btn danger" data-act="del">削除する</button>`;
    if(a==='nodel') $('#delbox').innerHTML=`<button class="btn danger" data-act="askdel">削除</button>`;
    if(a==='del'){
      const { error } = await sb.from('reviews').delete().eq('id',x.id);
      if(error){ toast('削除できませんでした：'+error.message); return; }
      if(x.photo) sb.storage.from('photos').remove([x.photo]).catch(()=>{});
      reviews=reviews.filter(r=>r.id!==x.id); unmount(); renderList(); toast('削除しました');
    }
  };
}

/* ---------- 入力フォーム ---------- */
function blank(){ return {name:'',distillery:'',type:'シングルモルト',region:'',age:'',abv:'',cask:'',serve:'ストレート',color:'',
  nose:{tags:[],note:''},palate:{tags:[],note:''},finish:{tags:[],note:''},finishLength:'',profile:Object.fromEntries(AXES.map(a=>[a[0],0])),score:85,comment:'',photo:''}; }

function openForm(existing){
  const f = existing ? JSON.parse(JSON.stringify(existing)) : blank();
  ['nose','palate','finish'].forEach(k=>{ f[k]=f[k]||{tags:[],note:''}; f[k].tags=f[k].tags||[]; });
  f.profile = Object.assign(Object.fromEntries(AXES.map(a=>[a[0],0])), f.profile||{});
  let phase='nose', newPhoto=null, previewUrl=f.photo?photoUrl(f.photo):'', saving=false;
  const oldPhoto = f.photo || '';
  const opt=(list,v)=>`<option value="">—</option>`+list.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  const nick = existing?.authorName || store.get('kohaku.nickname') || '';

  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="テイスティングを記録">
    <div class="sheet-bar"><button class="btn ghost" data-act="cancel">キャンセル</button><h2>${existing?'記録を編集':'新しい記録'}</h2><button class="btn primary" data-act="save" id="savebtn">保存</button></div>
    <form class="sheet-body" id="form" novalidate>
      <fieldset><legend>ボトル</legend>
        <div class="field"><label class="lbl" for="f-name">銘柄名（必須）</label><input id="f-name" required value="${esc(f.name)}" placeholder="例：ラガヴーリン 16年" autocomplete="off"></div>
        <div class="field"><label class="lbl" for="f-dist">蒸留所・ブランド</label><input id="f-dist" value="${esc(f.distillery)}" placeholder="例：ラガヴーリン蒸留所" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label class="lbl" for="f-type">種類</label><select id="f-type">${opt(TYPES,f.type)}</select></div>
          <div class="field"><label class="lbl" for="f-region">産地</label><select id="f-region">${opt(REGIONS,f.region)}</select></div>
        </div>
        <div class="row3">
          <div class="field"><label class="lbl" for="f-age">熟成年数</label><input id="f-age" inputmode="numeric" value="${esc(f.age)}" placeholder="NAS"></div>
          <div class="field"><label class="lbl" for="f-abv">度数 %</label><input id="f-abv" inputmode="decimal" value="${esc(f.abv)}" placeholder="43"></div>
          <div class="field"><label class="lbl" for="f-cask">樽</label><input id="f-cask" value="${esc(f.cask)}" placeholder="シェリー樽"></div>
        </div>
        <div><span class="lbl">飲み方</span><div class="chips">${SERVES.map(s=>`<button type="button" class="chip" data-serve="${s}" aria-pressed="${f.serve===s}">${s}</button>`).join('')}</div></div>
      </fieldset>

      <fieldset><legend>写真</legend>
        <label class="photo-drop" id="pdrop">${previewUrl?`<img src="${esc(previewUrl)}" alt="">`:`<span>タップしてボトルを撮影<br>またはライブラリから選択</span>`}
          <input type="file" id="f-photo" accept="image/*" aria-label="写真を選ぶ"></label>
        <button type="button" class="btn ghost" data-act="rmphoto" id="rmphoto" ${previewUrl?'':'hidden'}>写真を外す</button>
      </fieldset>

      <fieldset><legend>色</legend>
        <div class="swatches">${COLORS.map(c=>`<button type="button" class="sw" data-color="${c[0]}" aria-pressed="${f.color===c[0]}"><i style="background:${c[2]}"></i>${c[1]}</button>`).join('')}</div>
      </fieldset>

      <fieldset><legend>香りと味</legend>
        <div class="phase" id="phase"></div>
        <div id="tagpanel"></div>
      </fieldset>

      <fieldset><legend>フレーバープロファイル</legend>
        <div class="radar-wrap" id="radar">${radarSVG(f.profile)}</div>
        <div class="sliders">${AXES.map(a=>`<label class="sl"><span>${a[1]}</span><input type="range" min="0" max="5" step="1" id="p-${a[0]}" data-axis="${a[0]}" value="${f.profile[a[0]]}"><output id="o-${a[0]}">${f.profile[a[0]]}</output></label>`).join('')}</div>
      </fieldset>

      <fieldset><legend>評価</legend>
        <div class="scorebox"><output id="o-score">${f.score}</output>
          <div><input type="range" id="f-score" min="50" max="100" step="1" value="${f.score}" aria-label="総合評価"><div class="word" id="w-score">${scoreWord(f.score)}</div></div></div>
        <div class="field"><label class="lbl" for="f-comment">ひとこと</label><textarea id="f-comment" placeholder="例：潮とスモークの奥に熟したドライフルーツ。寝る前の一杯に。">${esc(f.comment)}</textarea></div>
        <div class="field"><label class="lbl" for="f-nick">記録者の名前（一覧に表示されます）</label><input id="f-nick" value="${esc(nick)}" placeholder="例：南雲" autocomplete="nickname"></div>
        <div class="err" id="err" hidden></div>
      </fieldset>
    </form></div>`);

  const drawPhase=()=>{
    $('#phase').innerHTML = PHASES.map(p=>`<button type="button" data-phase="${p[0]}" aria-pressed="${phase===p[0]}">${p[1]}${f[p[0]].tags.length?`<em>${f[p[0]].tags.length}</em>`:''}</button>`).join('');
    const cur=f[phase]; const known=new Set(TAGS.flatMap(g=>g[1])); const custom=cur.tags.filter(t=>!known.has(t));
    $('#tagpanel').innerHTML =
      TAGS.map(g=>`<div class="group-name">${g[0]}</div><div class="chips">${g[1].map(t=>`<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${cur.tags.includes(t)}">${esc(t)}</button>`).join('')}</div>`).join('')
      + (custom.length?`<div class="group-name">追加したもの</div><div class="chips">${custom.map(t=>`<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="true">${esc(t)} ×</button>`).join('')}</div>`:'')
      + `<div class="group-name">ほかの表現</div><div class="addtag field"><input id="newtag" placeholder="例：線香、カスタード"><button type="button" class="btn" data-act="addtag">追加</button></div>`
      + (phase==='finish'?`<div><span class="lbl" style="margin-top:12px">余韻の長さ</span><div class="chips">${FINLEN.map(l=>`<button type="button" class="chip" data-len="${l}" aria-pressed="${f.finishLength===l}">${l}</button>`).join('')}</div></div>`:'')
      + `<div class="field" style="margin-top:12px"><label class="lbl" for="f-note">${PHASES.find(p=>p[0]===phase)[1]}のメモ</label><textarea id="f-note">${esc(cur.note)}</textarea></div>`;
  };
  drawPhase();

  const root=$('#sheet-root');
  const setPreview = url => { $('#pdrop').querySelector('img,span').outerHTML = url ? `<img src="${esc(url)}" alt="">` : `<span>タップしてボトルを撮影<br>またはライブラリから選択</span>`; $('#rmphoto').hidden=!url; };
  root.oninput=e=>{
    const t=e.target;
    if(t.dataset.axis){ f.profile[t.dataset.axis]=+t.value; $('#o-'+t.dataset.axis).textContent=t.value; $('#radar').innerHTML=radarSVG(f.profile); }
    if(t.id==='f-score'){ f.score=+t.value; $('#o-score').textContent=t.value; $('#w-score').textContent=scoreWord(+t.value); }
    if(t.id==='f-note') f[phase].note=t.value;
  };
  root.onchange=async e=>{
    if(e.target.id!=='f-photo') return;
    const file=e.target.files?.[0]; if(!file) return;
    try{ newPhoto=await shrink(file); previewUrl=URL.createObjectURL(newPhoto); setPreview(previewUrl); }
    catch(err){ toast('この画像は読み込めませんでした'); }
  };
  const addTag=()=>{ const v=$('#newtag').value.trim(); if(v&&!f[phase].tags.includes(v)) f[phase].tags.push(v); drawPhase(); $('#newtag')?.focus(); };
  root.onkeydown=e=>{ if(e.target.id==='newtag'&&e.key==='Enter'){ e.preventDefault(); addTag(); } };
  root.onclick=async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.phase){ phase=b.dataset.phase; drawPhase(); return; }
    if(b.dataset.tag){ const arr=f[phase].tags, i=arr.indexOf(b.dataset.tag); i<0?arr.push(b.dataset.tag):arr.splice(i,1); drawPhase(); return; }
    if(b.dataset.len){ f.finishLength = f.finishLength===b.dataset.len?'':b.dataset.len; drawPhase(); return; }
    if(b.dataset.serve){ f.serve = f.serve===b.dataset.serve?'':b.dataset.serve; root.querySelectorAll('[data-serve]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.serve===f.serve)); return; }
    if(b.dataset.color){ f.color = f.color===b.dataset.color?'':b.dataset.color; root.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.color===f.color)); return; }
    const a=b.dataset.act;
    if(a==='addtag') addTag();
    if(a==='rmphoto'){ f.photo=''; newPhoto=null; previewUrl=''; setPreview(''); }
    if(a==='cancel') existing ? openDetail(existing.id) : unmount();
    if(a==='save' && !saving) save();
  };

  async function save(){
    f.name=$('#f-name').value.trim(); f.distillery=$('#f-dist').value.trim(); f.type=$('#f-type').value; f.region=$('#f-region').value;
    f.age=$('#f-age').value.trim(); f.abv=$('#f-abv').value.trim(); f.cask=$('#f-cask').value.trim(); f.comment=$('#f-comment').value.trim();
    const nickname=$('#f-nick').value.trim();
    const err=$('#err');
    if(!f.name){ err.textContent='銘柄名を入力してください。'; err.hidden=false; $('#f-name').focus(); return; }
    if(!myId){ err.textContent='ログインできていないため保存できません。通信状態を確認してアプリを開き直してください。'; err.hidden=false; return; }
    saving=true; const btn=$('#savebtn'); btn.disabled=true; btn.textContent='保存中…'; err.hidden=true;
    try{
      if(newPhoto){
        const path = `${myId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const up = await sb.storage.from('photos').upload(path, newPhoto, { contentType:'image/jpeg', cacheControl:'31536000' });
        if(up.error) throw new Error('写真のアップロードに失敗しました（'+up.error.message+'）');
        f.photo = path;
      }
      if(nickname) store.set('kohaku.nickname', nickname);
      const data={name:f.name,distillery:f.distillery,type:f.type,region:f.region,age:f.age,abv:f.abv,cask:f.cask,serve:f.serve,color:f.color,
        nose:f.nose,palate:f.palate,finish:f.finish,finishLength:f.finishLength,profile:f.profile,score:f.score,comment:f.comment,photo:f.photo||''};
      const row={ data, score:f.score, author_name:nickname || null };
      let res;
      if(existing) res = await sb.from('reviews').update({ ...row, updated_at:new Date().toISOString() }).eq('id',existing.id).select().single();
      else res = await sb.from('reviews').insert(row).select().single();
      if(res.error) throw new Error(res.error.message);
      if(oldPhoto && oldPhoto!==f.photo) sb.storage.from('photos').remove([oldPhoto]).catch(()=>{});
      const saved = rowToReview(res.data);
      reviews = [saved, ...reviews.filter(r=>r.id!==saved.id)];
      renderList(); openDetail(saved.id); toast(existing?'更新しました':'記録しました');
    }catch(x){
      saving=false; btn.disabled=false; btn.textContent='保存';
      err.textContent = (x?.message||'保存できませんでした。') + ' 通信状態を確認して、もう一度保存してください。';
      err.hidden=false;
    }
  }
}

/* 写真を長辺1600pxのJPEGに縮小 */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, 1600/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(), 'image/jpeg', .85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

/* ---------- メニュー（インストール案内など） ---------- */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function openMenu(){
  let install;
  if(isStandalone()) install = `<p>ホーム画面のアプリとして開いています。</p>`;
  else if(installEvt) install = `<p>このスマホにアプリとして追加できます。</p><div><button class="btn primary" data-act="install">ホーム画面に追加</button></div>`;
  else if(isIOS()) install = `<p>iPhone・iPad では Safari で開き、次の手順で追加します。</p><ol class="steps"><li>画面下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」を選ぶ</li><li>右上の「追加」をタップ</li></ol>`;
  else install = `<p>Chrome のメニュー（︙）から「ホーム画面に追加」または「アプリをインストール」を選びます。</p>`;
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="メニュー">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 戻る</button><h2>メニュー</h2><span style="width:60px"></span></div>
    <div class="sheet-body menu-list">
      <section><h3>アプリとして使う</h3>${install}</section>
      <section><h3>記録者の名前</h3><div class="addtag field"><input id="m-nick" value="${esc(store.get('kohaku.nickname')||'')}" placeholder="例：南雲"><button class="btn" data-act="nick">保存</button></div>
        <p class="small" style="margin-top:6px">これから保存する記録に表示されます。</p></section>
      <section><h3>この端末について</h3><p class="small">自分の記録を編集・削除できるのは、記録したのと同じ端末・同じアプリからだけです。iPhone では Safari とホーム画面のアプリが別扱いになるため、先にホーム画面に追加してから記録してください。</p></section>
      <p class="small">琥珀帳 バージョン ${APP_VERSION}</p>
    </div></div>`);
  $('#sheet-root').onclick=async e=>{
    const a=e.target.closest('[data-act]')?.dataset.act;
    if(a==='close') unmount();
    if(a==='nick'){ store.set('kohaku.nickname',$('#m-nick').value.trim()); toast('名前を保存しました'); }
    if(a==='install' && installEvt){ installEvt.prompt(); const r=await installEvt.userChoice; installEvt=null; if(r.outcome==='accepted') toast('ホーム画面に追加しました'); unmount(); }
  };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });

let lastFocus=null;
function mount(html){ if(!$('#sheet-root').children.length) lastFocus=document.activeElement; $('#sheet-root').innerHTML=html; document.body.style.overflow='hidden'; $('#sheet-root .sheet').scrollTop=0; }
function unmount(){ const r=$('#sheet-root'); r.innerHTML=''; r.onclick=r.oninput=r.onchange=r.onkeydown=null; document.body.style.overflow=''; lastFocus?.focus?.({preventScroll:true}); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#sheet-root').children.length) unmount(); });

$('#list').addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c) openDetail(c.dataset.id); });
$('#q').addEventListener('input',e=>{ query=e.target.value.trim(); renderList(); });
const seg=(a,b,set)=>{ $(a).onclick=()=>{set(0);$(a).setAttribute('aria-pressed','true');$(b).setAttribute('aria-pressed','false');renderList();};
  $(b).onclick=()=>{set(1);$(b).setAttribute('aria-pressed','true');$(a).setAttribute('aria-pressed','false');renderList();}; };
seg('#f-all','#f-mine',v=>filter=v?'mine':'all');
seg('#s-new','#s-score',v=>sort=v?'score':'new');
$('#add').onclick=()=>openForm(null);
$('#menu').onclick=openMenu;

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
boot();
})();
