/* ---------- 図 ---------- */
function radarSVG({ avg=null, others=[], mine=null, single=null }, size=280){
  const c=size/2, R=size/2-56, n=AXES.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [c+Math.cos(a)*R*v/5, c+Math.sin(a)*R*v/5]; };
  const poly = p => AXES.map((a,i)=>pt(i,+(p?.[a[0]]||0)).join(',')).join(' ');
  let g='';
  for(let r=1;r<=5;r++) g+=`<polygon points="${AXES.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${r===5?1.2:.8}"/>`;
  AXES.forEach((a,i)=>{ const [x,y]=pt(i,5); g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".8"/>`;
    const [lx,ly]=pt(i,6.3); g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="var(--muted)" font-family="var(--body)">${a[1]}</text>`; });
  others.forEach(p=>{ g+=`<polygon points="${poly(p)}" fill="none" stroke="var(--muted)" stroke-opacity=".45" stroke-width="1"/>`; });
  const main = avg || single;
  if(main){ g+=`<polygon points="${poly(main)}" fill="var(--amber)" fill-opacity=".26" stroke="var(--amber)" stroke-width="2.2" stroke-linejoin="round"/>`;
    AXES.forEach((a,i)=>{ const v=+(main[a[0]]||0); if(v>0){ const [x,y]=pt(i,v); g+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--amber)"/>`; }}); }
  if(mine) g+=`<polygon points="${poly(mine)}" fill="none" stroke="var(--peat)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>`;
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="フレーバープロファイル">${g}</svg>`;
}
function scoreStrip(a){
  const W=320,H=58,L=14,Rt=W-14, x=s=>L+(Math.max(50,Math.min(100,s))-50)/50*(Rt-L);
  let g=`<line x1="${L}" y1="26" x2="${Rt}" y2="26" stroke="var(--line)" stroke-width="2"/>`;
  [50,60,70,80,90,100].forEach(v=>{ g+=`<line x1="${x(v)}" y1="21" x2="${x(v)}" y2="31" stroke="var(--line)"/><text x="${x(v)}" y="50" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">${v}</text>`; });
  if(a.min!=null && a.max>a.min) g+=`<rect x="${x(a.min)}" y="22" width="${x(a.max)-x(a.min)}" height="8" rx="4" fill="var(--amber)" fill-opacity=".18"/>`;
  const seen={};
  a.list.forEach(t=>{ if(typeof t.score!=='number') return; const k=t.score; seen[k]=(seen[k]||0)+1; const dy=(seen[k]-1)*-7;
    g+=`<circle cx="${x(t.score)}" cy="${26+dy}" r="5" fill="${t.author===myId?'var(--peat)':'var(--surface)'}" stroke="${t.author===myId?'var(--peat)':'var(--amber)'}" stroke-width="2"/>`; });
  if(a.avg!=null) g+=`<line x1="${x(a.avg)}" y1="8" x2="${x(a.avg)}" y2="36" stroke="var(--amber)" stroke-width="2"/><text x="${x(a.avg)}" y="6" text-anchor="middle" font-size="10" fill="var(--amber)" font-family="var(--mono)" dominant-baseline="hanging" dy="-6">avg</text>`;
  return `<svg class="strip" viewBox="0 -4 ${W} ${H+4}" role="img" aria-label="各記録の点数の分布">${g}</svg>`;
}
const agreementLabel = a => {
  if(a.people<2 || a.profSd==null) return '';
  return a.profSd<0.8 ? '感じ方がよく一致' : a.profSd<1.4 ? '感じ方はおおむね一致' : '感じ方が分かれている';
};

/* ---------- 一覧 ---------- */
function bottleMatches(b, a, q){
  if(!q) return true;
  const hay = norm([b.name,b.distillery,b.region,b.type,b.cask,...a.allTags.keys(),...a.list.map(t=>t.authorName)].join(' '));
  return hay.includes(norm(q));
}
function renderList(){
  const list=$('#list');
  $('#count').textContent = loaded && !setupError ? `${bottles.length}銘柄・${tastings.length}件` : '';
  if(setupError==='config'){ list.innerHTML=`<div class="empty"><h2>初期設定が必要です</h2></div><div class="notice"><code>config.js</code> に Supabase の URL とキーを書き込んでアップロードしてください。</div>`; return; }
  if(setupError){
    const needsMigration = /bottles|bottle_id/.test(setupError);
    list.innerHTML = `<div class="empty"><h2>${needsMigration?'データベースの更新が必要です':'記録を読み込めませんでした'}</h2></div><div class="notice">${needsMigration?'Supabase の SQL Editor で <code>update-2-bottles.sql</code> を実行してください。':'通信状態を確認して開き直してください。'}<br><span class="small">詳細：${esc(setupError)}</span></div>`;
    return;
  }
  if(!loaded) return;
  $('#sortbar').hidden = view!=='bottles';
  $('#toolbar').hidden = view==='zukan' || view==='mine';
  if(view==='mine') return renderMine(list);
  if(view==='zukan'){ $('#count').textContent=`${ZE.length}銘柄`; return renderZukan(list); }
  return view==='bottles' ? renderBottles(list) : renderFeed(list);
}
function renderBottles(list){
  let rows = bottles.map(b=>({b,a:aggs.get(b.id)}));
  if(filter==='mine') rows = rows.filter(r=>r.a.mine.length);
  rows = rows.filter(r=>bottleMatches(r.b,r.a,query));
  const key = { recent:r=>r.a.lastAt||r.b.createdAt, score:r=>r.a.avg??-1, count:r=>r.a.people*1000+r.a.n }[sort];
  rows.sort((x,y)=>key(y)-key(x));
  if(!bottles.length){ list.innerHTML=`<div class="empty"><h2>${esc(K.jp)}はまだ一本もありません</h2><p>右下の「テイスティング」から、最初のボトルを登録しましょう。<br>同じ銘柄に何人もの記録が集まるほど、その一本の姿がはっきりしていきます。</p></div>`; return; }
  if(!rows.length){ list.innerHTML=`<div class="empty"><h2>該当する銘柄がありません</h2><p>検索語や表示の切り替えを変えてみてください。</p></div>`; return; }
  list.innerHTML = rows.map(({b,a})=>{
    const tags = topTags(a,3);
    const top = Object.entries(a.colors).sort((x,y)=>y[1]-x[1])[0]; const col = top && colorOf(top[0]);
    const thumb = b.photo ? `<img class="thumb" src="${esc(photoUrl(b.photo))}" alt="" loading="lazy">` : `<div class="thumb"><div class="glass" style="background:${col?col[2]:'var(--line)'}"></div></div>`;
    const meta=[b.distillery,ageText(b.age),b.abv?b.abv+'%':'',b.price?b.price.toLocaleString('ja-JP')+'円':''].filter(Boolean).join(' · ');
    return `<button class="card" data-bottle="${esc(b.id)}">${thumb}
      <div class="info"><h3>${esc(b.name)}</h3><div class="meta">${esc(meta||b.type||b.region||'')}</div>
        ${tags.length?`<div class="tagline">${tags.map(([t,s])=>`<span>${esc(t)}${a.people>1?`<b>${s.size}</b>`:''}</span>`).join('')}</div>`:''}
        <div class="people">${a.people?`${a.people}人・${a.n}件の記録`:'記録はまだありません'}${a.mine.length?'<span class="mine-dot">記録済み</span>':''}</div></div>
      <div class="score"><b>${a.avg==null?'–':a.n>1?fmt1(a.avg):a.avg}</b><i>${a.n>1?'平均':a.n?'1件のみ':''}</i></div></button>`;
  }).join('');
}
function renderFeed(list){
  let rows = tastings.slice();
  if(filter==='mine') rows = rows.filter(t=>t.author===myId);
  if(query){ const q=norm(query); rows = rows.filter(t=>{ const b=bottles.find(x=>x.id===t.bottleId); return norm([b?.name,b?.distillery,t.authorName,t.comment,...PHASES.flatMap(([k])=>t[k]?.tags||[])].join(' ')).includes(q); }); }
  rows.sort((a,b)=>b.createdAt-a.createdAt);
  if(!rows.length){ list.innerHTML=`<div class="empty"><h2>記録がありません</h2></div>`; return; }
  list.innerHTML = rows.slice(0,200).map(t=>{
    const b=bottles.find(x=>x.id===t.bottleId); if(!b) return '';
    const tags=[...(t.nose?.tags||[]),...(t.palate?.tags||[])].filter((x,i,arr)=>arr.indexOf(x)===i).slice(0,4);
    return `<button class="card feed-card" data-bottle="${esc(b.id)}">
      <div class="info"><h3>${esc(b.name)}</h3><div class="by">${esc(nameOf(t))}・${fmtDate(t.createdAt)}${t.day?'・開栓'+t.day+'日目':''}${t.serve?'・'+esc(t.serve):''}</div>
        ${tags.length?`<div class="tagline">${tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
        ${t.comment?`<div class="meta" style="margin-top:6px">${esc(t.comment.length>60?t.comment.slice(0,60)+'…':t.comment)}</div>`:''}
        ${(likesBy.get(t.id)?.size||commentsBy.get(t.id)?.length)?`<div class="feed-soc">${likesBy.get(t.id)?.size?`${ICON_HEART(likesBy.get(t.id).has(myId))}<span>${likesBy.get(t.id).size}</span>`:''}${commentsBy.get(t.id)?.length?`${ICON_BUBBLE}<span>${commentsBy.get(t.id).length}</span>`:''}</div>`:''}</div>
      <div class="score"><b>${t.score??'–'}</b><i>${t.score?esc(scoreWord(t.score)):''}</i></div></button>`;
  }).join('');
}
const nameOf = t => t.author && t.author===myId ? 'あなた' : (displayNameOf(t.author) || t.authorName || 'メンバー');

/* ---------- 銘柄ページ ---------- */
function openBottle(id, keepScroll){
  curSheet={t:'bottle',id};
  const b=bottles.find(x=>x.id===id); if(!b){ unmount(); return; }
  currentBottle=id;
  const a=aggs.get(id) || aggregate(id);
  const prevScroll = keepScroll ? $('#sheet-root .sheet')?.scrollTop : 0;
  const zp = !b.price && zukanFor(b)?.price ? '約'+priceBand(zukanFor(b).price)+'（図鑑）' : '';
  const facts=[['価格', b.price ? b.price.toLocaleString('ja-JP')+'円' : zp],[L.typeLbl,b.type],['産地',b.region],[L.age,ageText(b.age)],['度数',b.abv?b.abv+'%':''],[L.cask,b.cask],[L.maker,b.distillery]].filter(f=>f[1]);
  const myLatest = a.mine[0];
  const myProfile = myLatest?.profile && AXES.some(x=>myLatest.profile[x[0]]>0) ? myLatest.profile : null;
  const others = a.people>1 ? a.profs : [];
  const label = agreementLabel(a);

  const tagSection = PHASES.map(([k,jp,en])=>{
    const entries=[...a.tagPeople[k].entries()].sort((x,y)=>y[1].size-x[1].size).slice(0,10);
    if(!entries.length) return '';
    return `<div><div class="group-name">${jp}</div><div class="bars">${entries.map(([tag,set])=>{
      const mine=set.has(myId); const pct=Math.round(set.size/Math.max(1,a.people)*100);
      return `<div class="bar"><span>${esc(tag)}</span><div class="track"><div class="fill${mine?' mine':''}" style="width:${pct}%"></div></div><em>${set.size}/${a.people}人</em></div>`; }).join('')}</div></div>`;
  }).join('');

  const colorVotes = Object.keys(a.colors).length ? `<section class="sec"><h3>色<small>COLOUR</small></h3><div class="swatches">${COLORS.map(c=>{ const v=a.colors[c[0]]||0; return `<div class="sw vote${v?'':' zero'}"><i style="background:${c[2]}"></i>${c[1]}${v?`<b>${v}</b>`:''}</div>`; }).join('')}</div></section>` : '';
  const finVotes = Object.keys(a.finLen).length ? `<p class="small" style="margin-top:10px">余韻の長さ：${FINLEN.filter(l=>a.finLen[l]).map(l=>`${l} ${a.finLen[l]}件`).join('・')}</p>` : '';

  const tastingCards = a.list.map(t=>{
    const me=t.author===myId;
    const phases=PHASES.map(([k,jp])=>{ const p=t[k]||{}; if(!(p.tags?.length||p.note)) return '';
      return `<div class="t-phase"><b>${jp}</b>${esc((p.tags||[]).join('・'))}${p.note?`<div class="t-note">${esc(p.note)}</div>`:''}</div>`; }).join('');
    return `<article class="tasting${me?' me':''}">
      <div class="t-head"><strong>${esc(nameOf(t))}${t.day?`<span class="dbadge">開栓${t.day}日目</span>`:''}</strong><span class="small">${fmtDate(t.createdAt)}${t.serve?'・'+esc(t.serve):''}${t.finishLength?'・余韻 '+esc(t.finishLength):''}</span><span class="s">${t.score??'–'}</span></div>
      ${phases}
      ${t.comment?`<div class="t-note">${esc(t.comment)}</div>`:''}
      ${me?`<div class="t-actions" data-tid="${esc(t.id)}"><button class="btn small" data-act="edit-t">編集</button><button class="btn small danger" data-act="askdel-t">削除</button></div>`:''}
      ${socialRow(t)}
    </article>`;
  }).join('');

  const canDeleteBottle = b.createdBy===myId && a.n===0;

  mount(`<div class="sheet" data-view="bottle" role="dialog" aria-modal="true" aria-label="${esc(b.name)}">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 一覧</button><h2>${esc(b.name)}</h2>${myId?`<button class="btn" data-act="edit-b">情報を編集</button>`:'<span style="width:60px"></span>'}</div>
    <div class="sheet-body">
      ${b.photo?`<div class="hero"><img src="${esc(photoUrl(b.photo))}" alt="${esc(b.name)}のボトル写真"></div>`:''}
      <div class="d-head"><div><h1>${esc(b.name)}</h1><div class="meta">${esc(b.distillery||'')}</div></div>
        <div class="d-score"><b>${a.avg==null?'–':a.n>1?fmt1(a.avg):a.avg}</b><div>${a.n>1?'みんなの平均':a.n?'1件の記録':''}</div></div></div>
      ${facts.length?`<dl class="facts">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>`:''}
      ${myId && !a.mine.length?`<div>${wishBtn(wishKeyForBottle(b))}</div>`:''}

      ${a.n===0?`<div class="notice">まだ誰も記録していません。最初の一杯を記録しましょう。</div>`:''}
      ${a.n>0?`<section class="sec"><h3>みんなの評価<small>CONSENSUS</small>${label?`<span class="agree">${label}</span>`:''}</h3>
        <dl class="stat-row">
          <div class="stat"><dt>記録</dt><dd>${a.people}<small>人</small> ${a.n>a.people?`<small>(${a.n}件)</small>`:''}</dd></div>
          <div class="stat"><dt>点数の幅</dt><dd>${a.min===a.max?a.min:`${a.min}–${a.max}`}</dd></div>
          <div class="stat"><dt>ばらつき</dt><dd>${a.n>1?'±'+fmt1(a.sd):'–'}</dd></div>
        </dl>
        ${scoreStrip(a)}
        ${a.people<3?`<p class="small">${a.people===1?'まだ1人の記録です。':'まだ2人の記録です。'}記録が増えるほど、この銘柄の味わいがはっきりしてきます。</p>`:''}
      </section>`:''}

      ${a.avgProfile?`<section class="sec"><h3>フレーバープロファイル<small>PROFILE</small></h3><div class="radar-wrap">${radarSVG({avg:a.avgProfile, others, mine:myProfile})}
        <div class="legend"><span><i style="border-color:var(--amber)"></i>${a.profs.length>1?'みんなの平均':'記録'}</span>${others.length?`<span><i style="border-color:var(--muted)"></i>一人ひとり</span>`:''}${myProfile?`<span><i style="border-color:var(--peat);border-top-style:dashed"></i>あなた</span>`:''}</div></div></section>`:''}

      ${afterOpening(a)}
      ${tagSection?`<section class="sec"><h3>みんなが感じた香りと味<small>NOTES</small></h3><p class="small" style="margin:0 0 8px">何人が同じ表現を選んだか${myId&&a.mine.length?'（緑はあなたも選んだもの）':''}</p><div style="display:grid;gap:10px">${tagSection}</div>${finVotes}</section>`:''}
      ${colorVotes}

      ${a.n?`<section class="sec"><h3>一人ひとりの記録<small>TASTINGS</small></h3><div style="display:grid;gap:10px">${tastingCards}</div></section>`:''}
      ${zukanFor(b)?`<section class="sec"><h3>図鑑<small>GUIDE</small></h3><p class="small" style="margin:0 0 8px">この銘柄の一般的な情報と、似ている銘柄を見られます。</p><button class="btn" data-act="zukan">図鑑で見る</button></section>`:''}
      ${canDeleteBottle?`<div class="t-actions" id="delbottle"><button class="btn small danger" data-act="askdel-b">この銘柄を削除</button></div>`:''}
    </div>
    ${myId?`<div class="cta"><button class="btn primary" data-act="taste">${a.mine.length?'もう一度テイスティングを記録':'この銘柄をテイスティング'}</button></div>`:''}
  </div>`);
  if(prevScroll) $('#sheet-root .sheet').scrollTop=prevScroll;

  $('#sheet-root').onclick=async e=>{
    const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act;
    const tid=el.closest('[data-tid]')?.dataset.tid;
    if(act==='close') goBack();
    if(act==='taste') startTasting(b, false);
    if(act==='zukan'){ const z=zukanFor(b); if(z) openZukan(z.id); }
    if(act==='edit-b') openBottleForm(b, null, ()=>{ nav.replaceNext=true; openBottle(b.id); });
    if(act==='edit-t'){ const t=tastings.find(x=>x.id===tid); if(t) openTastingForm(b,t); }
    if(act==='askdel-t'){ el.parentElement.innerHTML=`<span>この記録を削除しますか？</span><button class="btn small" data-act="nodel-t">やめる</button><button class="btn small danger" data-act="del-t">削除する</button>`; }
    if(act==='nodel-t'){ el.parentElement.innerHTML=`<button class="btn small" data-act="edit-t">編集</button><button class="btn small danger" data-act="askdel-t">削除</button>`; }
    if(act==='del-t'){
      const { error } = await sb.from('reviews').delete().eq('id',tid);
      if(error){ toast('削除できませんでした：'+error.message); return; }
      allTastings=allTastings.filter(t=>t.id!==tid); refilter(); renderList(); openBottle(b.id,true); toast('記録を削除しました');
    }
    if(act==='askdel-b'){ $('#delbottle').innerHTML=`<span>銘柄を削除しますか？</span><button class="btn small" data-act="nodel-b">やめる</button><button class="btn small danger" data-act="del-b">削除する</button>`; }
    if(act==='nodel-b'){ $('#delbottle').innerHTML=`<button class="btn small danger" data-act="askdel-b">この銘柄を削除</button>`; }
    if(act==='del-b'){
      const { error } = await sb.from('bottles').delete().eq('id',b.id);
      if(error){ toast('削除できませんでした：'+error.message); return; }
      if(b.photo) sb.storage.from('photos').remove([b.photo]).catch(()=>{});
      allBottles=allBottles.filter(x=>x.id!==b.id); refilter(); currentBottle=null; renderList(); goBack(); toast('銘柄を削除しました');
    }
  };
}

/* ワイン：開栓後の変化（日ごとの点数・味わい・香りの違い） */
function afterOpening(a){
  if(!K.days || !a.list.some(t=>(t.day||1)>1)) return '';
  const g=new Map(); a.list.forEach(t=>{ const d=t.day||1; if(!g.has(d)) g.set(d,[]); g.get(d).push(t); });
  const days=[...g.keys()].sort((x,y)=>x-y), first=days[0], lastD=days[days.length-1];
  const avgOf=l=>{ const sc=l.map(t=>t.score).filter(x=>typeof x==='number'); return sc.length?sc.reduce((p,c)=>p+c,0)/sc.length:null; };
  const profOf=l=>{ const ps=l.map(t=>t.profile).filter(p=>p&&AXES.some(x=>p[x[0]]>0)); return ps.length?Object.fromEntries(AXES.map(([k])=>[k,ps.reduce((s,p)=>s+(+p[k]||0),0)/ps.length])):null; };
  const tagsOf=l=>new Set(l.flatMap(t=>PHASES.flatMap(([k])=>t[k]?.tags||[])));
  const base=avgOf(g.get(first));
  const rows=days.map(d=>{ const l=g.get(d), av=avgOf(l), diff=(d!==first&&av!=null&&base!=null)?av-base:null;
    return `<div class="bar"><span>開栓${d}日目</span><div class="track"><div class="fill${d===first?'':' mine'}" style="width:${av!=null?Math.max(4,(av-50)*2):0}%"></div></div><em>${av!=null?fmt1(av):'–'}${diff!=null?`<small class="${diff>=0?'up':'down'}"> ${diff>=0?'+':''}${fmt1(diff)}</small>`:''}</em></div>`; }).join('');
  const p1=profOf(g.get(first)), pN=profOf(g.get(lastD));
  const t1=tagsOf(g.get(first)), tN=tagsOf(g.get(lastD));
  const added=[...tN].filter(t=>!t1.has(t)), gone=[...t1].filter(t=>!tN.has(t));
  // あなたの直近のボトル（最後に1日目をつけたところから）
  const mine=a.list.filter(t=>t.author===myId).sort((x,y)=>x.createdAt-y.createdAt);
  let start=0; mine.forEach((t,i)=>{ if((t.day||1)===1) start=i; });
  const sess=mine.slice(start);
  const mySess = sess.length>1 ? `<p class="small" style="margin:10px 0 0">あなたの記録：${sess.map(t=>`${t.day||1}日目 <b style="font-family:var(--mono);color:var(--amber)">${t.score??'–'}</b>点`).join(' → ')}</p>` : '';
  return `<section class="sec"><h3>開栓後の変化<small>AFTER OPENING</small></h3>
    <p class="small" style="margin:0 0 8px">開けた日からの日数ごとの、みんなの平均点（${a.list.length}件）</p>
    <div class="bars dayb">${rows}</div>${mySess}
    ${p1&&pN?`<div class="radar-wrap" style="margin-top:10px">${radarSVG({ avg:p1, mine:pN })}
      <div class="legend"><span><i style="border-color:var(--amber)"></i>開栓${first}日目</span><span><i style="border-color:var(--peat);border-top-style:dashed"></i>開栓${lastD}日目</span></div></div>`:''}
    ${added.length?`<div class="group-name">開栓${lastD}日目に感じられた香り</div><div class="chips">${added.slice(0,8).map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div>`:''}
    ${gone.length?`<div class="group-name">開栓${first}日目だけの香り</div><div class="chips">${gone.slice(0,8).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
  </section>`;
}

/* ---------- 投稿の流れ：銘柄を選ぶ → （新しければ登録）→ テイスティング ---------- */
function openPicker(){
  curSheet={t:'picker'};
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄を選ぶ">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">キャンセル</button><h2>どの銘柄を飲みましたか？</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <div class="field"><label class="lbl" for="pk-q">${L.pickLbl}</label><input id="pk-q" placeholder="${L.pickPh}" autocomplete="off"></div>
      <p class="small" style="margin:-10px 0 0">図鑑の銘柄から選ぶと、同じ銘柄の記録がひとつにまとまります。</p>
      <div class="pick" id="pk-list"></div>
    </div></div>`);
  const draw=()=>{
    const q=$('#pk-q').value.trim(), nq=norm(q);
    let rows=bottles.map(b=>({b,a:aggs.get(b.id)}));
    if(nq) rows=rows.filter(({b})=>norm(b.name+b.distillery).includes(nq));
    rows.sort((x,y)=>(y.a.lastAt||y.b.createdAt)-(x.a.lastAt||x.b.createdAt));
    const exact = nq && (bottles.some(b=>norm(b.name)===nq) || ZE.some(z=>norm(z.name)===nq));
    const zs = nq ? ZE.filter(z=>!bottleForZ(z) && norm([z.name,z.en,z.distillery,z.label].join(' ')).includes(nq)).slice(0,30) : [];
    const head = t => `<div class="group-name pk-h">${t}</div>`;
    $('#pk-list').innerHTML =
      (rows.length ? head(q?'記録のある銘柄':'最近記録された銘柄') : '')
      + rows.slice(0, q?20:15).map(({b,a})=>`<button data-pick="${esc(b.id)}"><span><strong>${esc(b.name)}</strong><br><small>${esc([b.distillery,ageText(b.age)].filter(Boolean).join(' · ')||'—')}</small></span><small>${a.people}人${a.mine.length?'・記録済み':''}</small></button>`).join('')
      + (zs.length ? head('図鑑から選ぶ') + zs.map(z=>`<button data-pickz="${esc(z.id)}"><span><strong>${esc(z.name)}</strong><br><small>${esc([z.distillery, ZR[z.region]?.jp].filter(Boolean).join(' · '))}</small></span><small>図鑑</small></button>`).join('') : '')
      + (!q ? `<p class="small">名前を入力すると、図鑑の${ZE.length}銘柄からも探せます。</p>` : '')
      + (q && !exact ? `${head('見つからないとき')}<button class="new" data-act="new">＋「${esc(q)}」を新しい銘柄として登録</button>` : '');
  };
  draw();
  const root=$('#sheet-root');
  root.oninput=e=>{ if(e.target.id==='pk-q') draw(); };
  root.onclick=e=>{
    const el=e.target.closest('button'); if(!el) return;
    if(el.dataset.act==='close') goBack();
    if(el.dataset.pick){ const b=bottles.find(x=>x.id===el.dataset.pick); if(b) startTasting(b,true); }
    if(el.dataset.pickz){ const z=ZE.find(x=>x.id===el.dataset.pickz); if(z){ el.disabled=true; tasteZukan(z); } }
    if(el.dataset.act==='new') openBottleForm(null, $('#pk-q').value.trim(), b=>{ nav.replaceNext=true; openTastingForm(b,null,true); });
  };
  setTimeout(()=>$('#pk-q')?.focus(),50);
}

function openBottleForm(existing, prefill, onDone, onCancel){
  curSheet={t:'bform', id:existing?.id||null, prefill: prefill && typeof prefill==='object' ? prefill : (prefill||'')};
  const base = {name:'',distillery:'',type:K.defType,region:'',age:'',abv:'',cask:'',photo:''};
  const f = existing ? {...existing} : typeof prefill==='object' && prefill ? {...base, ...prefill} : {...base, name:prefill||''};
  let newPhoto=null, previewUrl=f.photo?photoUrl(f.photo):'', saving=false; const oldPhoto=f.photo||'';
  const opt=(list,v)=>`<option value="">—</option>`+list.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄の情報">
    <div class="sheet-bar"><button class="btn ghost" data-act="cancel">${existing?'キャンセル':'‹ 戻る'}</button><h2>${existing?'銘柄の情報を編集':'新しい銘柄を登録'}</h2><button class="btn primary" data-act="save" id="savebtn">${existing?'保存':'次へ'}</button></div>
    <form class="sheet-body" novalidate>
      ${existing?`<p class="hint">ボトル情報はみんなで共有しています。度数や${L.cask}の間違いに気づいたら、誰でも直せます。</p>`:''}
      <fieldset><legend>ボトル</legend>
        <div class="field"><label class="lbl" for="b-name">銘柄名（必須）</label><input id="b-name" value="${esc(f.name)}" placeholder="${L.namePh}" autocomplete="off"></div>
        <div class="field"><label class="lbl" for="b-dist">${L.makerForm}</label><input id="b-dist" value="${esc(f.distillery)}" placeholder="${L.makerPh}" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label class="lbl" for="b-type">${L.typeLbl}</label><select id="b-type">${opt(TYPES,f.type)}</select></div>
          <div class="field"><label class="lbl" for="b-region">産地</label><select id="b-region">${opt(REGIONS,f.region)}</select></div>
        </div>
        <div class="row3">
          <div class="field"><label class="lbl" for="b-age">${L.ageForm}</label><input id="b-age" inputmode="numeric" value="${esc(f.age)}" placeholder="${L.agePh}"></div>
          <div class="field"><label class="lbl" for="b-abv">度数 %</label><input id="b-abv" inputmode="decimal" value="${esc(f.abv)}" placeholder="${L.abvPh}"></div>
          <div class="field"><label class="lbl" for="b-cask">${L.cask}</label><input id="b-cask" value="${esc(f.cask)}" placeholder="${L.caskPh}"></div>
        </div>
        <div class="field"><label class="lbl" for="b-price">価格（円）</label><input id="b-price" inputmode="numeric" value="${f.price?esc(f.price):''}" placeholder="例：1980" autocomplete="off">
          <p class="small" style="margin:4px 0 0">買ったときのおおよその値段。図鑑の価格帯での絞り込みや比較に使われます。</p></div>
      </fieldset>
      <fieldset><legend>ボトルの写真</legend>
        <label class="photo-drop" id="pdrop">${previewUrl?`<img src="${esc(previewUrl)}" alt="">`:`<span>タップしてボトルを撮影<br>またはライブラリから選択</span>`}
          <input type="file" id="b-photo" accept="image/*" aria-label="写真を選ぶ"></label>
      </fieldset>
      <div class="err" id="err" hidden></div>
    </form></div>`);
  const root=$('#sheet-root');
  root.onchange=async e=>{
    if(e.target.id!=='b-photo') return; const file=e.target.files?.[0]; if(!file) return;
    try{ newPhoto=await shrink(file); previewUrl=URL.createObjectURL(newPhoto); $('#pdrop').querySelector('img,span').outerHTML=`<img src="${esc(previewUrl)}" alt="">`; }
    catch(err){ toast('この画像は読み込めませんでした'); }
  };
  root.onclick=async e=>{
    const el=e.target.closest('button'); if(!el) return;
    if(el.dataset.use){ const b=bottles.find(x=>x.id===el.dataset.use); if(b){ nav.replaceNext=true; openTastingForm(b,null,true); } return; }
    if(el.dataset.act==='cancel') return goBack();
    if(el.dataset.act!=='save' || saving) return;
    const err=$('#err');
    const data={ name:$('#b-name').value.trim(), distillery:$('#b-dist').value.trim(), type:$('#b-type').value, region:$('#b-region').value,
      age:$('#b-age').value.trim(), abv:$('#b-abv').value.trim(), cask:$('#b-cask').value.trim() };
    const pr=$('#b-price').value.normalize('NFKC').replace(/[^\d]/g,''); data.price = pr ? Math.min(99999999,+pr) : null;
    if(!data.name){ err.textContent='銘柄名を入力してください。'; err.hidden=false; $('#b-name').focus(); return; }
    const dup = bottles.find(b=>norm(b.name)===norm(data.name) && b.id!==existing?.id);
    if(dup){ err.innerHTML=`「${esc(dup.name)}」はすでに登録されています。<button type="button" class="btn small" data-use="${esc(dup.id)}">その銘柄で記録する</button>`; err.hidden=false; return; }
    saving=true; el.disabled=true; el.textContent='保存中…'; err.hidden=true;
    try{
      if(newPhoto){
        const path=`${myId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const up=await sb.storage.from('photos').upload(path,newPhoto,{contentType:'image/jpeg',cacheControl:'31536000'});
        if(up.error) throw new Error('写真のアップロードに失敗しました（'+up.error.message+'）');
        data.photo=path;
      }
      let res;
      if(existing) res=await saveBottleRow({...data, updated_at:new Date().toISOString()}, existing.id);
      else res=await saveBottleRow({...data, kind:KIND});
      if(res.error) throw new Error(res.error.code==='23505'?'同じ名前の銘柄がすでに登録されています。一覧を更新して選び直してください。':res.error.message);
      if(newPhoto && oldPhoto) sb.storage.from('photos').remove([oldPhoto]).catch(()=>{});
      const nb=rowToBottle(res.data);
      allBottles=[nb,...allBottles.filter(b=>b.id!==nb.id)]; refilter(); renderList();
      if(existing) toast('銘柄の情報を更新しました');
      onDone?.(nb);
    }catch(x){ saving=false; el.disabled=false; el.textContent=existing?'保存':'次へ'; err.textContent=x.message+' 通信状態を確認して、もう一度お試しください。'; err.hidden=false; }
  };
}

function blankTasting(){ return {serve:K.defServe,color:'',nose:{tags:[],note:''},palate:{tags:[],note:''},finish:{tags:[],note:''},finishLength:'',
  profile:Object.fromEntries(AXES.map(a=>[a[0],0])),score:85,comment:''}; }

/* ワイン：開栓後の日数 */
const dayDiff = (a,b) => { const d=x=>{ const t=new Date(x); return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); }; return Math.round((d(b)-d(a))/864e5); };
const myTastingsOf = bid => tastings.filter(t=>t.bottleId===bid && t.author===myId).sort((x,y)=>y.createdAt-x.createdAt);
function startTasting(b, fromPicker){
  if(!K.days || !myId || !myTastingsOf(b.id).length) return openTastingForm(b, null, fromPicker, 1);
  openDayPick(b, fromPicker);
}
function openDayPick(b, fromPicker){
  curSheet={t:'daypick', b:b.id, fp:!!fromPicker};
  const last=myTastingsOf(b.id)[0]; const lastDay=last.day||1;
  const gap=dayDiff(last.createdAt, Date.now()); const next=lastDay+Math.max(1,gap);
  const nextBtn=`<button class="dp${gap>0?' main':''}" data-day="${next}"><b>開栓${next}日目として記録する</b><span>${gap>0?`前回の記録から${gap}日後です。`:'同じボトルの続きとして記録します。'}開けてからの味の変化を残せます。</span></button>`;
  const editBtn=`<button class="dp${gap>0?'':' main'}" data-edit="${esc(last.id)}"><b>開栓${lastDay}日目の記録を編集する</b><span>追記や書き間違いの修正はこちら。</span></button>`;
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="どの記録をつけますか">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">${fromPicker?'‹ 戻る':'キャンセル'}</button><h2>${esc(b.name)}</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <div><h1 class="dp-title">開栓何日目の記録ですか？</h1>
        <p class="small" style="margin:6px 0 0">あなたの前回の記録：${fmtDate(last.createdAt)}・開栓${lastDay}日目・${last.score??'–'}点</p></div>
      <div class="daypick">${gap>0?nextBtn+editBtn:editBtn+nextBtn}
        <button class="dp" data-day="1"><b>新しいボトルを開けた</b><span>開栓1日目として、新しく記録します。</span></button></div>
      <p class="note-small">${esc(K.jp)}は開けたあと、空気に触れて香りや味わいが変わっていきます。日ごとに記録すると、銘柄のページで「開栓後の変化」として比べられます。</p>
    </div></div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-day],[data-edit]'); if(!el) return;
    if(el.dataset.act==='close') return goBack();
    if(el.dataset.day) return openTastingForm(b, null, true, +el.dataset.day);
    if(el.dataset.edit){ const t=tastings.find(x=>x.id===el.dataset.edit); if(t) openTastingForm(b, t, true); }
  };
}
function openTastingForm(bottle, existing, fromPicker, day){
  curSheet={t:'taste', b:bottle.id, tid:existing?.id||null, fp:!!fromPicker, day:day||null};
  const f = existing ? JSON.parse(JSON.stringify(existing)) : blankTasting();
  ['nose','palate','finish'].forEach(k=>{ f[k]=f[k]||{tags:[],note:''}; f[k].tags=f[k].tags||[]; });
  f.profile = Object.assign(Object.fromEntries(AXES.map(a=>[a[0],0])), f.profile||{});
  const isWine = !!K.days;
  f.day = existing ? (existing.day||1) : (day||1);
  let phase='nose', saving=false;
  const nick = existing?.authorName || myName() || '';

  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="テイスティングを記録">
    <div class="sheet-bar"><button class="btn ghost" data-act="cancel">${fromPicker&&!existing?'‹ 戻る':'キャンセル'}</button><h2>${esc(bottle.name)}</h2><button class="btn primary" data-act="save" id="savebtn">保存</button></div>
    <form class="sheet-body" novalidate>
      <p class="hint">ほかの人の記録は見ずに、自分が感じたままを残してください。感じ方の違いも、この銘柄の大切な情報になります。</p>
      ${isWine?`<fieldset><legend>開栓からの日数</legend>
        <div class="daystep"><button type="button" data-dstep="-1" aria-label="1日減らす">−</button><output id="o-day">開栓 <b>${f.day}</b> 日目</output><button type="button" data-dstep="1" aria-label="1日増やす">＋</button></div>
        <p class="small" style="margin:6px 0 0">ボトルを開けた日を1日目として数えます。</p></fieldset>`:''}
      <fieldset><legend>${L.serveLbl}</legend>
        <div class="chips">${SERVES.map(s=>`<button type="button" class="chip" data-serve="${s}" aria-pressed="${f.serve===s}">${s}</button>`).join('')}</div>
      </fieldset>
      <fieldset><legend>色</legend>
        <div class="swatches">${COLORS.map(c=>`<button type="button" class="sw" data-color="${c[0]}" aria-pressed="${f.color===c[0]}"><i style="background:${c[2]}"></i>${c[1]}</button>`).join('')}</div>
      </fieldset>
      <fieldset><legend>香りと味</legend>
        <div class="phase" id="phase"></div>
        <div id="tagpanel"></div>
      </fieldset>
      <fieldset><legend>フレーバープロファイル</legend>
        <div class="radar-wrap" id="radar">${radarSVG({single:f.profile})}</div>
        <div class="sliders">${AXES.map(a=>`<label class="sl"><span>${a[1]}</span><input type="range" min="0" max="5" step="1" id="p-${a[0]}" data-axis="${a[0]}" value="${f.profile[a[0]]}"><output id="o-${a[0]}">${f.profile[a[0]]}</output></label>`).join('')}</div>
      </fieldset>
      <fieldset><legend>評価</legend>
        <div class="scorebox"><output id="o-score">${f.score}</output>
          <div><input type="range" id="f-score" min="50" max="100" step="1" value="${f.score}" aria-label="総合評価"><div class="word" id="w-score">${scoreWord(f.score)}</div></div></div>
        <div class="field"><label class="lbl" for="f-comment">ひとこと</label><textarea id="f-comment" placeholder="${L.commentPh}">${esc(f.comment)}</textarea></div>
        <div class="field"><label class="lbl" for="f-nick">記録者の名前（みんなに表示されます）</label><input id="f-nick" value="${esc(nick)}" placeholder="例：南雲" autocomplete="nickname"></div>
        <div class="err" id="err" hidden></div>
      </fieldset>
    </form></div>`);

  const drawPhase=()=>{
    $('#phase').innerHTML = PHASES.map(p=>`<button type="button" data-phase="${p[0]}" aria-pressed="${phase===p[0]}">${p[1]}${f[p[0]].tags.length?`<em>${f[p[0]].tags.length}</em>`:''}</button>`).join('');
    const cur=f[phase]; const known=new Set(TAGS.flatMap(g=>g[1])); const custom=cur.tags.filter(t=>!known.has(t));
    $('#tagpanel').innerHTML =
      TAGS.map(g=>`<div class="group-name">${g[0]}</div><div class="chips">${g[1].map(t=>`<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${cur.tags.includes(t)}">${esc(t)}</button>`).join('')}</div>`).join('')
      + (custom.length?`<div class="group-name">追加したもの</div><div class="chips">${custom.map(t=>`<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="true">${esc(t)} ×</button>`).join('')}</div>`:'')
      + `<div class="group-name">ほかの表現</div><div class="addtag field"><input id="newtag" placeholder="${L.tagPh}"><button type="button" class="btn" data-act="addtag">追加</button></div>`
      + (phase==='finish'?`<div><span class="lbl" style="margin-top:12px">余韻の長さ</span><div class="chips">${FINLEN.map(l=>`<button type="button" class="chip" data-len="${l}" aria-pressed="${f.finishLength===l}">${l}</button>`).join('')}</div></div>`:'')
      + `<div class="field" style="margin-top:12px"><label class="lbl" for="f-note">${PHASES.find(p=>p[0]===phase)[1]}のメモ</label><textarea id="f-note">${esc(cur.note)}</textarea></div>`;
  };
  drawPhase();

  const root=$('#sheet-root');
  root.oninput=e=>{
    const t=e.target;
    if(t.dataset.axis){ f.profile[t.dataset.axis]=+t.value; $('#o-'+t.dataset.axis).textContent=t.value; $('#radar').innerHTML=radarSVG({single:f.profile}); }
    if(t.id==='f-score'){ f.score=+t.value; $('#o-score').textContent=t.value; $('#w-score').textContent=scoreWord(+t.value); }
    if(t.id==='f-note') f[phase].note=t.value;
  };
  const addTag=()=>{ const v=$('#newtag').value.trim(); if(v&&!f[phase].tags.includes(v)) f[phase].tags.push(v); drawPhase(); $('#newtag')?.focus(); };
  root.onkeydown=e=>{ if(e.target.id==='newtag'&&e.key==='Enter'){ e.preventDefault(); addTag(); } };
  root.onchange=null;
  root.onclick=async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.phase){ phase=b.dataset.phase; drawPhase(); return; }
    if(b.dataset.tag){ const arr=f[phase].tags, i=arr.indexOf(b.dataset.tag); i<0?arr.push(b.dataset.tag):arr.splice(i,1); drawPhase(); return; }
    if(b.dataset.len){ f.finishLength = f.finishLength===b.dataset.len?'':b.dataset.len; drawPhase(); return; }
    if(b.dataset.serve){ f.serve = f.serve===b.dataset.serve?'':b.dataset.serve; root.querySelectorAll('[data-serve]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.serve===f.serve)); return; }
    if(b.dataset.dstep){ f.day=Math.min(30,Math.max(1,f.day+(+b.dataset.dstep))); $('#o-day').innerHTML=`開栓 <b>${f.day}</b> 日目`; return; }
    if(b.dataset.color){ f.color = f.color===b.dataset.color?'':b.dataset.color; root.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.color===f.color)); return; }
    const a=b.dataset.act;
    if(a==='addtag') addTag();
    if(a==='cancel') goBack();
    if(a==='save' && !saving) save(b);
  };

  async function save(btn){
    f.comment=$('#f-comment').value.trim(); const nickname=$('#f-nick').value.trim(); const err=$('#err');
    if(!myId){ err.textContent='ログインできていないため保存できません。通信状態を確認してアプリを開き直してください。'; err.hidden=false; return; }
    saving=true; btn.disabled=true; btn.textContent='保存中…'; err.hidden=true;
    try{
      if(nickname) store.set('kohaku.nickname',nickname);
      const data={ serve:f.serve, color:f.color, nose:f.nose, palate:f.palate, finish:f.finish, finishLength:f.finishLength, profile:f.profile, score:f.score, comment:f.comment, name:bottle.name, ...(isWine?{day:f.day}:{}) };
      const row={ data, score:f.score, author_name:nickname||myName()||null, bottle_id:bottle.id };
      const res = existing
        ? await sb.from('reviews').update({...row, updated_at:new Date().toISOString()}).eq('id',existing.id).select().single()
        : await sb.from('reviews').insert(row).select().single();
      if(res.error) throw new Error(res.error.message);
      const t=rowToTasting(res.data);
      allTastings=[t,...allTastings.filter(x=>x.id!==t.id)]; refilter(); renderList();
      nav.replaceNext=true; openBottle(bottle.id); toast(existing?'記録を更新しました':'記録しました');
    }catch(x){ saving=false; btn.disabled=false; btn.textContent='保存'; err.textContent=x.message+' 通信状態を確認して、もう一度保存してください。'; err.hidden=false; }
  }
}

/* ---------- 図鑑 ---------- */
const zk = { mode:'region', country:null, region:null, axes:[], types:[], tags:[], prices:[], q:'' };
const priceBand = v => !v ? '' : v>=10000 ? `${Math.floor(v/10000)}万円台` : v<1000 ? `${Math.round(v/100)*100}円` : `${Math.floor(v/1000).toLocaleString('ja-JP')},000円台`;
const keyNorm = s => norm(s).replace(/^(ザ|the)/,'').replace(/(年|years?old|years?|yo)$/,'');
const profArr = obj => AXES.map(a=>+(obj?.[a[0]]||0));
const arrProf = arr => Object.fromEntries(AXES.map((a,i)=>[a[0],arr[i]]));
const glassColor = k => (colorOf(k)||COLORS[3])[2];
const zEntry = id => ZE.find(x=>x.id===id);
const zDist = id => ZD.find(x=>x.id===id);
const compare = { a:null, b:null };

function zukanFor(b){
  if(b.zukanId){ const z=ZE.find(x=>x.id===b.zukanId); if(z) return z; }
  const k = keyNorm(b.name);
  return ZE.find(z => keyNorm(z.name)===k || keyNorm(z.en)===k) || null;
}
function bottleForZ(z){
  const linked = bottles.find(b=>b.zukanId===z.id); if(linked) return linked;
  const a=keyNorm(z.name), e=keyNorm(z.en);
  return bottles.find(b=>{ const k=keyNorm(b.name); return k===a || k===e; }) || null;
}
// みんなの記録だけにある銘柄（図鑑にないもの）も、似ている銘柄・検索の対象にする
function communityItems(){
  return bottles.filter(b=>!zukanFor(b)).map(b=>{ const a=aggs.get(b.id); if(!a?.avgProfile && !b.price) return null;
    const regionKey = Object.keys(ZR).find(k=>(ZR[k].picks||[ZR[k].pick]).filter(Boolean).includes(b.region)) || null;
    return { id:'b:'+b.id, bottleId:b.id, name:b.name, en:'', distillery:b.distillery, region:regionKey, type:b.type, age:b.age, abv:b.abv, price:b.price||0, cask:b.cask,
      color:(Object.entries(a.colors).sort((x,y)=>y[1]-x[1])[0]||[])[0]||'', p:profArr(a?.avgProfile), tags:topTags(a,6).map(t=>t[0]), community:true, people:a.people };
  }).filter(Boolean);
}
function similarity(x,y){
  const d=Math.sqrt(x.p.reduce((s,v,i)=>s+(v-y.p[i])**2,0));
  const prof=Math.max(0,1-d/9);
  const A=new Set(x.tags), B=new Set(y.tags); const inter=[...A].filter(t=>B.has(t));
  const jac = (A.size||B.size) ? inter.length/new Set([...A,...B]).size : 0;
  return { score: prof*0.8 + jac*0.2, shared: inter };
}
// 同じ蒸留所の銘柄は「似ている銘柄」から外し、別の蒸留所の候補を見せる
function similarTo(item, n=5){
  const pool=[...ZE, ...communityItems()].filter(o=>o.id!==item.id && o.p.some(v=>v>0) && (!item.distilleryId || o.distilleryId!==item.distilleryId));
  return pool.map(o=>({o, ...similarity(item,o)})).sort((a,b)=>b.score-a.score).slice(0,n);
}
function projXY(lon,lat){ const P=ZUKAN_MAP.proj; return [ (lon-P.lon0)*P.c*P.k, (P.lat1-lat)*P.k ]; }

function mapSVG({ sel=null, focus=null, interactive=true, cls='zmap' }={}){
  const M=ZUKAN_MAP;
  const clips = Object.entries(M.clips).map(([k,v])=>`<clipPath id="zc-${k}"><polygon points="${v}"/></clipPath>`).join('')
    + `<mask id="zm-high" maskUnits="userSpaceOnUse" x="0" y="0" width="${M.w}" height="${M.h}"><rect width="${M.w}" height="${M.h}" fill="#fff"/>${Object.values(M.clips).map(v=>`<polygon points="${v}" fill="#000"/>`).join('')}</mask>`;
  const rg = (key, d, clip, mask) => `<g class="rg${sel===key?' sel':''}" data-region="${key}"${interactive?` role="button" tabindex="0" aria-label="${ZUKAN_REGIONS[key].jp}"`:''}${clip?` clip-path="url(#zc-${clip})"`:''}${mask?` mask="url(#${mask})"`:''}><path d="${d}"/></g>`;
  const dots = ZUKAN_DISTILLERIES.filter(d=>d.lat!=null).map(d=>{ const [x,y]=projXY(d.lon,d.lat);
    const c = focus ? (d.id===focus?'dot focus':'dot') : (sel && d.region===sel ? 'dot on' : 'dot');
    return `<circle class="${c}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d.id===focus?4.5:2.3}"/>`; }).join('');
  const labels = interactive ? Object.entries(ZUKAN_REGIONS).filter(([,r])=>r.scot).map(([k,r])=>{ const [x,y]=projXY(r.label[0],r.label[1]);
    return `<text class="lbl${sel===k?' sel':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${r.jp}</text>`; }).join('') : '';
  return `<svg class="${cls}${sel?' has-sel':''}" viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="スコットランドのウイスキー産地の地図">
    <defs>${clips}</defs>
    <path class="near" d="${M.near}"/>
    <path class="land" d="${M.mainland}"/><path class="land" d="${M.islay}${M.islands}"/><path class="other" d="${M.other}"/>
    ${rg('highland',M.mainland,null,'zm-high')}${rg('lowland',M.mainland,'lowland')}${rg('speyside',M.mainland,'speyside')}${rg('campbeltown',M.mainland,'campbeltown')}
    ${rg('islay',M.islay)}${rg('islands',M.islands)}
    ${dots}${labels}</svg>`;
}

/* ---------- 世界地図 → 国別地図 ---------- */
const SHORT_NAME = { chichibu:'秩父', fujigotemba:'富士御殿場', marsshinshu:'マルス信州' };
const shortName = d => SHORT_NAME[d.id] || d.name.replace(/^(サントリー|ニッカ|キリン)\s*/,'').replace(/蒸溜所|蒸留所/,'').replace(/（.*?）/,'').trim();
const countDist = key => ZD.filter(d=>ZK_COUNTRIES[key].regions.includes(d.region)).length;
const countEx = key => ZE.filter(z=>ZK_COUNTRIES[key].regions.includes(z.region)).length;

function worldSVG(){
  const M=ZW.world, P=M.proj, xy=(lon,lat)=>[(lon-P.lon0)*P.c*P.k,(P.lat1-lat)*P.k];
  const hi = BIG5.map(k=>`<path class="wc" data-country="${k}" d="${M.hi[k]}"/>`).join('');
  const pins = BIG5.map(k=>{ const c=ZK_COUNTRIES[k]; const [x,y]=xy(...c.mark); const [lx,ly,anc]=WORLD_LABEL[k];
    const tw=c.style.length*4.2+4; const bx = anc==='start'?lx-2:anc==='end'?lx-tw+2:lx-tw/2;
    return `<g class="wpin" data-country="${k}" role="button" tabindex="0" aria-label="${c.style}">
      <line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${lx}" y2="${ly-1.5}"/>
      <circle class="whit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>
      <circle class="ring" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/><circle class="core" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.2"/>
      <rect x="${bx.toFixed(1)}" y="${(ly-5).toFixed(1)}" width="${tw.toFixed(1)}" height="6.6" rx="3.3"/>
      <text x="${lx}" y="${ly}" text-anchor="${anc}">${c.style}</text></g>`; }).join('');
  return `<svg class="wmap" viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="${L.worldAria}"><path class="wbase" d="${M.base}"/>${hi}${pins}</svg>`;
}

// 国別地図：蒸留所の点と名前（重ならないように配置）
function countryMapSVG(key, { focus=null, mini=false, sel=null }={}){
  const C=ZK_COUNTRIES[key], M=ZW[C.map], P=M.proj;
  const xy=(lon,lat)=>[(lon-P.lon0)*P.c*P.k,(P.lat1-lat)*P.k];
  const s=M.w/340, fs=10*s, r=3.6*s;
  const byRegion = !mini && C.regions.length>1 && C.regions.every(k=>ZR[k]?.label);
  const ds=ZD.filter(d=>C.regions.includes(d.region) && d.lat!=null);
  const pts = byRegion
    ? C.regions.map(k=>{ const [x,y]=xy(...ZR[k].label); return {d:{id:k, name:ZR[k].jp}, region:k, x, y, t:ZR[k].short||ZR[k].jp.replace(/（.*?）/,'')}; })
    : ds.map(d=>{ const [x,y]=xy(d.lon,d.lat); return {d,x,y,t:shortName(d)}; });
  const boxes=pts.map(p=>({x0:p.x-r,y0:p.y-r,x1:p.x+r,y1:p.y+r}));
  const hit=(b)=>boxes.some(o=>!(b.x1<o.x0||b.x0>o.x1||b.y1<o.y0||b.y0>o.y1)) || b.x0<0 || b.y0<0 || b.x1>M.w || b.y1>M.h;
  let labels;
  if(C.callout && !mini){
    // 密集した地域は、左右の列に名前を並べて線で結ぶ
    const midX = M.w/2, gap=fs*1.5, padY=fs*1.6;
    const place = (arr, side) => { arr.sort((a,b)=>a.y-b.y); let last=-1e9;
      return arr.map(p=>{ let ly=Math.max(p.y, last+gap, padY); ly=Math.min(ly, M.h-fs*0.6); last=ly;
        const lx = side==='l' ? 6*s : M.w-6*s; return {p, pick:[lx, ly+fs*0.35, side==='l'?'start':'end'], lead:[side==='l'?lx+p.t.length*fs*0.98+3*s:lx-p.t.length*fs*0.98-3*s, ly]}; }); };
    const L=pts.filter(p=>p.x<midX), R=pts.filter(p=>p.x>=midX);
    labels=[...place(L,'l'), ...place(R,'r')];
  } else labels=pts.map(p=>{
    if(mini) return {p, pick:null};
    const w=p.t.length*fs*0.98, g=r+2*s;
    const cands=[[p.x+g,p.y+fs*0.35,'start'],[p.x-g,p.y+fs*0.35,'end'],[p.x,p.y-g-fs*0.2,'middle'],[p.x,p.y+g+fs*0.85,'middle'],
      [p.x+g*0.8,p.y-g*0.8,'start'],[p.x+g*0.8,p.y+g*0.8+fs*0.7,'start'],[p.x-g*0.8,p.y-g*0.8,'end'],[p.x-g*0.8,p.y+g*0.8+fs*0.7,'end']];
    const box=([tx,ty,a])=>{ const x0=a==='start'?tx:a==='end'?tx-w:tx-w/2; return {x0,y0:ty-fs*0.85,x1:x0+w,y1:ty+fs*0.15}; };
    let pick=cands.find(c=>!hit(box(c))) || cands[0];
    boxes.push(box(pick)); return {p,pick};
  });
  const sub = (M.hi?Object.values(M.hi).map(d=>`<path class="hi" d="${d}"/>`).join(''):'')
    + (M.labels?M.labels.map(([t,x,y])=>`<text class="state" x="${x}" y="${y}" text-anchor="middle" style="font-size:${(8*s).toFixed(1)}px">${t}</text>`).join(''):'');
  const dots = labels.map(({p,pick,lead})=> mini
    ? `<circle class="mdot${p.d.id===focus?' focus':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(p.d.id===focus?r*2:r).toFixed(1)}" style="stroke-width:${(1.6*s).toFixed(2)}"/>`
    : `<g class="dpin${p.region?' rpin'+(sel===p.region?' sel':sel?' dim':''):''}" ${p.region?`data-world="${esc(p.region)}" aria-pressed="${sel===p.region}"`:`data-d="${esc(p.d.id)}"`} role="button" tabindex="0" aria-label="${esc(p.d.name)}">
      ${lead?`<line class="lead" x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${lead[0].toFixed(1)}" y2="${lead[1].toFixed(1)}" style="stroke-width:${(0.8*s).toFixed(2)}"/>`:''}
      <circle class="hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r*3).toFixed(1)}"/>
      <circle class="dot2" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" style="stroke-width:${(1.4*s).toFixed(2)}"/>
      <text x="${pick[0].toFixed(1)}" y="${pick[1].toFixed(1)}" text-anchor="${pick[2]}" style="font-size:${fs.toFixed(1)}px;stroke-width:${(3*s).toFixed(1)}px">${esc(p.t)}</text></g>`).join('');
  return `<svg class="cmap${mini?' mini':''}" viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="${C.jp}の${byRegion?'産地':L.maker}の地図">
    <path class="near" d="${M.base}"/>${M.land?`<path class="land" d="${M.land}"/>`:''}${M.land2?`<path class="land2" d="${M.land2}"/>`:''}${sub}${dots}</svg>`;
}

function miniMap(d){
  const ck = Object.keys(ZK_COUNTRIES).find(k=>ZK_COUNTRIES[k].map && ZK_COUNTRIES[k].regions.includes(d.region));
  return ck ? countryMapSVG(ck,{focus:d.id, mini:true}) : mapSVG({sel:d.region, focus:d.id, interactive:false});
}
function regionPanel(){
  if(K.single && !zk.country) zk.country = K.single;
  const c = zk.country && ZK_COUNTRIES[zk.country];
  if(!c){
    return `<div class="mapcard world-card"><span class="caption">${L.worldCap}</span>${worldSVG()}</div>
      <div class="ccards">${BIG5.map(k=>{ const x=ZK_COUNTRIES[k]; return `<button class="ccard" data-country="${k}"><span class="en">${x.en}</span><b>${x.style}</b><span class="small">${x.style!==x.jp?x.jp+'・':''}${countDist(k)}${L.makerCount}／${countEx(k)}銘柄</span></button>`; }).join('')}</div>
      ${MINOR.length?`<div class="world"><span class="lbl">そのほかの国</span>${MINOR.map(k=>`<button class="chip" data-country="${k}">${ZK_COUNTRIES[k].jp}</button>`).join('')}</div>`:''}
      ${K.daily?`<button class="daily-btn" data-act="daily"><span class="en">${K.daily.en}</span><b>${K.daily.title}</b><span class="small">${K.daily.sub}</span></button>`:''}
      <p class="small" style="margin:0">${L.worldHint}</p>`;
  }
  const back = K.single ? '' : `<div class="cbar"><button class="btn small ghost" data-act="world">‹ 世界地図</button><span><b>${c.style}</b><small>${c.en}</small></span></div>`;
  if(zk.country==='scot'){
    const r = zk.region && ZR[zk.region];
    return `${back}
      <div class="mapcard"><span class="caption">SCOTLAND</span><span class="compass">N ↑</span>${mapSVG({sel:zk.region})}</div>
      <div class="world"><span class="lbl">地域</span>${ZK_COUNTRIES.scot.regions.map(k=>`<button class="chip" data-world="${k}" aria-pressed="${zk.region===k}">${k==='scotland'?'ブレンデッド':ZR[k].jp}</button>`).join('')}</div>
      ${r?`<div class="rinfo"><h3>${r.jp}<small>${r.en}</small></h3><p>${esc(r.desc)}</p></div>`:`<div class="rinfo"><p>${esc(ZK_COUNTRIES.scot.desc)}</p></div>`}`;
  }
  if(c.regions.length>1){
    // 複数の産地がある国：地図の産地をタップして絞り込む
    const r = zk.region && ZR[zk.region];
    return `${back}
      <div class="mapcard"><span class="caption">${c.en}</span><span class="compass">N ↑</span>${countryMapSVG(zk.country,{sel:zk.region})}</div>
      <div class="world"><span class="lbl">${K.single?'地方':'産地'}</span>${c.regions.map(k=>`<button class="chip" data-world="${k}" aria-pressed="${zk.region===k}">${ZR[k].jp}</button>`).join('')}</div>
      ${r?`<div class="rinfo"><h3>${r.jp}<small>${r.en}</small></h3><p>${esc(r.desc)}</p></div>`:`<div class="rinfo"><p>${esc(c.desc||'')}</p></div>`}
      ${K.single && K.daily?`<button class="daily-btn" data-act="daily"><span class="en">${K.daily.en}</span><b>${K.daily.title}</b><span class="small">${K.daily.sub}</span></button>`:''}`;
  }
  const rk = c.regions[0]; const rr = ZR[rk];
  return `${back}
    ${c.map?`<div class="mapcard"><span class="caption">${c.en}</span><span class="compass">N ↑</span>${countryMapSVG(zk.country)}</div>
    <p class="small" style="margin:0">${c.note?esc(c.note)+' ':''}地図の${L.maker}をタップすると詳しく見られます。</p>`:''}
    <div class="rinfo"><h3>${rr.jp}<small>${rr.en}</small></h3><p>${esc(rr.desc)}</p></div>`;
}

/* 産地モード：蒸留所の一覧 ／ 味・香りモード：銘柄の一覧 */
function zkDistilleries(){
  const q = norm(zk.q);
  let ds = ZD.slice();
  if(q) ds = ds.filter(d=>norm([d.name,d.en,ZR[d.region]?.jp,...d.ex.flatMap(x=>[x.name,x.en,x.label,x.cask,...x.tags])].join(' ')).includes(q));
  if(!q){
    if(!zk.country) return [];
    if(zk.country==='scot'){ if(!zk.region) return []; ds = ds.filter(d=>d.region===zk.region); }
    else if(zk.region) ds = ds.filter(d=>d.region===zk.region);
    else ds = ds.filter(d=>ZK_COUNTRIES[zk.country].regions.includes(d.region));
  }
  return ds.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}
function zkFlavorResults(){
  const q = norm(zk.q);
  let items = [...ZE, ...communityItems()];
  if(q) items = items.filter(z=>norm([z.name,z.en,z.distillery,z.type,z.cask,ZR[z.region]?.jp,...z.tags].join(' ')).includes(q));
  if(zk.types.length) items = items.filter(z=>zk.types.includes(z.type));
  if(zk.prices.length) items = items.filter(z=>z.price && zk.prices.some(k=>{ const r=ZK_PRICES.find(x=>x[0]===k); return z.price>=r[2] && z.price<r[3]; }));
  const has = zk.axes.length || zk.tags.length;
  let rows = items.map(z=>{
    const ax = zk.axes.length ? zk.axes.reduce((s,k)=>s+z.p[AXES.findIndex(a=>a[0]===k)]/5,0)/zk.axes.length : 0;
    const tg = zk.tags.length ? zk.tags.filter(t=>z.tags.includes(t)).length/zk.tags.length : 0;
    const score = zk.axes.length && zk.tags.length ? ax*0.65+tg*0.35 : zk.axes.length ? ax : tg;
    return { z, score };
  });
  if(zk.tags.length) rows = rows.filter(r=>zk.tags.some(t=>r.z.tags.includes(t)));
  if(has) rows = rows.filter(r=>r.score>=0.45).sort((a,b)=>b.score-a.score || (a.z.price||0)-(b.z.price||0));
  else if(zk.prices.length) rows.sort((a,b)=>(a.z.price||0)-(b.z.price||0) || a.z.name.localeCompare(b.z.name,'ja'));
  else rows.sort((a,b)=>a.z.name.localeCompare(b.z.name,'ja'));
  return { items:rows, scored:has };
}
const priceRange = d => { const ps=d.ex.map(x=>x.price).filter(Boolean); if(!ps.length) return '';
  const lo=priceBand(Math.min(...ps)), hi=priceBand(Math.max(...ps)); return lo===hi ? lo : `${lo}〜${hi}`; };
function dCard(d){
  const tags=[...new Set(d.ex.flatMap(x=>x.tags))].slice(0,4);
  const recorded = d.ex.some(x=>{ const b=bottleForZ(x); return b && aggs.get(b.id)?.n; });
  return `<button class="zcard" data-d="${esc(d.id)}"><span class="gl" style="background:${glassColor(d.ex[0].color)}"></span>
    <span class="info"><h3>${esc(d.name)}</h3><div class="en">${esc(d.en)}</div>
      <div class="meta">${esc(ZR[d.region]?.jp||'')} · 約${esc(priceRange(d))}${recorded?'<span class="badge peat">みんなの記録あり</span>':''}</div>
      <div class="tagline">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></span>
    <span class="right"><b>${d.ex.length}</b><i>銘柄</i></span></button>`;
}
function zCard({z,score}, scored){
  const b = z.community ? bottles.find(x=>x.id===z.bottleId) : bottleForZ(z);
  const a = b ? aggs.get(b.id) : null;
  const meta=[z.community?z.distillery:'', ZR[z.region]?.jp, z.abv?z.abv+'%':'', z.price?'約'+priceBand(z.price):''].filter(Boolean).join(' · ');
  const right = scored ? `<b>${Math.round(score*100)}<small style="font-size:11px">%</small></b><i>一致</i>`
    : a?.n ? `<b>${a.n>1?fmt1(a.avg):a.avg}</b><i>みんな${a.people}人</i>` : '';
  return `<button class="zcard" data-z="${esc(z.id)}"><span class="gl" style="background:${glassColor(z.color)}"></span>
    <span class="info"><h3>${esc(z.name)}${z.community?'<span class="badge peat">みんなの記録</span>':''}</h3>${z.en?`<div class="en">${esc(z.en)}</div>`:''}
      <div class="meta">${esc(meta||z.type||'')}</div>
      ${z.tags.length?`<div class="tagline">${z.tags.slice(0,4).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
      ${scored?`<div class="matchbar"><i style="width:${Math.round(score*100)}%"></i></div>`:''}</span>
    <span class="right">${right}</span></button>`;
}

function renderZukan(list){
  const r = zk.region && ZR[zk.region];
  const panel = zk.mode==='region' ? regionPanel() : zk.mode==='grape' ? grapePanel()
    : `
      <div class="zk-filter">
        <div class="group-name">こんな味わい（複数選べます）</div>
        <div class="chips">${AXES.map(([k,jp])=>`<button class="chip" data-axis-pick="${k}" aria-pressed="${zk.axes.includes(k)}">${jp}</button>`).join('')}</div>
        <div class="group-name">香り・味のキーワード</div>
        <div class="chips">${ZK_TAGS.map(t=>`<button class="chip" data-tag-pick="${esc(t)}" aria-pressed="${zk.tags.includes(t)}">${esc(t)}</button>`).join('')}</div>
        <div class="group-name">タイプ</div>
        <div class="chips">${ZK_TYPES.map(t=>`<button class="chip" data-type-pick="${esc(t)}" aria-pressed="${zk.types.includes(t)}">${esc(t)}</button>`).join('')}</div>
        <div class="group-name">価格帯（目安）</div>
        <div class="chips">${ZK_PRICES.map(([k,l])=>`<button class="chip" data-price-pick="${k}" aria-pressed="${zk.prices.includes(k)}">${l}</button>`).join('')}</div>
        ${zk.axes.length||zk.tags.length||zk.types.length||zk.prices.length?`<div><button class="btn small ghost" data-act="zk-clear">条件をクリア</button></div>`:''}
      </div>`;
  list.innerHTML = `<div class="zk">
    <input class="search" id="zk-q" type="search" placeholder="${L.zkSearch}" aria-label="図鑑を検索" value="${esc(zk.q)}">
    <div class="zk-top">
      <div class="zk-mode" role="group" aria-label="探し方" style="grid-template-columns:repeat(${L.modes.length},1fr)">${L.modes.map(([k,t])=>`<button data-zmode="${k}" aria-pressed="${zk.mode===k}">${t}</button>`).join('')}</div>
      <button class="btn cmp-open" data-act="cmp-open" aria-label="2つの銘柄を比較">比較${compare.a||compare.b?`<em>${[compare.a,compare.b].filter(Boolean).length}</em>`:''}</button>
    </div>
    ${panel}
    <div id="zk-results"></div>
    <p class="note-small">${L.zkNote}</p>
  </div>`;
  drawZkResults();
}
function drawZkResults(){
  const el=$('#zk-results'); if(!el) return;
  if(zk.mode==='grape'){ const g=$('#grape-list'); if(g) g.innerHTML=grapeCards(); el.innerHTML=''; return; }
  if(zk.mode==='region'){
    const ds = zkDistilleries();
    if(!zk.q && (!zk.country || (zk.country==='scot' && !zk.region))){ el.innerHTML=''; return; }
    const title = zk.q ? `「${esc(zk.q)}」` : zk.country==='scot' ? esc(zk.region==='scotland'?'ブレンデッドスコッチ':ZR[zk.region]?.jp||'') : zk.region ? esc(ZR[zk.region]?.jp||'') : esc(ZK_COUNTRIES[zk.country].jp);
    const regs = zk.q ? [] : zk.region ? [zk.region] : ZK_COUNTRIES[zk.country].regions;
    const extra = communityItems().filter(c=>regs.includes(c.region));
    el.innerHTML = `<div class="zk-head"><b>${title}</b><span>${ds.length}${L.makerCount}・${ds.reduce((s,d)=>s+d.ex.length,0)}銘柄</span></div>
      <div class="list" style="padding-top:8px">${ds.length?ds.map(dCard).join(''):`<div class="empty" style="padding:24px 8px"><p>該当する${L.makerCount}がありません。</p></div>`}
      ${extra.length?`<div class="zk-head" style="margin-top:6px"><b style="font-size:14px">みんなが記録した銘柄</b><span>${extra.length}銘柄</span></div>${extra.map(z=>zCard({z},false)).join('')}`:''}</div>`;
    return;
  }
  const { items, scored } = zkFlavorResults();
  const title = zk.q ? `「${esc(zk.q)}」` : (scored || zk.prices.length || zk.types.length) ? '条件に合う銘柄' : 'すべての銘柄';
  el.innerHTML = `<div class="zk-head"><b>${title}</b><span>${items.length}銘柄</span></div>
    <div class="list" style="padding-top:8px">${items.length?items.map(it=>zCard(it,scored)).join(''):`<div class="empty" style="padding:24px 8px"><p>該当する銘柄がありません。条件を減らしてみてください。</p></div>`}</div>`;
}
document.addEventListener('input',e=>{ if(e.target.id==='zk-q'){ zk.q=e.target.value.trim(); drawZkResults(); } });
$('#list').addEventListener('click',e=>{
  if(view!=='zukan') return;
  const t=e.target;
  const rg=t.closest('.rg'); if(rg){ const k=rg.dataset.region; zk.region = zk.region===k?null:k; renderZukan($('#list')); navCommit(); if(zk.region) setTimeout(()=>$('#zk-results')?.scrollIntoView({behavior:'smooth',block:'start'}),50); return; }
  const ct=t.closest('[data-country]'); if(ct){ zk.country=ct.dataset.country; zk.region=null; renderZukan($('#list')); navCommit(); window.scrollTo({top:0}); return; }
  if(t.closest('[data-act="world"]')){ const prev=nav.stack[nav.stack.length-2]; if(prev && !prev.sheet && prev.view==='zukan' && !prev.zk.country) return goBack(); zk.country=null; zk.region=null; renderZukan($('#list')); navCommit(); return; }
  const w=t.closest('[data-world]'); if(w){ const k=w.dataset.world; zk.region = zk.region===k?null:k; renderZukan($('#list')); navCommit(); return; }
  const m=t.closest('[data-zmode]'); if(m){ if(zk.mode===m.dataset.zmode) return; zk.mode=m.dataset.zmode; renderZukan($('#list')); navCommit(); return; }
  const tog=(arr,v)=>{ const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); };
  const ax=t.closest('[data-axis-pick]'); if(ax){ tog(zk.axes,ax.dataset.axisPick); renderZukan($('#list')); return; }
  const tg=t.closest('[data-tag-pick]'); if(tg){ tog(zk.tags,tg.dataset.tagPick); renderZukan($('#list')); return; }
  const ty=t.closest('[data-type-pick]'); if(ty){ tog(zk.types,ty.dataset.typePick); renderZukan($('#list')); return; }
  const pr=t.closest('[data-price-pick]'); if(pr){ tog(zk.prices,pr.dataset.pricePick); renderZukan($('#list')); return; }
  if(t.closest('[data-act="daily"]')){ zk.mode='flavor'; zk.axes=[]; zk.tags=[]; zk.types=[]; zk.prices=[...(K.daily?.prices||['p0','p1'])]; zk.q=''; renderZukan($('#list')); navCommit(); window.scrollTo(0,0); return; }
  if(t.closest('[data-act="zk-clear"]')){ zk.axes=[]; zk.tags=[]; zk.types=[]; zk.prices=[]; renderZukan($('#list')); return; }
  if(t.closest('[data-act="cmp-open"]')){ openCompare(); return; }
  const d=t.closest('[data-d]'); if(d){ openDistillery(d.dataset.d); return; }
  const gp=t.closest('[data-grape]'); if(gp){ openGrape(gp.dataset.grape); return; }
  const c=t.closest('[data-z]'); if(c) openZukanItem(c.dataset.z);
});
$('#list').addEventListener('keydown',e=>{ const g=e.target.closest?.('.rg,.wpin,.dpin'); if(view==='zukan' && (e.key==='Enter'||e.key===' ') && g){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });

    <section class="sec story">${st.story.map((t,i)=>`<div class="st"><h3>${heads[i][0]}<small>${heads[i][1]}</small></h3><p>${esc(t)}</p></div>`).join('')}</section>`;
}

/* 銘柄ページ */
function openZukan(id){
  curSheet={t:'zukan',id};
  const z = zEntry(id); if(!z) return;
  currentBottle=null;
  const d = zDist(z.distilleryId);
  const r = ZR[z.region];
  const b = bottleForZ(z); const a = b ? aggs.get(b.id) : null;
  const facts=[['参考価格',z.price?priceBand(z.price):''], ...K.zFacts(z)].filter(f=>f[1]);
  const grapes = (z.grapes||[]).map(id=>GL().find(g=>g.id===id)).filter(Boolean);
  const sims = similarTo(z,5);
  const siblings = d ? d.ex.filter(x=>x.id!==z.id) : [];
  const community = a?.avgProfile ? profArr(a.avgProfile) : null;
  mount(`<div class="sheet" data-view="zukan" role="dialog" aria-modal="true" aria-label="${esc(z.name)}">
    <div class="sheet-bar"><button class="btn ghost" data-act="back">‹ 戻る</button><h2></h2><button class="btn" data-act="cmp-add">比較</button></div>
    <div class="sheet-body">
      <div class="z-hero"><span class="gl" style="background:${glassColor(z.color)}"></span>
        <div><div class="small">${esc(r?.jp||'')}${r?.en?` · ${esc(r.en)}`:''}</div><h1>${esc(z.name)}</h1><div class="en">${esc(z.en)}</div></div></div>
      ${myId?`<div>${wishBtn('z:'+z.id)}</div>`:''}
      <p class="z-desc">${esc(z.desc)}</p>
      <dl class="facts">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>
      ${z.price?`<p class="small" style="margin:-12px 0 0">参考価格は${z.priceNote?esc(z.priceNote)+'。':L.priceNote}</p>`:''}
      ${grapes.length?`<section class="sec"><h3>${K.G.name}<small>${K.G.en}</small></h3><div class="chips">${grapes.map(g=>`<button class="chip" data-grape="${g.id}">${esc(g.name)} ›</button>`).join('')}</div></section>`:''}

      ${siblings.length?`<section class="sec"><h3>同じラインナップのほかの銘柄<small>RANGE</small></h3>
        <div class="chips">${siblings.map(x=>`<button class="chip" data-zopen="${esc(x.id)}">${esc(x.label)}</button>`).join('')}</div></section>`:''}

      <section class="sec"><h3>味わいの傾向<small>PROFILE</small></h3>
        <div class="radar-wrap">${radarSVG({ single:arrProf(z.p), mine: community ? arrProf(community) : null })}
          <div class="legend"><span><i style="border-color:var(--amber)"></i>一般的な傾向</span>${community?`<span><i style="border-color:var(--peat);border-top-style:dashed"></i>みんなの感じ方（${a.profs.length}件）</span>`:''}</div></div>
      </section>
      <section class="sec"><h3>よく語られる香りと味<small>NOTES</small></h3>
        <div class="chips">${z.tags.map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div></section>

      <section class="sec"><h3>似ている銘柄<small>SIMILAR</small></h3>
        <p class="small" style="margin:0 0 8px">${L.simNote}</p>
        <div class="list" style="padding-top:0">${sims.map(s=>{
          const o=s.o; const meta=[o.community?'':o.distillery, ZR[o.region]?.jp, o.price?'約'+priceBand(o.price):''].filter(Boolean).join(' · ');
          return `<button class="zcard" data-zopen="${esc(o.id)}"><span class="gl" style="background:${glassColor(o.color)}"></span>
            <span class="info"><h3>${esc(o.name)}${o.community?'<span class="badge peat">みんなの記録</span>':''}</h3><div class="meta">${esc(meta)}</div>
            ${s.shared.length?`<div class="tagline">${s.shared.slice(0,4).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}</span>
            <span class="right"><b>${Math.round(s.score*100)}<small style="font-size:11px">%</small></b><i>似ている</i></span></button>`; }).join('')}</div>
      </section>

      <section class="sec"><h3>みんなの記録<small>TASTINGS</small></h3>
        ${a?.n ? `<p style="margin:0 0 8px">${a.people}人が記録しています。平均 <b style="font-family:var(--mono);color:var(--amber)">${a.n>1?fmt1(a.avg):a.avg}</b> 点</p><button class="btn" data-act="open-b">みんなの記録を見る</button>`
          : `<p class="small" style="margin:0">まだ誰も記録していません。飲んだら最初の記録を残しましょう。</p>`}
      </section>
      <p class="note-small">味わいは一般的に語られる傾向をもとにした目安です。実際に飲んだ感想は「みんなの記録」に集まっていきます。</p>
    </div>
    ${myId?`<div class="cta"><button class="btn primary" data-act="taste-z">この銘柄をテイスティング</button></div>`:''}
  </div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-zopen],[data-grape]'); if(!el) return;
    if(el.dataset.zopen) return openZukanItem(el.dataset.zopen);
    if(el.dataset.grape) return openGrape(el.dataset.grape);
    const act=el.dataset.act;
    if(act==='back') goBack();
    if(act==='open-b' && b) openBottle(b.id);
    if(act==='cmp-add'){
      if(compare.a===z.id || compare.b===z.id){ openCompare(); return; }
      if(!compare.a) compare.a=z.id; else if(!compare.b) compare.b=z.id; else compare.b=z.id;
      openCompare();
    }
    if(act==='taste-z'){ el.disabled=true; tasteZukan(z); }
  };
}

/* ---------- ブドウ品種（ワイン）／酒米（日本酒） ---------- */
const GL = () => K.G ? K.G.list() : [];
const grapeGlass = g => glassColor(K.G.glass(g));
function grapeCards(){
  const q=norm(zk.q);
  const gs=GL().filter(g=>!q || norm([g.name,g.en,g.home,...g.tags].join(' ')).includes(q));
  const card=g=>{ const n=ZE.filter(z=>(z.grapes||[]).includes(g.id)).length;
    return `<button class="zcard" data-grape="${g.id}"><span class="gl" style="background:${grapeGlass(g)}"></span>
      <span class="info"><h3>${esc(g.name)}</h3><div class="en">${esc(g.en)}</div><div class="meta">${esc(g.home)}</div>
        <div class="tagline">${g.tags.slice(0,4).map(t=>`<span>${esc(t)}</span>`).join('')}</div></span>
      <span class="right"><b>${n}</b><i>本</i></span></button>`; };
  const grp=(k,t)=>{ const l=gs.filter(g=>g.kind===k); return l.length?`<div class="zk-head"><b>${t}</b><span>${l.length}${K.G.unit}</span></div><div class="list" style="padding-top:8px">${l.map(card).join('')}</div>`:''; };
  return K.G.groups.map(([k,t])=>grp(k,t)).join('') || `<div class="empty" style="padding:24px 8px"><p>該当する${K.G.name}がありません。</p></div>`;
}
function grapePanel(){
  return `<p class="small" style="margin:0">${K.G.intro}</p><div id="grape-list" style="display:grid;gap:10px">${grapeCards()}</div>`;
}
function openGrape(id){
  curSheet={t:'grape',id};
  const g=GL().find(x=>x.id===id); if(!g) return;
  currentBottle=null;
  const wines=ZE.filter(z=>(z.grapes||[]).includes(id)).sort((a,b)=>(a.grapes[0]===id?0:1)-(b.grapes[0]===id?0:1) || (a.price||0)-(b.price||0));
  const sims=GL().filter(x=>x.id!==id).map(o=>({o,...similarity(g,o)})).sort((a,b)=>b.score-a.score).slice(0,4);
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(g.name)}">
    <div class="sheet-bar"><button class="btn ghost" data-act="back">‹ 戻る</button><h2>${esc(g.name)}</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <div class="z-hero"><span class="gl" style="background:${grapeGlass(g)}"></span>
        <div><div class="small">${K.G.sub(g)} · ${K.G.en}</div><h1>${esc(g.name)}</h1><div class="en">${esc(g.en)}</div></div></div>
      <p class="z-desc">${esc(g.desc)}</p>
      <dl class="facts"><div><dt>主な産地</dt><dd>${esc(g.home)}</dd></div></dl>
      <section class="sec"><h3>味わいの傾向<small>PROFILE</small></h3>
        <div class="radar-wrap">${radarSVG({single:arrProf(g.p)})}<div class="legend"><span><i style="border-color:var(--amber)"></i>この${K.G.name}の一般的な傾向</span></div></div></section>
      <section class="sec"><h3>よく語られる香り<small>NOTES</small></h3>
        <div class="chips">${g.tags.map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div></section>
      <section class="sec"><h3>${K.G.itemsTitle}<small>${wines.length} ${K.G.itemsEn}</small></h3>
        ${wines.length?`<div class="list" style="padding-top:0">${wines.map(z=>zCard({z},false)).join('')}</div>`:'<p class="small" style="margin:0">図鑑にはまだありません。</p>'}</section>
      <section class="sec"><h3>似ている${K.G.name}<small>SIMILAR</small></h3>
        <div class="chips">${sims.map(x=>`<button class="chip" data-grape="${x.o.id}">${esc(x.o.name)}</button>`).join('')}</div></section>
      <p class="note-small">${K.G.note}</p>
    </div></div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-z],[data-grape]'); if(!el) return;
    if(el.dataset.grape) return openGrape(el.dataset.grape);
    if(el.dataset.z) return openZukanItem(el.dataset.z);

function chooseKind(k, startView){
  if(!KINDS[k]) return;

    compare.a=null; compare.b=null; query=''; $('#q').value='';
  }
  refilter();
  view = startView || 'bottles';
  ['bottles','feed','zukan','mine'].forEach(x=>$('#t-'+x).setAttribute('aria-selected',view===x));
  setKindsVisible(false);

$('#kind-chip').onclick=()=>showKindPicker();

/* ---------- 2銘柄の比較 ---------- */
function butterfly(A,B){
  return `<div class="bfly">${AXES.map(([k,jp],i)=>{ const a=A.p[i], b=B.p[i];
    return `<div class="bf-row"><em class="bf-n">${a}</em><div class="bf-l"><i style="width:${a*20}%"></i></div><span class="bf-k${a!==b?' diff':''}">${jp}</span><div class="bf-r"><i style="width:${b*20}%"></i></div><em class="bf-n">${b}</em></div>`; }).join('')}</div>`;
}
function openCompare(){
  curSheet={t:'cmp'};
  const A = compare.a ? zEntry(compare.a) : null, B = compare.b ? zEntry(compare.b) : null;
  const slot = (z, key) => z
    ? `<div class="cmp-slot"><span class="gl" style="background:${glassColor(z.color)}"></span><strong>${esc(z.name)}</strong><span class="small">${esc(ZR[z.region]?.jp||'')}</span>
        <div class="cmp-act"><button class="btn small ghost" data-pick="${key}">変更</button><button class="btn small ghost" data-open="${esc(z.id)}">詳細</button></div></div>`
    : `<button class="cmp-slot empty" data-pick="${key}"><span class="plus">＋</span><span>銘柄を選ぶ</span></button>`;
  let body = '';
  if(A && B){
    const sim = similarity(A,B);
    const onlyA = A.tags.filter(t=>!B.tags.includes(t)), onlyB = B.tags.filter(t=>!A.tags.includes(t));
    const rows = [['参考価格',A.price?priceBand(A.price):'—',B.price?priceBand(B.price):'—'], ...K.cmpRows(A,B)];
    const ba=bottleForZ(A), bb=bottleForZ(B); const aa=ba?aggs.get(ba.id):null, ab=bb?aggs.get(bb.id):null;
    body = `
      <section class="sec"><h3>似ている度合い<small>SIMILARITY</small></h3>
        <div class="cmp-sim"><b>${Math.round(sim.score*100)}<small>%</small></b><span>${sim.score>=0.75?'かなり近いタイプ':sim.score>=0.6?'共通点が多い':sim.score>=0.45?'ところどころ似ている':'まったく違うタイプ'}</span></div></section>
      <section class="sec"><h3>基本情報<small>SPEC</small></h3>
        <div class="cmp-table">${rows.map(([k,a,b])=>`<div class="cmp-k">${k}</div><div class="cmp-a${a!==b?' diff':''}">${esc(a||'—')}</div><div class="cmp-b${a!==b?' diff':''}">${esc(b||'—')}</div>`).join('')}</div></section>
      <section class="sec"><h3>味わいの傾向<small>PROFILE</small></h3>
        <div class="radar-wrap">${radarSVG({ single:arrProf(A.p), mine:arrProf(B.p) })}
          <div class="legend"><span><i style="border-color:var(--amber)"></i>${esc(A.name)}</span><span><i style="border-color:var(--peat);border-top-style:dashed"></i>${esc(B.name)}</span></div></div>
        ${butterfly(A,B)}
      </section>
      <section class="sec"><h3>香りと味<small>NOTES</small></h3>
        ${sim.shared.length?`<div class="group-name">共通</div><div class="chips">${sim.shared.map(t=>`<span class="chip" aria-pressed="true">${esc(t)}</span>`).join('')}</div>`:''}
        <div class="cmp-tags"><div><div class="group-name" style="color:var(--amber)">${esc(A.label||A.name)}だけ</div><div class="chips">${onlyA.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="small">—</span>'}</div></div>
          <div><div class="group-name">${esc(B.label||B.name)}だけ</div><div class="chips">${onlyB.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="small">—</span>'}</div></div></div>
      </section>
      ${aa?.n||ab?.n?`<section class="sec"><h3>みんなの評価<small>TASTINGS</small></h3>
        <div class="cmp-table"><div class="cmp-k">平均点</div><div class="cmp-a">${aa?.n?(aa.n>1?fmt1(aa.avg):aa.avg)+'点':'記録なし'}</div><div class="cmp-b">${ab?.n?(ab.n>1?fmt1(ab.avg):ab.avg)+'点':'記録なし'}</div>
        <div class="cmp-k">記録した人</div><div class="cmp-a">${aa?.people||0}人</div><div class="cmp-b">${ab?.people||0}人</div></div></section>`:''}
      <section class="sec"><h3>ひとことで<small>SUMMARY</small></h3><p class="small" style="margin:0 0 6px">${esc(A.name)}</p><p style="margin:0 0 12px">${esc(A.desc)}</p><p class="small" style="margin:0 0 6px">${esc(B.name)}</p><p style="margin:0">${esc(B.desc)}</p></section>`;
  } else {
    body = `<p class="hint">2つの銘柄を選ぶと、基本情報・味わいの傾向・香りの違いを並べて比べられます。図鑑の銘柄ページの「比較」ボタンからも追加できます。</p>`;
  }
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="銘柄を比較">
    <div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 閉じる</button><h2>2つの銘柄を比較</h2>${A||B?`<button class="btn ghost" data-act="cmp-reset">クリア</button>`:'<span style="width:60px"></span>'}</div>
    <div class="sheet-body">
      <div class="cmp-head">${slot(A,'a')}<span class="vs">VS</span>${slot(B,'b')}</div>
      ${A&&B?`<div style="text-align:center"><button class="btn small ghost" data-act="swap">左右を入れ替え</button></div>`:''}
      ${body}
    </div></div>`);
  $('#sheet-root').onclick=e=>{
    const el=e.target.closest('[data-act],[data-pick],[data-open]'); if(!el) return;
    if(el.dataset.pick) return openComparePicker(el.dataset.pick);
    if(el.dataset.open) return openZukan(el.dataset.open);
    const act=el.dataset.act;
    if(act==='close') goBack();
    if(act==='cmp-reset'){ compare.a=null; compare.b=null; openCompare(); }
    if(act==='swap'){ [compare.a,compare.b]=[compare.b,compare.a]; openCompare(); }
  };
}
function openComparePicker(slot){
  curSheet={t:'cpick',slot};
  const other = slot==='a' ? compare.b : compare.a;
  const od = other ? zEntry(other)?.distilleryId : null;
  mount(`<div class="sheet" role="dialog" aria-modal="true" aria-label="比較する銘柄を選ぶ">
    <div class="sheet-bar"><button class="btn ghost" data-act="back">‹ 比較</button><h2>銘柄を選ぶ</h2><span style="width:60px"></span></div>
    <div class="sheet-body">
      <input class="search" id="cp-q" type="search" placeholder="${L.cpPh}" autocomplete="off">
      <div id="cp-list" class="list" style="padding-top:0"></div>
    </div></div>`);
  const draw=()=>{
    const q=norm($('#cp-q').value);
    let ds=ZD;
    if(q) ds=ds.filter(d=>norm([d.name,d.en,...d.ex.flatMap(x=>[x.name,x.en,x.label])].join(' ')).includes(q));
    // 比較相手と同じ蒸留所を先頭に
    if(od && !q) ds=[...ds].sort((a,b)=>(b.id===od)-(a.id===od));
    $('#cp-list').innerHTML = ds.slice(0,40).map(d=>`<div class="cp-group"><div class="group-name">${esc(d.name)} <span class="small">${esc(ZR[d.region]?.jp||'')}</span></div>
      <div class="chips">${d.ex.map(x=>`<button class="chip" data-cp="${esc(x.id)}" ${x.id===other?'disabled':''}>${esc(x.label)}</button>`).join('')}</div></div>`).join('')
      || '<p class="small">該当する銘柄がありません。</p>';
  };
  draw();
  const root=$('#sheet-root');
  root.oninput=e=>{ if(e.target.id==='cp-q') draw(); };
  root.onclick=e=>{
    const el=e.target.closest('[data-act],[data-cp]'); if(!el) return;
    if(el.dataset.cp){ compare[slot]=el.dataset.cp; goBack(); return; }
    if(el.dataset.act==='back') goBack();
  };
}

/* 写真を長辺1600pxのJPEGに縮小 */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,1600/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(),'image/jpeg',.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}
